<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>용우노트</title>
<meta name="description" content="삼성 노트처럼 쓰는 휴대폰 노트 — 폴더·체크리스트·손글씨·사진·PDF·A4 인쇄·백업. 자료는 이 기기에 저장되고 원하면 구글 드라이브로 PC·폰이 자동으로 맞춰집니다.">
<meta name="theme-color" content="#1d4ed8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="용우노트">
<meta name="color-scheme" content="light">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
:root{
  --brand:#1d4ed8; --brand-d:#16399e; --brand-soft:#e8eefc; --brand-line:#c2d3f7;
  --accent:#ffc93c; --accent-d:#e0a800;
  --ink:#1a1f2b; --muted:#65707f; --faint:#8f9aa8;
  --line:#dfe5ee; --bg:#f4f6fa; --card:#ffffff;
  --radius:18px; --shadow:0 1px 2px rgba(16,32,64,.05),0 8px 20px rgba(16,32,64,.07);
  --tap:46px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕","Noto Sans KR","Noto Sans CJK KR",system-ui,-apple-system,sans-serif;
  font-size:16.5px; line-height:1.5; -webkit-font-smoothing:antialiased;
  padding-bottom:calc(92px + env(safe-area-inset-bottom));
}
button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
h1,h2,h3,p{margin:0}
.hidden,.modal[hidden],#editor[hidden],#listView[hidden]{display:none !important}
[hidden]{display:none !important}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ── 상단 바 ───────────────────────────── */
.appbar{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line)}
.bar-in{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:6px;padding:8px 10px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#1d4ed8,#16399e);display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 3px 8px rgba(29,78,216,.3)}
.brand-tx{flex:1;min-width:0;display:flex;flex-direction:column;padding-left:4px}
.brand-tx h1{font-size:20px;font-weight:800;letter-spacing:-.4px;line-height:1.2}
.brand-tx .sub{font-size:12.5px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{min-width:var(--tap);min-height:var(--tap);border-radius:13px;font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center;color:#2b3546}
.ibtn:active{background:#eef1f7}

/* ── 구글 드라이브 ─────────────────────── */
.drive-wrap{max-width:820px;margin:0 auto;padding:8px 12px 0}
.drive-btn{width:100%;min-height:44px;display:flex;align-items:center;gap:8px;padding:0 12px;border-radius:13px;background:var(--card);border:1.5px solid var(--line);color:var(--brand);font-size:14.5px;font-weight:700;text-align:left;box-shadow:var(--shadow)}
.drive-btn .drive-ico{font-size:17px;line-height:1;flex:none}
.drive-btn .drive-txt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drive-btn .drive-hint{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;flex:none}
.drive-btn.on{background:#e9f7ee;border-color:#bfe3cd;color:#0b6b3a}
.drive-btn.sync{background:var(--brand-soft);border-color:var(--brand-line)}
.drive-btn.warn{background:#fff4e0;border-color:#eccfa2;color:#8a4b00}

/* ── 검색 ──────────────────────────────── */
.search-row{max-width:820px;margin:8px auto 0;padding:0 12px;display:flex;align-items:center;gap:6px}
.search-row .s-ico{font-size:16px;color:var(--muted);padding-left:12px}
.search-row input{flex:1;min-width:0;height:46px;border:1.5px solid var(--line);border-radius:13px;background:#fff;padding:0 12px;font-size:16px;outline:none}
.search-row input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(29,78,216,.12)}
.search-row .s-ico,.search-row input{margin-left:-4px}
.search-row button{min-width:44px;height:44px;border-radius:11px;font-size:16px;color:var(--muted)}

/* ── 폴더 칩 ──────────────────────────── */
.folder-bar{display:flex;gap:8px;overflow-x:auto;padding:12px 12px 4px;max-width:820px;margin:0 auto;scrollbar-width:none}
.folder-bar::-webkit-scrollbar{display:none}
.fchip{min-height:40px;padding:0 14px;border-radius:20px;background:#fff;border:1.5px solid var(--line);font-size:15px;font-weight:700;color:#3a4555;white-space:nowrap;flex:none;display:inline-flex;align-items:center;gap:5px}
.fchip.on{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 3px 10px rgba(29,78,216,.28)}
.fchip.add{border-style:dashed;color:var(--brand)}
.fchip.trash{color:#a33}
.fchip.trash.on{background:#b3261e;border-color:#b3261e;color:#fff}
.fchip:active{transform:scale(.98)}

main{max-width:820px;margin:0 auto;padding:8px 12px 0}
.list-tools{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 2px 8px}
#listCount{font-size:14px;font-weight:700;color:var(--muted)}
.lt-right{display:flex;gap:6px}
.chip-sort{min-height:36px;padding:0 10px;border-radius:11px;background:#fff;border:1.5px solid var(--line);font-size:13.5px;font-weight:700;color:#3a4555}
.chip-sort.on{background:var(--brand-soft);border-color:var(--brand-line);color:var(--brand-d)}

.sec-title{font-size:14px;font-weight:800;color:var(--muted);margin:6px 2px 8px;letter-spacing:-.2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;align-items:start}
.grid.list{grid-template-columns:1fr;gap:8px}

/* ── 노트 카드 ────────────────────────── */
.card-note{position:relative;background:var(--card);border-radius:16px;padding:11px 12px 9px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:5px;min-height:132px;border:1.5px solid #fff;overflow:hidden}
.card-note:active{border-color:var(--brand-line)}
.card-note .cn-top{display:flex;align-items:center;gap:5px;min-height:18px}
.tag-folder{font-size:11.5px;font-weight:800;padding:2px 7px;border-radius:7px;background:var(--brand-soft);color:var(--brand-d);white-space:nowrap;max-width:96px;overflow:hidden;text-overflow:ellipsis}
.cn-flags{margin-left:auto;font-size:12px;letter-spacing:-1px;color:var(--accent-d)}
.cn-title{font-size:16px;font-weight:800;line-height:1.32;letter-spacing:-.3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all;overflow-wrap:anywhere}
.cn-snip{font-size:13px;color:var(--muted);line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all;overflow-wrap:anywhere;flex:1}
.cn-thumb{width:100%;height:74px;border-radius:10px;object-fit:cover;background:#eef1f7;display:block;margin-bottom:2px}
.cn-foot{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:var(--faint);font-weight:700;padding-top:2px}
.cn-sel{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:#fff;display:none;align-items:center;justify-content:center;font-size:13px;color:#fff}
body.selecting .cn-sel{display:flex}
.card-note.picked{outline:2.5px solid var(--brand);outline-offset:-2px}
.card-note.picked .cn-sel{background:var(--brand);border-color:var(--brand);color:#fff}

/* 목록 보기 */
.grid.list .card-note{min-height:0;flex-direction:row;align-items:center;gap:10px;padding:11px 12px}
.grid.list .card-note .cn-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.grid.list .cn-title{-webkit-line-clamp:1}
.grid.list .cn-snip{-webkit-line-clamp:1;font-size:12.5px}
.grid.list .cn-thumb{width:46px;height:46px;border-radius:9px;margin:0;flex:none}
.grid.list .cn-foot{flex-direction:column;align-items:flex-end;gap:2px;min-width:44px}
.grid.list .card-note .cn-top{display:none}

/* 휴지통 카드 */
.card-note.trash .cn-del{font-size:11.5px;color:#a33;font-weight:700}
.trash-acts{display:flex;gap:6px;margin-top:4px}
.trash-acts button{flex:1;min-height:38px;border-radius:10px;font-size:13px;font-weight:800;background:#f0f3f8;color:#33415a}
.trash-acts button.restore{background:var(--brand-soft);color:var(--brand-d)}
.trash-acts button.perm{background:#fdecea;color:#a3261e}
.trash-tools{padding:6px 0 18px;display:flex;justify-content:center}
.btn{min-height:46px;padding:0 16px;border-radius:12px;font-size:15px;font-weight:800;background:#eef1f7;color:#2b3546;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--brand);color:#fff;box-shadow:0 4px 12px rgba(29,78,216,.25)}
.btn.danger{background:#b3261e;color:#fff}
.btn.danger-line{background:#fff;border:1.5px solid #e5b4ae;color:#a3261e}

.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty .em-ico{font-size:44px;line-height:1;margin-bottom:10px}
.empty p{font-size:15px;font-weight:700;margin-bottom:14px}

.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;background:var(--brand);color:#fff;font-size:30px;font-weight:400;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(29,78,216,.38);z-index:35;line-height:1}
.fab:active{transform:scale(.96)}

.sel-bar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -6px 18px rgba(16,32,64,.1)}
.sel-bar .sel-count{flex:1;text-align:left;font-size:14px;font-weight:800;color:var(--brand-d);padding-left:6px}
.sel-bar button:not(.sel-count){min-height:46px;padding:0 14px;border-radius:11px;font-size:14px;font-weight:800;background:#eef1f7;color:#2b3546}
.sel-bar #selPrint{background:var(--brand);color:#fff}
.sel-bar #selDel{background:#fdecea;color:#a3261e}

/* ── 편집기 ───────────────────────────── */
#editor{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column}
.ed-bar{display:flex;align-items:center;gap:2px;background:#fff;border-bottom:1px solid var(--line);padding:6px 6px;flex:none}
.ed-state{flex:1;font-size:12.5px;font-weight:700;color:var(--faint);padding-left:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ebtn{min-width:44px;height:44px;border-radius:12px;font-size:19px;display:flex;align-items:center;justify-content:center;color:#2b3546}
.ebtn:active{background:#eef1f7}
.ebtn.on{background:var(--brand-soft);color:var(--brand-d)}
.ebtn.save{background:var(--brand);color:#fff;font-size:14.5px;font-weight:800;padding:0 13px;min-width:auto;height:40px;border-radius:11px}

.ed-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 12px 20px;max-width:820px;width:100%;margin:0 auto}
.paper{background:#fff;border-radius:16px;padding:14px 15px 26px;box-shadow:var(--shadow);min-height:62vh;transition:background .15s}
.paper.p-white{background:#fff}
.paper.p-yellow{background:#fffbe8}
.paper.p-blue{background:#edf4ff}
.paper.p-lined{background:#fff}
.paper.p-lined .ed-body{line-height:32px;background-image:linear-gradient(transparent 31px,#dfe8f7 31px,#dfe8f7 32px);background-size:100% 32px;background-position:0 0;background-attachment:local;padding-left:2px}
.ed-title{width:100%;border:0;outline:none;background:transparent;font-size:23px;font-weight:800;letter-spacing:-.5px;padding:2px 0 4px;line-height:1.3}
.ed-title::placeholder{color:#b3bcc8;font-weight:700}
.ed-meta{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);font-weight:700;padding:2px 0 4px}
.meta-btn{font-size:12.5px;font-weight:800;color:var(--brand-d);background:var(--brand-soft);padding:3px 9px;border-radius:8px}
.ed-tagrow{display:flex;align-items:center;gap:6px;border-bottom:1px solid rgba(120,140,170,.16);padding-bottom:8px;margin-bottom:8px}
.ed-tagrow .tag-hash{width:20px;height:20px;border-radius:6px;background:var(--brand-soft);color:var(--brand-d);font-size:12.5px;font-weight:900;display:flex;align-items:center;justify-content:center;flex:none}
.ed-tags{flex:1;min-width:0;border:0;outline:none;background:transparent;font-size:13px;color:var(--muted);padding:0;font-weight:600}
.ed-tags::placeholder{color:#b3bcc8}
.ed-body{outline:none;font-size:17px;line-height:1.72;min-height:220px;word-break:keep-all;overflow-wrap:anywhere;padding-top:4px}
.ed-body:empty:before{content:attr(data-ph);color:#b3bcc8}
.ed-body div,.ed-body p{margin:0 0 2px}
.ed-body ul,.ed-body ol{margin:4px 0 6px;padding-left:22px}
.ed-body li{margin:2px 0}
.ed-body b,.ed-body strong{font-weight:800}
.ed-body img.in-img{max-width:100%;height:auto;border-radius:10px;margin:8px 0;display:block;background:#f2f5fa}
.ed-body blockquote{margin:6px 0;padding:4px 12px;border-left:4px solid var(--brand-line);color:#3d4a5d}
.ed-body .todo{display:flex;align-items:flex-start;gap:8px;margin:3px 0}
.ed-body .todo .ck{display:inline-flex;width:21px;height:21px;border:2px solid #9aa7b8;border-radius:6px;flex:none;align-items:center;justify-content:center;font-size:14px;line-height:1;color:transparent;background:#fff;margin-top:3px;user-select:none;-webkit-user-select:none}
.ed-body .todo .ck::after{content:'';font-size:14px;line-height:1;font-weight:900}
.ed-body .todo.done .ck{background:var(--brand);border-color:var(--brand);color:#fff}
.ed-body .todo.done .ck::after{content:'✓'}
.ed-body .todo.done .tx{color:#95a0ae;text-decoration:line-through}
.att-block{background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:11px 12px;margin-top:10px}
.att-head{font-size:13px;font-weight:800;color:var(--muted);margin-bottom:8px}
.att-strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.att-strip::-webkit-scrollbar{display:none}
.att-item{position:relative;width:78px;height:78px;border-radius:12px;overflow:hidden;background:#eef1f7;flex:none;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--line)}
.att-item img{width:100%;height:100%;object-fit:cover;display:block}
.att-item .att-ico{font-size:26px}
.att-item .att-name{position:absolute;left:0;right:0;bottom:0;background:rgba(10,20,35,.62);color:#fff;font-size:9.5px;font-weight:700;padding:2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.ed-hint{font-size:12px;color:var(--faint);text-align:center;margin-top:12px;font-weight:600;line-height:1.6}

.ed-tools{flex:none;display:flex;align-items:center;gap:4px;overflow-x:auto;background:#fff;border-top:1px solid var(--line);padding:7px 9px calc(7px + env(safe-area-inset-bottom));scrollbar-width:none}
.ed-tools::-webkit-scrollbar{display:none}
.tbtn{min-width:41px;height:43px;border-radius:12px;font-size:18px;font-weight:700;color:#2b3546;display:flex;align-items:center;justify-content:center;flex:none;background:#f4f6fa;border:1.5px solid transparent}
.tbtn:active,.tbtn.on{background:var(--brand-soft);border-color:var(--brand-line);color:var(--brand-d)}
.tbtn.hl{background:#fff6da}
.tbtn.hl:active{background:#ffe9a8}
.tsep{width:1px;height:26px;background:var(--line);flex:none;margin:0 3px}

/* ── 모달 공통 ────────────────────────── */
.modal{position:fixed;inset:0;z-index:80;background:rgba(13,24,40,.48);display:flex;align-items:flex-end;justify-content:center;padding:0}
.modal.mid{align-items:center;padding:16px}
.sheet{background:#fff;width:100%;max-width:600px;max-height:86vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:6px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(10,20,40,.28)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:10px 0 8px;position:sticky;top:0;background:#fff;z-index:2}
.sheet-head h2{font-size:17px;font-weight:800;letter-spacing:-.3px}
.sheet-head button{width:40px;height:40px;border-radius:11px;font-size:17px;color:var(--muted)}
.sheet-row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:52px;padding:6px 2px;border-bottom:1px solid #eef1f6;width:100%;text-align:left}
.sheet-row:last-child{border-bottom:0}
.sheet-row .sr-l{display:flex;align-items:center;gap:10px;min-width:0}
.sheet-row .sr-ico{font-size:19px;width:26px;text-align:center;flex:none}
.sheet-row .sr-tx{font-size:15.5px;font-weight:700;display:flex;flex-direction:column;gap:1px;min-width:0}
.sheet-row .sr-tx small{font-size:12px;font-weight:600;color:var(--muted)}
.sheet-row .sr-v{font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.sheet-row.danger .sr-tx{color:#a3261e}
.sheet-note{font-size:12.5px;color:var(--muted);line-height:1.6;padding:10px 2px 4px;font-weight:600}
.sheet-sec{font-size:12.5px;font-weight:800;color:var(--faint);padding:16px 2px 4px;letter-spacing:.2px}
.sheet .btn{width:100%;margin-top:8px}
.folder-pick{display:flex;flex-wrap:wrap;gap:8px;padding:6px 0 10px}
.folder-pick button{min-height:44px;padding:0 15px;border-radius:12px;background:#f4f6fa;border:1.5px solid var(--line);font-size:14.5px;font-weight:700;color:#33415a}
.folder-pick button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.style-pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:6px 0 12px}
.style-pick button{height:92px;border-radius:14px;border:2px solid var(--line);font-size:13.5px;font-weight:800;display:flex;align-items:flex-end;justify-content:center;padding-bottom:9px;color:#33415a}
.style-pick button.on{border-color:var(--brand);box-shadow:0 0 0 3px rgba(29,78,216,.14)}
.sz-row{display:flex;gap:8px;padding:8px 0 12px}
.sz-row button{flex:1;min-height:64px;border-radius:13px;background:#f4f6fa;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;color:#243044}
.sz-row button:nth-child(1){font-size:14px}.sz-row button:nth-child(2){font-size:17px}
.sz-row button:nth-child(3){font-size:21px}.sz-row button:nth-child(4){font-size:26px}
.add-folder-row{display:flex;gap:8px;padding:8px 0 4px}
.add-folder-row input{flex:1;min-width:0;height:48px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;font-size:16px;outline:none}
.add-folder-row input:focus{border-color:var(--brand)}
.add-folder-row .btn{min-width:84px}

/* 확인 창 */
.confirm-box{background:#fff;border-radius:18px;width:100%;max-width:340px;padding:20px 18px 16px;box-shadow:0 12px 40px rgba(10,20,40,.3);text-align:center}
.confirm-box p{font-size:15.5px;font-weight:700;line-height:1.55;margin-bottom:16px}
.confirm-btns{display:flex;gap:8px}
.confirm-btns button{flex:1;min-height:48px;border-radius:12px;font-size:15px;font-weight:800;background:#eef1f7;color:#33415a}
.confirm-btns #confirmYes{background:var(--brand);color:#fff}
.confirm-btns #confirmYes.danger{background:#b3261e}

/* 뷰어 */
.viewer-box{width:100%;max-width:900px;height:100%;display:flex;flex-direction:column;background:#0d1420}
.viewer-bar{display:flex;align-items:center;gap:8px;padding:10px 12px;color:#fff;font-size:14px;font-weight:700}
.viewer-bar span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.viewer-bar button{width:42px;height:42px;border-radius:11px;background:rgba(255,255,255,.14);color:#fff;font-size:16px}
.viewer-body{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:6px}
.viewer-body img{max-width:100%;max-height:100%;object-fit:contain}
.viewer-body iframe{width:100%;height:100%;border:0;background:#fff;border-radius:10px}
.viewer-foot{padding:10px 12px calc(14px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center}
.viewer-foot button{min-height:46px;padding:0 16px;border-radius:12px;font-size:14.5px;font-weight:800;background:rgba(255,255,255,.15);color:#fff}
.viewer-foot button.main{background:var(--brand)}

/* 손글씨 */
.modal.full{padding:0;align-items:stretch}
.draw-box{width:100%;height:100%;background:#fff;display:flex;flex-direction:column}
.draw-bar{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line)}
.draw-bar b{flex:1;text-align:center;font-size:16.5px}
.draw-bar button{min-height:44px;padding:0 13px;border-radius:11px;font-size:14.5px;font-weight:800;color:#33415a;background:#f2f5fa}
.draw-bar button.save{background:var(--brand);color:#fff}
.draw-tools{display:block;padding:7px 10px;border-bottom:1px solid var(--line)}
.dt-row{display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none}
.dt-row::-webkit-scrollbar{display:none}
.dt-acts{margin-top:7px}
.swatches{display:flex;gap:6px;align-items:center}
.sw{width:32px;height:32px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 0 0 1.5px var(--line);flex:none}
.sw.on{box-shadow:0 0 0 3px var(--brand)}
.widths{display:flex;gap:4px;align-items:center;margin-left:4px;padding-left:6px;border-left:1px solid var(--line)}
.wd{width:34px;height:34px;border-radius:10px;background:#f2f5fa;display:flex;align-items:center;justify-content:center;flex:none}
.wd i{display:block;background:#33415a;border-radius:50%}
.wd.on{background:var(--brand-soft);box-shadow:inset 0 0 0 1.5px var(--brand-line)}
.draw-tools .db{min-height:34px;height:34px;padding:0 10px;border-radius:10px;background:#f2f5fa;font-size:13.5px;font-weight:800;color:#33415a;white-space:nowrap}
.draw-tools .db.on{background:var(--brand-soft);color:var(--brand-d)}
.draw-wrap{flex:1;position:relative;background:#fff;overflow:hidden;touch-action:none}
.draw-wrap.paper-lined{background-image:linear-gradient(#e6ecf6 1px,transparent 1px);background-size:100% 36px}
#drawCanvas{position:absolute;inset:0;display:block;touch-action:none}
.draw-empty{position:absolute;left:0;right:0;top:42%;text-align:center;color:#b3bcc8;font-size:14px;font-weight:700;pointer-events:none}

/* 인쇄 미리보기 */
.print-card{background:#e9edf4;width:100%;max-width:820px;height:100%;display:flex;flex-direction:column;border-radius:0}
.print-head{display:flex;align-items:center;gap:8px;background:#fff;padding:8px 12px;border-bottom:1px solid var(--line)}
.print-head b{flex:1;font-size:16px}
.print-head button{width:42px;height:42px;border-radius:11px;font-size:16px;color:var(--muted)}
.print-opts{display:flex;gap:14px;background:#fff;padding:8px 14px;font-size:13.5px;font-weight:700;color:#33415a;border-bottom:1px solid var(--line);flex-wrap:wrap}
.print-opts label{display:flex;align-items:center;gap:6px}
.print-opts input{width:18px;height:18px}
.preview-wrap{flex:1;overflow:auto;padding:12px;display:flex;justify-content:center}
.print-foot{background:#fff;padding:8px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--line)}
.print-foot .btn{min-height:48px;padding:0 22px}

/* A4 인쇄물 */
.paper-print{width:794px;background:#fff;padding:56px 52px;box-sizing:border-box;color:#111;font-size:11pt;line-height:1.6;flex:none;box-shadow:0 6px 24px rgba(10,20,40,.18)}
.paper-print .pd-head{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:2px solid #111;padding-bottom:8px;margin-bottom:16px}
.paper-print .pd-name{font-size:13pt;font-weight:800;letter-spacing:1px}
.paper-print .pd-date{font-size:8.5pt;color:#444}
.paper-print .pn-title{font-size:18pt;font-weight:800;line-height:1.32;margin:0 0 6px;letter-spacing:-.4px}
.paper-print .pn-meta{font-size:8.5pt;color:#555;padding-bottom:10px;border-bottom:1px solid #ddd;margin-bottom:12px}
.paper-print .pn-body{font-size:10.5pt;line-height:1.72;word-break:break-word}
.paper-print .pn-body div,.paper-print .pn-body p{margin:0 0 3px}
.paper-print .pn-body ul,.paper-print .pn-body ol{margin:4px 0 8px;padding-left:20px}
.paper-print .pn-body img{max-width:100%;max-height:110mm;width:auto;height:auto;display:block;margin:8px auto;border-radius:4px}
.paper-print .pn-body .todo{display:flex;gap:6px;align-items:flex-start}
.paper-print .pn-body .todo .ck{width:12px;height:12px;border:1.4px solid #444;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;flex:none;margin-top:3px;font-size:9px;line-height:1;color:#fff}
.paper-print .pn-body .todo .ck::after{content:''}
.paper-print .pn-body .todo.done .ck{background:#111;border-color:#111}
.paper-print .pn-body .todo.done .ck::after{content:'✓'}
.paper-print .pn-body .todo.done .tx{text-decoration:line-through;color:#666}
.paper-print .pn-atts{margin-top:16px;border-top:1px dashed #ccc;padding-top:10px}
.paper-print .pn-atts h4{font-size:9pt;color:#444;margin:0 0 8px}
.paper-print .pn-photos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.paper-print .pn-photos img{width:100%;height:auto;border:1px solid #ddd;border-radius:3px}
.paper-print .pn-tags{font-size:8.5pt;color:#666;margin-top:10px}
.paper-print .pn-foot{margin-top:18px;padding-top:8px;border-top:1px solid #eee;font-size:7.5pt;color:#999;display:flex;justify-content:space-between}
.paper-print .pn-file{font-size:8.5pt;color:#444;padding:2px 0}
.paper-print .print-note + .print-note{break-before:page;page-break-before:always;margin-top:0}

#printRoot{display:none}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));z-index:120;background:rgba(20,30,45,.94);color:#fff;font-size:14px;font-weight:700;padding:11px 16px;border-radius:12px;max-width:88vw;text-align:center;box-shadow:0 8px 22px rgba(10,20,40,.3);line-height:1.45}

@media (max-width:360px){
  .grid{grid-template-columns:1fr}
  .ed-body{font-size:16px}
}
@media print{
  html,body{background:#fff !important;padding:0 !important;margin:0 !important}
  #listView,#editor,.modal,.fab,#toast,.sel-bar{display:none !important}
  #printRoot{display:block !important}
  .paper-print{width:auto;box-shadow:none;padding:0}
  @page{size:A4;margin:15mm 14mm 16mm}
}
</style>

<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════
   용우노트 — 삼성 노트 스타일 휴대폰 노트 (단일 파일 PWA)
   자료는 이 기기의 IndexedDB 에 저장되고, 원하면 구글 드라이브
   앱 전용 공간(appDataFolder)으로 PC·폰 자동 동기화합니다.
   ═══════════════════════════════════════════════════════════════ */

var APP_NAME = '용우노트';
var APP_VERSION = '1.0.0';
var DB_NAME = 'yongwoo-note';
var DB_VER = 1;
var MAX_ONE = 8 * 1024 * 1024;
var MAX_ALL = 30 * 1024 * 1024;
var SYNC_KEY = 'yongwooNote.sync.v1';
var PREF_KEY = 'yongwooNote.pref.v1';
var SYNC_FILE = 'yongwoo-note-sync.json';
var BUILTIN_FOLDERS = [
  { id: 'f-work', name: '업무' },
  { id: 'f-cust', name: '고객' },
  { id: 'f-farm', name: '농장' },
  { id: 'f-me', name: '개인' }
];
var PAGE_STYLES = [
  { id: 'white', name: '흰색' },
  { id: 'yellow', name: '연노랑' },
  { id: 'blue', name: '연파랑' },
  { id: 'lined', name: '줄노트' }
];

var $ = function (sel, root) { return (root || document).querySelector(sel); };
var $$ = function (sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); };

function esc(s) {
  return String(s === undefined || s === null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function pad2(n) { return String(n).padStart(2, '0'); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function isoOf(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function fmtDateKr(t) {
  var d = new Date(Number(t) || 0);
  if (!t) return '';
  return d.getFullYear() + '.' + pad2(d.getMonth() + 1) + '.' + pad2(d.getDate());
}
function fmtDateTime(t) {
  var d = new Date(Number(t) || 0);
  return fmtDateKr(t) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}
function fmtSize(b) {
  b = Number(b) || 0;
  if (b < 1024) return b + 'B';
  if (b < 1024 * 1024) return (b / 1024).toFixed(0) + 'KB';
  return (b / 1024 / 1024).toFixed(1) + 'MB';
}
function localTime(t) {
  var d = new Date(Number(t) || 0);
  return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}
function cardDate(t) {
  var d = new Date(Number(t) || 0);
  var now = new Date();
  if (isoOf(d) === isoOf(now)) return localTime(t);
  if (d.getFullYear() === now.getFullYear()) return (d.getMonth() + 1) + '.' + d.getDate() + '.';
  return d.getFullYear() + '.' + (d.getMonth() + 1) + '.' + d.getDate() + '.';
}
function bytesOf(str) { return Math.round(String(str || '').length * 0.75); }

/* ── IndexedDB ─────────────────────────────────────────── */
var _db = null;
function dbOpen() {
  if (_db) return Promise.resolve(_db);
  return new Promise(function (resolve, reject) {
    var rq = indexedDB.open(DB_NAME, DB_VER);
    rq.onupgradeneeded = function () {
      var db = rq.result;
      if (!db.objectStoreNames.contains('notes')) {
        var n = db.createObjectStore('notes', { keyPath: 'id' });
        n.createIndex('updatedAt', 'updatedAt', { unique: false });
      }
      if (!db.objectStoreNames.contains('folders')) {
        db.createObjectStore('folders', { keyPath: 'id' });
      }
      if (!db.objectStoreNames.contains('attachments')) {
        var a = db.createObjectStore('attachments', { keyPath: 'id' });
        a.createIndex('noteId', 'noteId', { unique: false });
      }
      if (!db.objectStoreNames.contains('meta')) {
        db.createObjectStore('meta', { keyPath: 'key' });
      }
    };
    rq.onsuccess = function () { _db = rq.result; resolve(_db); };
    rq.onerror = function () { reject(rq.error || new Error('저장소를 열지 못했습니다')); };
    rq.onblocked = function () { reject(new Error('저장소가 다른 창에서 쓰이고 있습니다. 앱을 모두 닫고 다시 열어 주세요.')); };
  });
}
function dbAll(store) {
  return dbOpen().then(function (db) {
    return new Promise(function (resolve, reject) {
      var t = db.transaction(store, 'readonly');
      var r = t.objectStore(store).getAll();
      r.onsuccess = function () { resolve(r.result || []); };
      r.onerror = function () { reject(r.error); };
    });
  });
}
function dbPut(store, val) {
  return dbOpen().then(function (db) {
    return new Promise(function (resolve, reject) {
      var t = db.transaction(store, 'readwrite');
      t.objectStore(store).put(val);
      t.oncomplete = function () { resolve(val); };
      t.onerror = function () { reject(t.error); };
    });
  });
}
function dbPutMany(store, vals) {
  if (!vals || !vals.length) return Promise.resolve();
  return dbOpen().then(function (db) {
    return new Promise(function (resolve, reject) {
      var t = db.transaction(store, 'readwrite');
      var os = t.objectStore(store);
      vals.forEach(function (v) { os.put(v); });
      t.oncomplete = function () { resolve(); };
      t.onerror = function () { reject(t.error); };
    });
  });
}
function dbDel(store, key) {
  return dbOpen().then(function (db) {
    return new Promise(function (resolve, reject) {
      var t = db.transaction(store, 'readwrite');
      t.objectStore(store).delete(key);
      t.oncomplete = function () { resolve(); };
      t.onerror = function () { reject(t.error); };
    });
  });
}
function dbClear(store) {
  return dbOpen().then(function (db) {
    return new Promise(function (resolve, reject) {
      var t = db.transaction(store, 'readwrite');
      t.objectStore(store).clear();
      t.oncomplete = function () { resolve(); };
      t.onerror = function () { reject(t.error); };

}

/* ── 상태 ─────────────────────────────────────────────── */
var S = {
  notes: [],
  folders: [],
  atts: [],
  q: '',
  folder: 'all',
  view: 'grid',
  sort: 'upd',
  selecting: false,
  selected: {},
  ed: null,
  edNew: false,
  dirty: false,
  edAtts: [],
  printList: [],
  sheetKind: '',
  lastDeleted: null,
  saveTimer: null
};
var urlCache = new Map();

function attOf(id) {
  for (var i = 0; i < S.atts.length; i++) { if (S.atts[i].id === id) return S.atts[i]; }
  return null;
}
function attURL(a) {
  if (!a || !a.blob) return '';
  if (!urlCache.has(a.id)) urlCache.set(a.id, URL.createObjectURL(a.blob));
  return urlCache.get(a.id);
}
function forgetURL(id) {
  if (urlCache.has(id)) { try { URL.revokeObjectURL(urlCache.get(id)); } catch (e) {} urlCache.delete(id); }
}
function attsOf(noteId) {
  return S.atts.filter(function (a) { return a.noteId === noteId; });
}
function noteById(id) {
  for (var i = 0; i < S.notes.length; i++) { if (S.notes[i].id === id) return S.notes[i]; }
  return null;
}
function isImageAtt(a) {
  return !!a && (/^image\//.test(a.type || '') || /\.(jpe?g|png|gif|webp|heic|heif|bmp)$/i.test(a.name || ''));
}
function isPdfAtt(a) { return !!a && ((a.type || '') === 'application/pdf' || /\.pdf$/i.test(a.name || '')); }
function folderName(id) {
  for (var i = 0; i < S.folders.length; i++) { if (S.folders[i].id === id) return S.folders[i].name; }
  return '기타';
}
function existsFolder(id) {
  for (var i = 0; i < S.folders.length; i++) { if (S.folders[i].id === id) return true; }
  return false;
}

function prefs() {
  try { return JSON.parse(localStorage.getItem(PREF_KEY)) || {}; } catch (e) { return {}; }
}
function setPrefs(p) {
  var c = prefs();
  Object.keys(p).forEach(function (k) { c[k] = p[k]; });
  try { localStorage.setItem(PREF_KEY, JSON.stringify(c)); } catch (e) {}
}

/* ── 동기화 표시(수정 버전·삭제 표시) ──────────────────── */
function syncState() {
  try { return JSON.parse(localStorage.getItem(SYNC_KEY)) || {}; } catch (e) { return {}; }
}
function saveSyncState(st) {
  try { localStorage.setItem(SYNC_KEY, JSON.stringify(st)); } catch (e) {}
}
function bumpRev() {
  var st = syncState();
  /* 기기 시계가 서로 달라도(다른 기기의 미래 시각) 이 기기의 수정이 묻히지 않도록 항상 더 크게 올립니다. */
  st.rev = Math.max(Date.now(), (Number(st.rev) || 0) + 1);
  saveSyncState(st);
  if (window.NoteDrive) NoteDrive.markChange();
}

/* ── 글 다루기 ────────────────────────────────────────── */
function sanitizeHTML(html) {
  var d = document.createElement('div');
  d.innerHTML = String(html || '');
  $$('script,style,iframe,object,embed,link,meta,noscript', d).forEach(function (n) { n.parentNode.removeChild(n); });
  $$('*', d).forEach(function (el) {
    Array.prototype.slice.call(el.attributes).forEach(function (at) {
      var nm = at.name.toLowerCase();
      if (nm.indexOf('on') === 0) el.removeAttribute(at.name);
      else if ((nm === 'href' || nm === 'src') && /^\s*javascript:/i.test(at.value)) el.removeAttribute(at.name);
    });
  });
  return d.innerHTML;
}
/* 저장용 본문: 첨부 이미지의 blob 주소는 지우고 data-att 만 남깁니다(다른 기기에서 다시 붙임). */
function cleanBody(html) {
  var d = document.createElement('div');
  d.innerHTML = sanitizeHTML(html);
  /* 줄 구조 정리: 본문 맨 앞의 맨 글자를 <div>로 감싸 줄바꿈이 유지되게 합니다. */
  Array.prototype.slice.call(d.childNodes).forEach(function (node) {
    if (node.nodeType === 3 && node.textContent.trim()) {
      var w = document.createElement('div');
      d.replaceChild(w, node);
      w.appendChild(node);
    }
  });
  $$('img', d).forEach(function (img) {
    var id = img.getAttribute('data-att');
    if (id) {
      img.removeAttribute('src');
      img.setAttribute('class', 'in-img');
      img.setAttribute('alt', img.getAttribute('alt') || '첨부 이미지');
      Array.prototype.slice.call(img.attributes).forEach(function (at) {
        if (['data-att', 'class', 'alt'].indexOf(at.name) < 0) img.removeAttribute(at.name);
      });
    } else {
      img.parentNode.removeChild(img);
    }
  });
  $$('span', d).forEach(function (sp) {
    if (sp.getAttribute('contenteditable') === 'false') sp.setAttribute('contenteditable', 'false');
  });
  return d.innerHTML;
}
/* 화면·인쇄용: data-att 이미지에 실제 그림 주소를 붙입니다. */
function hydrate(root) {
  if (!root) return;
  $$('img[data-att]', root).forEach(function (img) {
    var a = attOf(img.getAttribute('data-att'));
    if (a && a.kind !== 'pdf') {
      var u = attURL(a);
      if (u) img.setAttribute('src', u);
    } else {
      img.style.display = 'none';
    }
  });
}
function nodeText(n) {
  var s = '';
  Array.prototype.forEach.call(n.childNodes || [], function (c) {
    if (c.nodeType === 3) { s += c.textContent; return; }
    if (c.nodeType !== 1) return;
    var tag = c.tagName.toLowerCase();
    if (tag === 'br') { s += '\n'; return; }
    if (tag === 'img') { s += ' [이미지] '; return; }
    var inner = nodeText(c);
    var cls = c.className || '';
    if (typeof cls === 'string' && cls.indexOf('todo') >= 0) {
      var done = (' ' + cls + ' ').indexOf(' done ') >= 0;
      inner = (done ? '☑ ' : '☐ ') + inner;
    }
    if (tag === 'li') inner = '• ' + inner;
    if ((tag === 'div' || tag === 'p' || tag === 'li') && inner && inner.slice(-1) !== '\n') inner += '\n';
    s += inner;
  });
  return s;
}
function htmlToText(html) {
  var d = document.createElement('div');
  d.innerHTML = String(html || '');
  return nodeText(d).replace(/\n{3,}/g, '\n\n').replace(/[ \t]+\n/g, '\n').trim();
}
function snippetOf(n, max) {
  var t = htmlToText(n.body).replace(/\s*\n\s*/g, ' ').replace(/\s{2,}/g, ' ').trim();
  if (t.length > (max || 120)) t = t.slice(0, max || 120) + '…';
  return t;
}
function tagsOf(n) {
  return Array.isArray(n.tags) ? n.tags.filter(Boolean) : [];
}
function haystack(n) {
  var parts = [n.title || '', htmlToText(n.body), tagsOf(n).join(' '), folderName(n.folderId)];
  attsOf(n.id).forEach(function (a) { parts.push(a.name || ''); });
  return parts.join(' ').toLowerCase();
}

/* ── 불러오기 ─────────────────────────────────────────── */
function loadData() {
  return Promise.all([dbAll('notes'), dbAll('folders'), dbAll('attachments')]).then(function (r) {
    S.notes = (r[0] || []).map(normNote);
    S.folders = (r[1] || []).map(normFolder).sort(byFolderOrder);
    S.atts = r[2] || [];
    if (!S.folders.length) {
      var now = Date.now();
      S.folders = BUILTIN_FOLDERS.map(function (f, i) {
        return { id: f.id, name: f.name, builtin: true, order: i, createdAt: now, updatedAt: now };
      });
      return dbPutMany('folders', S.folders);
    }
    return null;
  });
}
function normNote(n) {
  return {
    id: n.id, title: n.title || '', body: n.body || '',
    folderId: n.folderId || 'f-work', tags: Array.isArray(n.tags) ? n.tags : [],
    pinned: !!n.pinned, starred: !!n.starred, style: n.style || 'white',
    createdAt: Number(n.createdAt) || Date.now(),
    updatedAt: Number(n.updatedAt) || Number(n.createdAt) || Date.now(),
    deletedAt: Number(n.deletedAt) || 0,
    sample: !!n.sample
  };
}
function normFolder(f) {
  return {
    id: f.id, name: f.name || '폴더', builtin: !!f.builtin,
    order: Number(f.order) || 0,
    createdAt: Number(f.createdAt) || Date.now(),
    updatedAt: Number(f.updatedAt) || Number(f.createdAt) || Date.now()
  };
}
function byFolderOrder(a, b) {
  if (a.builtin !== b.builtin) return a.builtin ? -1 : 1;
  return (a.order || 0) - (b.order || 0);
}
function upsertLocal(list, item) {
  for (var i = 0; i < list.length; i++) {
    if (list[i].id === item.id) { list[i] = item; return; }
  }
  list.push(item);
}

/* ── 목록 그리기 ──────────────────────────────────────── */
function visibleNotes() {
  var q = S.q.trim().toLowerCase();
  var words = q ? q.split(/\s+/) : [];
  var arr = S.notes.filter(function (n) {
    if (S.folder === 'trash') return !!n.deletedAt;
    if (n.deletedAt) return false;
    if (S.folder === 'star') return !!n.starred;
    if (S.folder !== 'all' && n.folderId !== S.folder) return false;
    return true;
  });
  if (words.length) {
    arr = arr.filter(function (n) {
      var hay = haystack(n);
      return words.every(function (w) { return hay.indexOf(w) >= 0; });
    });
  }
  var dir = S.sort === 'title' ? 1 : -1;
  arr.sort(function (a, b) {
    if (S.sort === 'title') {
      var at = (a.title || '(제목 없음)'), bt = (b.title || '(제목 없음)');
      var c = at.localeCompare(bt, 'ko');
      if (c) return c;
      return (b.updatedAt || 0) - (a.updatedAt || 0);
    }
    return dir * ((b.updatedAt || 0) - (a.updatedAt || 0));
  });
  return arr;
}

function cardHTML(n) {
  var img = null;
  var ats = attsOf(n.id);
  for (var i = 0; i < ats.length; i++) { if (isImageAtt(ats[i])) { img = ats[i]; break; } }
  var picked = !!S.selected[n.id];
  var flags = (n.pinned ? '📌' : '') + (n.starred ? '⭐' : '');
  var snip = snippetOf(n, 110);
  var folder = folderName(n.folderId);

  if (S.folder === 'trash') {

      '<div class="cn-main">' +
      '<div class="cn-top"><span class="tag-folder">' + esc(folder) + '</span><span class="cn-flags">' + flags + '</span></div>' +
      '<h3 class="cn-title">' + esc(n.title || '(제목 없음)') + '</h3>' +
      '<p class="cn-snip">' + esc(snip || '내용 없음') + '</p>' +
      '<div class="cn-del">🗑 ' + fmtDateTime(n.deletedAt) + ' 삭제</div>' +
      '<div class="trash-acts"><button type="button" class="restore" data-act="restore" data-id="' + esc(n.id) + '">복구</button>' +
      '<button type="button" class="perm" data-act="perm" data-id="' + esc(n.id) + '">영구 삭제</button></div>' +

    return '<article class="card-note" data-note-id="' + esc(n.id) + '">' +
      (img ? '<img class="cn-thumb" src="' + attURL(img) + '" alt="">' : '') +
      '<div class="cn-main">' +
      '<h3 class="cn-title">' + esc(n.title || '(제목 없음)') + '</h3>' +
      '<p class="cn-snip">' + esc(snip || '내용 없음') + '</p>' +
      '<div class="cn-foot"><span>' + esc(folder) + (flags ? ' ' + flags : '') + '</span><span>' + cardDate(n.updatedAt) + (ats.length ? ' · 📎' + ats.length : '') + '</span></div>' +
      '</div><span class="cn-sel">✓</span></article>';
  }
  return '<article class="card-note' + (picked ? ' picked' : '') + '" data-note-id="' + esc(n.id) + '">' +
    '<div class="cn-top"><span class="tag-folder">' + esc(folder) + '</span><span class="cn-flags">' + flags + '</span></div>' +
    (img ? '<img class="cn-thumb" src="' + attURL(img) + '" alt="">' : '') +
    '<h3 class="cn-title">' + esc(n.title || '(제목 없음)') + '</h3>' +
    '<p class="cn-snip">' + esc(snip || '내용 없음') + '</p>' +
    '<div class="cn-foot"><span>' + cardDate(n.updatedAt) + '</span><span>' + (ats.length ? '📎 ' + ats.length : '') + '</span></div>' +
    '<span class="cn-sel">✓</span></article>';
}

function renderFolders() {
  var h = '';
  function chip(id, label, cls) {
    return '<button type="button" class="fchip' + (cls ? ' ' + cls : '') + (S.folder === id ? ' on' : '') +
      '" data-folder="' + esc(id) + '">' + label + '</button>';
  }
  h += chip('all', '전체');
  h += chip('star', '⭐ 즐겨찾기');
  S.folders.forEach(function (f) { h += chip(f.id, esc(f.name)); });
  h += '<button type="button" class="fchip add" data-folder="__add">＋ 폴더</button>';
  h += chip('trash', '🗑 휴지통', 'trash');
  $('#folderBar').innerHTML = h;
  var bar = $('#folderBar');
  var act = bar.querySelector('.fchip.on');
  if (act) bar.scrollLeft = Math.max(0, act.offsetLeft - (bar.clientWidth - act.offsetWidth) / 2);
}

function renderList() {
  var list = visibleNotes();
  var pin = [], rest = [];
  list.forEach(function (n) {
    if (n.pinned && S.folder !== 'trash') pin.push(n); else rest.push(n);
  });
  var gridCls = 'grid' + (S.view === 'list' ? ' list' : '');
  $('#pinList').className = gridCls;
  $('#noteList').className = gridCls;
  $('#pinList').innerHTML = pin.map(cardHTML).join('');
  $('#noteList').innerHTML = rest.map(cardHTML).join('');
  $('#pinSection').hidden = !pin.length;

  var total = S.notes.filter(function (n) { return S.folder === 'trash' ? !!n.deletedAt : !n.deletedAt; }).length;
  var label = S.folder === 'trash' ? '휴지통' : (S.folder === 'star' ? '즐겨찾기' : (S.folder === 'all' ? '전체' : folderName(S.folder)));
  var cnt = list.length;
  $('#listCount').textContent = (S.q ? '검색 ' + cnt + '개' : label + ' ' + cnt + '개') +

  $('#barSub').textContent = S.notes.filter(function (n) { return !n.deletedAt; }).length + '개 노트 · 이 기기에 저장';
  $('#empty').hidden = cnt > 0;
  $('#emptyMsg').textContent = S.q ? '‘' + S.q + '’에 맞는 노트가 없습니다.'
    : (S.folder === 'trash' ? '휴지통이 비어 있습니다.' : '이 폴더에 노트가 없습니다.');
  $('#trashTools').hidden = !(S.folder === 'trash' && cnt > 0);
  $('#btnSort').textContent = S.sort === 'title' ? '제목순 ▾' : '최신순 ▾';
  $('#btnView').textContent = S.view === 'list' ? '▦' : '☰';
  document.body.classList.toggle('selecting', S.selecting);
  $('#btnSelect').classList.toggle('on', S.selecting);
  $('#fab').hidden = S.selecting;

}

function renderAll() { renderFolders(); renderList(); }
/* ── 선택 모드 ────────────────────────────────────────── */
function setSelecting(on) {
  S.selecting = !!on;
  if (!on) S.selected = {};
  renderList();
}
function updateSelBar() {
  var ids = Object.keys(S.selected);
  $('#selBar').hidden = !S.selecting;
  $('#selCount').textContent = ids.length + '개 선택';
  $('#selPrint').disabled = !ids.length;
  $('#selDel').disabled = !ids.length;
  $('#selPrint').style.opacity = ids.length ? '' : '.45';
  $('#selDel').style.opacity = ids.length ? '' : '.45';
}
function toggleSelect(id) {
  if (S.selected[id]) delete S.selected[id];
  else S.selected[id] = 1;
  renderList();
}

/* ── 편집기 ───────────────────────────────────────────── */
function newNote() {
  var fid = (S.folder === 'all' || S.folder === 'star' || S.folder === 'trash') ? 'f-work' : S.folder;
  if (!existsFolder(fid)) fid = S.folders[0] ? S.folders[0].id : 'f-work';
  var n = {
    id: uid(), title: '', body: '', folderId: fid, tags: [], pinned: false, starred: false,
    style: 'white', createdAt: Date.now(), updatedAt: Date.now(), deletedAt: 0, sample: false
  };
  openEditor(n, true);
}

function openEditor(n, isNew) {
  S.ed = normNote(n);
  S.edNew = !!isNew;
  S.dirty = false;
  lastRange = null;
  $('#edTitle').value = S.ed.title || '';
  $('#edTags').value = tagsOf(S.ed).join(', ');
  $('#edDate').textContent = fmtDateKr(S.ed.createdAt);
  $('#edBody').innerHTML = S.ed.body || '';
  hydrate($('#edBody'));
  applyPageStyle(S.ed.style);
  updateEdFlags();
  renderAtts();
  $('#editor').hidden = false;
  $('#listView').style.visibility = 'hidden';
  $('#edState').textContent = isNew ? '새 노트' : '저장됨';
  $('#edScroll').scrollTop = 0;
  pushStateSafe();
  setTimeout(function () {
    if (!S.ed) return;
    if (!S.ed.title && !htmlToText(S.ed.body)) $('#edTitle').focus();
    else $('#edBody').focus();
  }, 120);
}

function applyPageStyle(style) {
  var p = $('#paper');
  if (!p) return;
  p.className = 'paper p-' + (PAGE_STYLES.some(function (x) { return x.id === style; }) ? style : 'white');
}

function updateEdFlags() {
  if (!S.ed) return;
  $('#edPin').classList.toggle('on', !!S.ed.pinned);
  $('#edStar').classList.toggle('on', !!S.ed.starred);
  $('#edStar').textContent = S.ed.starred ? '⭐' : '☆';
  $('#edFolderName').textContent = folderName(S.ed.folderId);
}

function markDirty() {
  if (!S.ed) return;
  S.dirty = true;
  $('#edState').textContent = '저장 중…';
  clearTimeout(S.saveTimer);
  S.saveTimer = setTimeout(function () { saveNote(true); }, 800);
}

function saveNote(silent) {
  if (!S.ed) return Promise.resolve(false);
  var n = S.ed;
  n.title = ($('#edTitle').value || '').replace(/\s+$/, '');
  n.tags = ($('#edTags').value || '').split(',').map(function (t) { return t.trim(); }).filter(Boolean).slice(0, 20);
  n.body = cleanBody($('#edBody').innerHTML);
  var bodyLen = htmlToText(n.body).length;
  var hasAtt = attsOf(n.id).length > 0;
  if (!n.title && !bodyLen && !hasAtt) {
    if (S.edNew) return Promise.resolve(false);
  }
  n.updatedAt = Date.now();
  S.dirty = false;
  upsertLocal(S.notes, normNote(n));
  return dbPut('notes', n).then(function () {
    S.edNew = false;
    if (!silent) toast('저장했습니다');
    $('#edState').textContent = '저장됨 ' + localTime(n.updatedAt);
    bumpRev();
    renderList();
    return true;
  }).catch(function (err) {
    console.warn('저장 실패', err);
    $('#edState').textContent = '저장 실패';
    toast('저장하지 못했습니다 — ' + (err && err.message ? err.message : '저장 공간 확인'));
    return false;
  });
}

function closeEditor(fromPop) {
  if (!S.ed) return;
  var id = S.ed.id;
  var wasNew = S.edNew;
  clearTimeout(S.saveTimer);
  saveNote(true).then(function (saved) {
    if (!saved && wasNew) {
      var atts = attsOf(id);
      if (!atts.length) {
        S.notes = S.notes.filter(function (n) { return n.id !== id; });
        dbDel('notes', id).catch(function () {});
      }
    }
    S.ed = null;

/* ── 첨부 ─────────────────────────────────────────────── */
function guessType(f) {
  if (f.type) return f.type;
  if (/\.pdf$/i.test(f.name || '')) return 'application/pdf';
  if (/\.(jpe?g|png|gif|webp|heic|heif|bmp)$/i.test(f.name || '')) return 'image/' + f.name.split('.').pop().toLowerCase();
  return 'application/octet-stream';
}
function loadImageEl(file) {
  return new Promise(function (resolve, reject) {
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('이미지를 읽지 못했습니다')); };
    img.src = url;
  });
}
/* 사진은 긴 변 1600px·JPEG 80%로 자동 압축. 이미 작고 가벼우면 그대로, 줄인 결과가 더 크면 원본. */
var IMG_MAX_SIDE = 1600, IMG_QUALITY = 0.8, IMG_KEEP_BYTES = 1000000;
function compressImage(file) {
  var type = guessType(file);
  if (!/^image\//.test(type) || /svg/i.test(type)) return Promise.resolve({ blob: file, name: file.name, changed: false });
  return loadImageEl(file).then(function (img) {
    var w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
    if (!w || !h) return { blob: file, name: file.name, changed: false };
    var scale = Math.min(1, IMG_MAX_SIDE / Math.max(w, h));
    if (scale === 1 && file.size <= IMG_KEEP_BYTES) return { blob: file, name: file.name, changed: false, width: w, height: h };
    var tw = Math.max(1, Math.round(w * scale)), th = Math.max(1, Math.round(h * scale));
    var canvas = document.createElement('canvas');
    canvas.width = tw; canvas.height = th;
    var g = canvas.getContext('2d');
    g.fillStyle = '#ffffff'; g.fillRect(0, 0, tw, th);
    g.drawImage(img, 0, 0, tw, th);
    return new Promise(function (resolve) {
      canvas.toBlob(function (blob) {
        if (!blob || (scale === 1 && blob.size >= file.size) || (blob.size >= file.size && file.size < 400000)) {
          resolve({ blob: file, name: file.name, changed: false, width: w, height: h });
        } else {
          var base = (file.name || '사진').replace(/\.[^.]+$/, '');
          resolve({ blob: blob, name: base + '.jpg', changed: true, origSize: file.size, width: tw, height: th });
        }
      }, 'image/jpeg', IMG_QUALITY);
    });
  }).catch(function () { return { blob: file, name: file.name, changed: false }; });
}

function addFiles(fileList) {
  if (!S.ed) { toast('노트를 먼저 열어 주세요'); return Promise.resolve(); }
  var files = Array.prototype.slice.call(fileList || []);
  if (!files.length) return Promise.resolve();
  toast(files.length > 1 ? files.length + '개 파일을 준비하는 중입니다…' : '사진을 준비하는 중입니다…');
  var noteId = S.ed.id;
  var chain = Promise.resolve();
  var added = [], shrunk = 0, skipped = 0;
  files.forEach(function (f) {
    chain = chain.then(function () {
      if (f.size > 40 * 1024 * 1024) { skipped++; return; }
      return compressImage(f).then(function (r) {
        var type = r.blob.type || guessType(f);
        if (r.changed) shrunk++;
        var att = {
          id: uid(), noteId: noteId, name: r.name || f.name || '첨부파일',
          type: type, size: r.blob.size, blob: r.blob,
          kind: /^image\//.test(type) ? 'photo' : (type === 'application/pdf' ? 'pdf' : 'file'),
          createdAt: Date.now()
        };
        added.push(att);
      }).catch(function () { skipped++; });
    });
  });
  return chain.then(function () {
    if (!added.length) { toast('파일을 붙이지 못했습니다'); return; }
    added.forEach(function (a) { S.atts.push(a); });
    return dbPutMany('attachments', added).then(function () {
      renderAtts();
      markDirty();
      bumpRev();
      toast(added.length + '개를 붙였습니다' + (shrunk ? ' · 사진 ' + shrunk + '장 자동 압축' : '') + (skipped ? ' · ' + skipped + '개 제외' : ''));
    });
  });
}

  g.strokeStyle = st.color;
  g.fillStyle = st.color;

  if (dot) {
    g.beginPath();
    g.arc(b.x, b.y, (st.eraser ? st.width * 3 : st.width) / 2, 0, Math.PI * 2);
    g.fill();
  } else {

  }
  g.restore();
}

}

}

function blobToB64(blob) {

    var fr = new FileReader();
    fr.onload = function () { resolve(String(fr.result).split(',')[1] || ''); };

}
function b64ToBlob(b64, type) {

  for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return new Blob([u8], { type: type || 'application/octet-stream' });
}
function exportJSON() {

function handleRestoreFile(file) {

    try { p = JSON.parse(fr.result); } catch (e) { p = null; }
    if (!p || p.app !== 'yongwoo-note' || !Array.isArray(p.notes)) {
      toast('용우노트 백업 파일이 아닙니다');
      return;
    }
    closeSheet();
    askConfirm('백업 파일에서 노트 <b>' + p.notes.length + '개</b>를 찾았습니다.<br><span style="font-size:13.5px;color:#5b6b7b">지금 노트에 더하고, 같은 노트는 최근 것 하나로 맞춥니다. 기존 노트는 지워지지 않습니다.</span>', '복원', false).then(function (ok) {
      if (ok) doRestore(p);
    });
  };
  fr.readAsText(file, 'utf-8');
}
function doRestore(p) {
  var now = Date.now();
  var addN = 0, updN = 0, addF = 0, addA = 0;
  (p.folders || []).forEach(function (f) {
    if (!f || !f.id) return;
    var nf = normFolder(f);
    if (!existsFolder(nf.id)) { S.folders.push(nf); addF++; }
  });
  S.folders.sort(byFolderOrder);
  (p.notes || []).forEach(function (n) {
    if (!n || !n.id) return;
    var nn = normNote(n);
    var cur = noteById(nn.id);
    if (!cur) { S.notes.push(nn); addN++; }
    else if (nn.updatedAt > cur.updatedAt) { upsertLocal(S.notes, nn); updN++; }
  });
  var newAtts = [];
  (p.attachments || []).forEach(function (a) {
    if (!a || !a.id || !a.data || attOf(a.id)) return;
    try {
      newAtts.push({
        id: a.id, noteId: a.noteId || '', name: a.name || '첨부파일', type: a.type || '',
        size: Number(a.size) || 0, kind: a.kind || 'file', createdAt: Number(a.createdAt) || now,
        blob: b64ToBlob(a.data, a.type)
      });
      addA++;
    } catch (e) {}
  });
  newAtts.forEach(function (a) { S.atts.push(a); });
  Promise.all([dbPutMany('notes', S.notes), dbPutMany('folders', S.folders), dbPutMany('attachments', newAtts)]).then(function () {
    renderAll();
    bumpRev();
    toast('복원했습니다 · 새 노트 ' + addN + '개, 갱신 ' + updN + '개, 첨부 ' + addA + '개' + (addF ? ', 폴더 ' + addF + '개' : ''));
  }).catch(function (err) {
    toast('복원하지 못했습니다 — ' + (err && err.message ? err.message : ''));
  });
}

function makeSampleSketch() {
  return new Promise(function (resolve) {
    var c = document.createElement('canvas');
    c.width = 720; c.height = 460;
    var g = c.getContext('2d');
    g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = '#1d4ed8'; g.lineWidth = 5;
    g.beginPath();
    g.moveTo(90, 360); g.lineTo(240, 360); g.lineTo(240, 200); g.lineTo(430, 200); g.lineTo(430, 300); g.lineTo(620, 300);
    g.stroke();
    g.strokeStyle = '#c0392b';
    g.beginPath(); g.moveTo(240, 200); g.lineTo(330, 120); g.lineTo(430, 200); g.stroke();
    g.setLineDash([10, 9]); g.strokeStyle = '#0b6b3a';
    g.beginPath(); g.moveTo(430, 300); g.lineTo(520, 380); g.stroke();
    g.setLineDash([]);
    g.fillStyle = '#1a1f2b';
    g.font = 'bold 26px sans-serif';
    g.fillText('들머리', 60, 400);
    g.fillText('창고', 200, 170);
    g.fillText('밭', 590, 345);
    c.toBlob(function (blob) {
      if (!blob) { resolve(null); return; }
      resolve({ id: uid(), name: '약도-손글씨.png', type: 'image/png', size: blob.size, blob: blob, kind: 'sketch' });
    }, 'image/png');
  });
}

    onBtn.disabled = true;

      else if (m === 'access_denied' || m === 'popup_closed') toast('허용을 누르지 않아 연결하지 않았습니다');
      else toast('연결하지 못했습니다. 잠시 뒤 다시 시도해 주세요');

    NoteDrive.setClientId($('#dClient').value);

}

/* ══════════════ 뒤로 가기 ══════════════ */
var histPushed = 0, ignorePop = false;
function pushStateSafe() {
  histPushed++;
  try { history.pushState({ hp: histPushed }, ''); } catch (e) {}
}
function backState() {
  if (histPushed > 0) {
    ignorePop = true;
    try { history.back(); } catch (e) {}
  }
}
function closeTopOnBack() {
  if (!$('#confirmModal').hidden) { answerConfirm(false); return true; }
  if (!$('#drawModal').hidden) { $('#drawModal').hidden = true; return true; }
  if (!$('#printModal').hidden) { $('#printModal').hidden = true; return true; }
  if (!$('#viewerModal').hidden) { $('#viewerModal').hidden = true; return true; }
  if (!$('#sheetModal').hidden) { S.sheetKind = ''; $('#sheetModal').hidden = true; return true; }
  if (!$('#editor').hidden) { closeEditor(true); return true; }
  return false;
}
window.addEventListener('popstate', function () {
  histPushed = Math.max(0, histPushed - 1);
  if (ignorePop) { ignorePop = false; return; }
  closeTopOnBack();
});

/* ══════════════ 알림·확인 ══════════════ */
var toastTimer = null;
function toast(msg) {
  var el = $('#toast');
  el.textContent = msg;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.hidden = true; }, 2600);
}
var confirmResolve = null;
function askConfirm(text, yesLabel, danger) {
  $('#confirmText').innerHTML = text;
  $('#confirmYes').textContent = yesLabel || '확인';
  $('#confirmYes').classList.toggle('danger', !!danger);
  $('#confirmModal').hidden = false;
  pushStateSafe();
  return new Promise(function (res) { confirmResolve = res; });
}
function answerConfirm(ok) {
  if ($('#confirmModal').hidden) return;
  $('#confirmModal').hidden = true;
  backState();
  if (confirmResolve) { var r = confirmResolve; confirmResolve = null; r(!!ok); }
}

/* ══════════════ 화면 연결 ══════════════ */
function toggleSearch(show) {
  var row = $('#searchRow');
  var on = show === undefined ? row.hidden : !!show;
  row.hidden = !on;
  if (on) setTimeout(function () { $('#q').focus(); }, 60);
  else { $('#q').value = ''; S.q = ''; renderList(); }
}

function onFolderBarClick(e) {
  var b = e.target.closest('[data-folder]');
  if (!b) return;
  var id = b.getAttribute('data-folder');
  if (id === '__add') { openFolderManage(); return; }
  S.folder = id;
  S.selecting = false;
  S.selected = {};
  renderAll();
  $('#main').scrollTop = 0;
  window.scrollTo(0, 0);
}

function onMainClick(e) {
  var act = e.target.closest('[data-act]');
  if (act) {
    e.stopPropagation();
    var id = act.getAttribute('data-id');
    var kind = act.getAttribute('data-act');
    if (kind === 'restore') { restoreNote(id); return; }
    if (kind === 'perm') {
      askConfirm('이 노트를 완전히 지울까요?<br><span style="font-size:13.5px;color:#5b6b7b">첨부한 사진·그림도 함께 지워지며 되돌릴 수 없습니다.</span>', '영구 삭제', true).then(function (ok) {
        if (ok) deleteNoteNow(id);
      });
      return;
    }
  }
  var card = e.target.closest('[data-note-id]');
  if (!card) return;
  var nid = card.getAttribute('data-note-id');
  if (S.selecting) { toggleSelect(nid); return; }
  var n = noteById(nid);
  if (n) { S.selecting = false; S.selected = {}; openEditor(n, false); }
}

function onBodyClick(e) {
  var ck = e.target.closest ? e.target.closest('.ck') : null;
  if (ck) { e.preventDefault(); toggleTodo(ck); return; }
  var img = e.target.closest ? e.target.closest('img.in-img') : null;
  if (img) { openViewer(img.getAttribute('data-att')); }
}
function onBodyPaste(e) {
  var cd = e.clipboardData;
  if (!cd) return;
  var items = cd.items ? Array.prototype.slice.call(cd.items) : [];
  var files = [];
  items.forEach(function (it) {
    if (it.kind === 'file') { var f = it.getAsFile(); if (f) files.push(f); }
  });
  if (files.length) { e.preventDefault(); addFiles(files); return; }
  e.preventDefault();
  var text = cd.getData('text/plain') || '';
  try { document.execCommand('insertText', false, text); } catch (err) {}
  saveRange();
  markDirty();
}

function onTool(id) {
  if (!S.ed) return;
  switch (id) {
    case 'tbBold': execFmt('bold'); break;
    case 'tbItalic': execFmt('italic'); break;
    case 'tbUnder': execFmt('underline'); break;
    case 'tbHl': execFmt('hiliteColor', '#ffe066'); break;
    case 'tbSize': saveRange(); openSizePick(); break;
    case 'tbBullet': execFmt('insertUnorderedList'); break;
    case 'tbTodo': insertTodo(); break;
    case 'tbPhoto': saveRange(); $('#filePick').click(); break;
    case 'tbCam': saveRange(); $('#camPick').click(); break;
    case 'tbDraw': saveRange(); openDraw(); break;
    case 'tbStyle': openStylePick(); break;
  }
}

function selDelete() {
  var ids = Object.keys(S.selected);
  if (!ids.length) return;
  if (S.folder === 'trash') {
    askConfirm('선택한 노트 ' + ids.length + '개를 완전히 지울까요?<br><span style="font-size:13.5px;color:#5b6b7b">되돌릴 수 없습니다.</span>', '영구 삭제', true).then(function (ok) {
      if (!ok) return;
      ids.forEach(function (id) { deleteNoteNow(id); });
      setSelecting(false);
    });
    return;
  }
  askConfirm('선택한 노트 ' + ids.length + '개를 휴지통으로 옮길까요?', '휴지통으로', false).then(function (ok) {
    if (!ok) return;
    var now = Date.now();
    var changed = [];
    ids.forEach(function (id) {
      var n = noteById(id);
      if (n) { n.deletedAt = now; n.updatedAt = now; changed.push(n); }
    });
    dbPutMany('notes', changed).then(function () {
      setSelecting(false);
      renderAll();
      bumpRev();
      toast(ids.length + '개를 휴지통으로 옮겼습니다');
    });
  });
}
function selPrint() {
  var ids = Object.keys(S.selected);
  var list = ids.map(noteById).filter(Boolean);
  if (!list.length) return;
  S.selecting = false;
  renderList();
  openPrint(list);
}
function emptyTrash() {
  var list = S.notes.filter(function (n) { return !!n.deletedAt; });
  if (!list.length) { toast('휴지통이 비어 있습니다'); return; }
  askConfirm('휴지통의 노트 ' + list.length + '개를 모두 지울까요?<br><span style="font-size:13.5px;color:#5b6b7b">되돌릴 수 없습니다.</span>', '모두 지우기', true).then(function (ok) {
    if (!ok) return;
    list.forEach(function (n) { deleteNoteNow(n.id); });
    toast('휴지통을 비웠습니다');
  });
}

function openEditorMenu() {
  if (!S.ed) return;

function onSheetClick(e) {
  var m = e.target.closest('[data-m]');
  if (m) {
    var kind = m.getAttribute('data-m');
    if (kind === 'drive') { openDriveSheet(); return; }
    if (kind === 'backup') { exportJSON(); return; }
    if (kind === 'restore') { closeSheet(); setTimeout(function () { $('#restorePick').click(); }, 120); return; }
    if (kind === 'trash') { S.folder = 'trash'; S.selecting = false; S.selected = {}; closeSheet(); renderAll(); return; }
    if (kind === 'samples') {
      var has = S.notes.some(function (n) { return n.sample; });
      closeSheet();
      if (has) {
        askConfirm('연습용 샘플 노트를 모두 지울까요?<br><span style="font-size:13.5px;color:#5b6b7b">직접 만든 노트는 그대로 남습니다.</span>', '샘플 지우기', true).then(function (ok) {
          if (ok) removeSamples();
        });
      } else addSamples();
      return;
    }
    if (kind === 'about') { openAbout(); return; }
  }
  var e2 = e.target.closest('[data-e]');
  if (e2) {
    var act = e2.getAttribute('data-e');
    if (act === 'folder') { openFolderPick(); return; }
    if (act === 'style') { openStylePick(); return; }
    if (act === 'print') { var pn = S.ed; closeSheet(); setTimeout(function () { openPrint([pn]); }, 90); return; }
    if (act === 'txt') { var cur = S.ed; closeSheet(); if (cur) exportTxt(cur); return; }
    if (act === 'dup') {
      var id = S.ed ? S.ed.id : null;
      closeSheet();
      if (id) duplicateNote(id).then(function () { closeEditorNow(); });
      return;
    }
    if (act === 'del') {
      var did = S.ed ? S.ed.id : null;
      closeSheet();
      askConfirm('이 노트를 휴지통으로 옮길까요?', '휴지통으로', false).then(function (ok) {
        if (ok && did) deleteNote(did);
      });
      return;
    }
  }
  var f1 = e.target.closest('[data-pick-folder]');
  if (f1) {
    var fid = f1.getAttribute('data-pick-folder');
    if (fid === '__new') { openFolderManage(); return; }
    if (S.ed) setEdFolder(fid);
    else { closeSheet(); }
    return;
  }
  var s1 = e.target.closest('[data-style]');
  if (s1) { setEdStyle(s1.getAttribute('data-style')); return; }
  var z1 = e.target.closest('[data-size]');
  if (z1) { applySize(z1.getAttribute('data-size')); return; }
  var d1 = e.target.closest('[data-delfolder]');
  if (d1) { deleteFolder(d1.getAttribute('data-delfolder')); return; }
  if (e.target.id === 'newFolderAdd') {
    addFolder($('#newFolderName') ? $('#newFolderName').value : '');
    return;
  }
}

/* ══════════════ 이벤트 묶기 ══════════════ */

  $('#edTags').addEventListener('input', markDirty);

  };

  });

  $$('#edTools .tbtn').forEach(function (b) {
    b.addEventListener('mousedown', function (e) { e.preventDefault(); });

  });

  /* 파일 고르기 */

  });
  $('#camPick').addEventListener('change', function (e) {

  });

  /* 시트 */
  $('#sheetClose').onclick = function () { closeSheet(); };

  $('#sheetModal').addEventListener('click', function (e) {

  });

  /* 확인 */
  $('#confirmYes').onclick = function () { answerConfirm(true); };
  $('#confirmNo').onclick = function () { answerConfirm(false); };

  /* 뷰어 */
  $('#viewerClose').onclick = function () { $('#viewerModal').hidden = true; backState(); };
  $('#viewerModal').addEventListener('click', function (e) {
    if (e.target === $('#viewerModal')) { $('#viewerModal').hidden = true; backState(); }
  });

  /* 인쇄 */
  $('#printClose').onclick = function () { $('#printModal').hidden = true; backState(); };
  $('#printCancel').onclick = function () { $('#printModal').hidden = true; backState(); };
  $('#doPrint').onclick = doPrint;
  $('#optPhotos').addEventListener('change', renderPrintPreview);
  $('#optFiles').addEventListener('change', renderPrintPreview);

  /* 손글씨 */
  $('#drawClose').onclick = function () { $('#drawModal').hidden = true; backState(); };
  $('#drawSave').onclick = saveDraw;
  $('#drawColors').addEventListener('click', function (e) {
    var sw = e.target.closest('[data-c]');
    if (!sw) return;
    DW.color = sw.getAttribute('data-c');
    DW.eraser = false;
    $('#drawEraser').classList.remove('on');
    $$('.sw', $('#drawColors')).forEach(function (x) { x.classList.toggle('on', x === sw); });
  });
  $('#drawWidths').addEventListener('click', function (e) {
    var wd = e.target.closest('[data-w]');
    if (!wd) return;
    DW.width = Number(wd.getAttribute('data-w')) || 4;
    $$('.wd', $('#drawWidths')).forEach(function (x) { x.classList.toggle('on', x === wd); });
  });

  };
  $('#drawClear').onclick = function () {

    redrawAll();
    $('#drawEmpty').style.display = '';
  };
  $('#drawLine').onclick = function () {

    wrap.classList.toggle('paper-lined');
    $('#drawLine').classList.toggle('on', wrap.classList.contains('paper-lined'));
  };

  var cvs = $('#drawCanvas');
  cvs.addEventListener('pointerdown', function (e) {
    if (!DW.g) return;
    e.preventDefault();
    try { cvs.setPointerCapture(e.pointerId); } catch (err) {}
    var p = drawPos(e);
    DW.cur = { color: DW.color, width: DW.width, eraser: DW.eraser, points: [p] };
    DW.list.push(DW.cur);
    DW.drawing = true;
    strokeSeg(DW.cur, p, p, true);
    $('#drawEmpty').style.display = 'none';
  });
  cvs.addEventListener('pointermove', function (e) {
    if (!DW.drawing || !DW.cur) return;
    e.preventDefault();
    var p = drawPos(e);
    var pts = DW.cur.points;
    var last = pts[pts.length - 1];
    if (Math.abs(p.x - last.x) + Math.abs(p.y - last.y) < 1.2) return;
    pts.push(p);
    strokeSeg(DW.cur, last, p, false);
  });
  function endStroke() { DW.drawing = false; DW.cur = null; }
  cvs.addEventListener('pointerup', endStroke);
  cvs.addEventListener('pointercancel', endStroke);
  cvs.addEventListener('pointerleave', function (e) { if (DW.drawing && e.buttons === 0) endStroke(); });

  window.addEventListener('resize', function () { if (!$('#printModal').hidden) fitPreview(); });
}

/* ══════════════ 시작 ══════════════ */
function registerSW() {
  if (!('serviceWorker' in navigator)) return;
  if (location.protocol !== 'http:' && location.protocol !== 'https:') return;
  navigator.serviceWorker.register('./sw.js').catch(function (err) {
    console.warn('서비스 워커 등록 실패', err);
  });
}

function init() {
  buildDrawTools();
  bindEvents();
  try { document.execCommand('defaultParagraphSeparator', false, 'div'); } catch (e) {}

  var rp = document.createElement('input');
  rp.type = 'file';
  rp.id = 'restorePick';
  rp.accept = 'application/json,.json';
  rp.hidden = true;
  document.body.appendChild(rp);
  rp.addEventListener('change', function () {
    var f = rp.files && rp.files[0];
    rp.value = '';
    if (f) handleRestoreFile(f);
  });

  var pr = prefs();
  if (pr.view === 'list' || pr.view === 'grid') S.view = pr.view;
  if (pr.sort === 'title' || pr.sort === 'upd') S.sort = pr.sort;

  loadData().then(function () {
    renderAll();
    var live = S.notes.filter(function (n) { return !n.deletedAt; }).length;
    $('#barSub').textContent = live + '개 노트 · 이 기기에 저장';
    if (/[?&]new=1/.test(location.search)) {
      try { history.replaceState(null, '', location.pathname); } catch (e) {}
      newNote();
    }
  }).catch(function (err) {
    console.error(err);
    var box = document.createElement('div');
    box.style.cssText = 'margin:12px;border:2px solid #e7b1ac;background:#fdecea;color:#8f1a13;font-weight:700;padding:12px;border-radius:12px;font-size:14px';
    box.textContent = '저장 공간을 열지 못했습니다. 브라우저의 시크릿 모드가 아닌지 확인해 주세요. (' + (err && err.message ? err.message : '') + ')';
    $('#main').prepend(box);
  });

  registerSW();
  NoteDrive.init();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
</script>
