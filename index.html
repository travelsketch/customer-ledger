  /* =========================================================
     첨부 파일 (IndexedDB) — 사진·PDF
     ========================================================= */
  var FILE_DB = 'customerLedgerFiles';
  var FILE_STORE = 'files';
  var FILE_MAX = 25 * 1024 * 1024;   // 파일 하나 최대 25MB
  var IMG_MAX = 1600;                // 사진 긴 변 최대 1600px
  var IMG_QUALITY = 0.8;             // JPEG 품질 0.80
  var IMG_KEEP_BYTES = 500 * 1024;   // 이보다 작고 해상도도 낮으면 원본 그대로
  var fileDbPromise = null;
  var detailUrls = [];
  var attEditorUrls = [];
  var lbUrl = null;
  var lbOwned = false;

  function openFileDb(){
    if(!('indexedDB' in window)) return Promise.reject(new Error('no-indexeddb'));
    if(fileDbPromise) return fileDbPromise;
    fileDbPromise = new Promise(function(resolve, reject){
      var req = indexedDB.open(FILE_DB, 1);
      req.onupgradeneeded = function(){
        var d = req.result;
        if(!d.objectStoreNames.contains(FILE_STORE)){
          var st = d.createObjectStore(FILE_STORE, { keyPath: 'id' });
          st.createIndex('customerId', 'customerId', { unique: false });
        }
      };
      req.onsuccess = function(){ resolve(req.result); };
      req.onerror = function(){ reject(req.error); };
    });
    return fileDbPromise;
  }

  function idbPutAll(records){
    return openFileDb().then(function(d){
      return new Promise(function(resolve, reject){
        var tx = d.transaction(FILE_STORE, 'readwrite');
        var st = tx.objectStore(FILE_STORE);
        records.forEach(function(r){ st.put(r); });
        tx.oncomplete = function(){ resolve(true); };
        tx.onerror = function(){ reject(tx.error); };
        tx.onabort = function(){ reject(tx.error); };
      });
    });
  }

  function idbDelete(ids){
    if(!ids || !ids.length) return Promise.resolve(true);
    return openFileDb().then(function(d){
      return new Promise(function(resolve, reject){
        var tx = d.transaction(FILE_STORE, 'readwrite');
        var st = tx.objectStore(FILE_STORE);
        ids.forEach(function(id){ st.delete(id); });
        tx.oncomplete = function(){ resolve(true); };
        tx.onerror = function(){ reject(tx.error); };
      });
    });
  }

  function idbGet(id){
    return openFileDb().then(function(d){
      return new Promise(function(resolve, reject){
        var tx = d.transaction(FILE_STORE, 'readonly');
        var r = tx.objectStore(FILE_STORE).get(id);
        r.onsuccess = function(){ resolve(r.result || null); };
        r.onerror = function(){ reject(r.error); };
      });
    });
  }

  function idbList(customerId){
    return openFileDb().then(function(d){
      return new Promise(function(resolve, reject){
        var tx = d.transaction(FILE_STORE, 'readonly');
        var st = tx.objectStore(FILE_STORE);
        var out = [];
        var req = customerId ? st.index('customerId').openCursor(IDBKeyRange.only(customerId)) : st.openCursor();
        req.onsuccess = function(){
          var cur = req.result;
          if(cur){ out.push(cur.value); cur.continue(); }
          else resolve(out);
        };
        req.onerror = function(){ reject(req.error); };
      });
    });
  }

  function isImageFile(f){
    if(!f) return false;
    if(String(f.type || '').toLowerCase().indexOf('image/') === 0) return true;
    return /\.(png|jpe?g|gif|webp|bmp|heic|heif)$/i.test(String(f.name || ''));
  }
  function isPdfFile(f){
    if(!f) return false;
    if(String(f.type || '').toLowerCase() === 'application/pdf') return true;
    return /\.pdf$/i.test(String(f.name || ''));
  }
  function fileSizeText(bytes){
    var b = Number(bytes) || 0;
    if(b < 1024) return b + 'B';
    if(b < 1024 * 1024) return Math.round(b / 1024) + 'KB';
    return (Math.round(b / 1024 / 1024 * 10) / 10) + 'MB';
  }
  function jpgName(name){
    var s = String(name || '사진');
    if(/\.(jpe?g)$/i.test(s)) return s;
    return s.replace(/\.[^.\/]+$/, '') + '.jpg';
  }

  // 카메라·갤러리 사진을 긴 변 1600px / JPEG 0.8 로 줄입니다. 이미 작고 가벼우면 원본 그대로.
  function compressImage(file){
    return new Promise(function(resolve){
      var url = URL.createObjectURL(file);
      var img = new Image();
      var done = function(res){ URL.revokeObjectURL(url); resolve(res); };
      img.onload = function(){
        try{
          var w = img.naturalWidth || img.width;
          var h = img.naturalHeight || img.height;
          if(!w || !h){ done(null); return; }
          var scale = Math.min(1, IMG_MAX / Math.max(w, h));
          if(scale === 1 && file.size <= IMG_KEEP_BYTES){ done(null); return; }
          var tw = Math.max(1, Math.round(w * scale));
          var th = Math.max(1, Math.round(h * scale));
          var cv = document.createElement('canvas');
          cv.width = tw; cv.height = th;
          var ctx = cv.getContext('2d');
          ctx.fillStyle = '#fff';
          ctx.fillRect(0, 0, tw, th);
          ctx.drawImage(img, 0, 0, tw, th);
          cv.toBlob(function(blob){
            if(!blob || (scale === 1 && blob.size >= file.size)){ done(null); return; }
            done({ blob: blob, width: tw, height: th, resized: scale < 1 });
          }, 'image/jpeg', IMG_QUALITY);
        }catch(e){ done(null); }
      };
      img.onerror = function(){ done(null); };
      img.src = url;
    });
  }

  // 고른 파일들을 저장용 묶음으로 바꿉니다 (사진은 압축, PDF는 그대로)
  function prepareAttachments(fileList, onReady, onSkip){
    var list = Array.prototype.slice.call(fileList || []);
    if(!list.length) return;
    var jobs = list.map(function(file){
      if(isPdfFile(file)){
        if(file.size > FILE_MAX) return Promise.resolve(null);
        return Promise.resolve({ name: file.name || '문서.pdf', type: 'application/pdf', size: file.size, blob: file });
      }
      if(!isImageFile(file) || file.size > FILE_MAX) return Promise.resolve(null);
      return compressImage(file).then(function(res){
        if(!res) return { name: file.name || '사진', type: file.type || 'image/*', size: file.size, blob: file };
        return { name: jpgName(file.name), type: 'image/jpeg', size: res.blob.size, blob: res.blob };
      });
    });
    Promise.all(jobs).then(function(items){
      var ok = items.filter(Boolean);
      if(ok.length) onReady(ok);
      if(ok.length < items.length && onSkip) onSkip(items.length - ok.length);
    });
  }

    var found = null;
    db.customers.forEach(function(c){
      (c.files || []).forEach(function(f){ if(f.id === fileId) found = { c: c, f: f }; });
    });
    return found;
  }

  /* =========================================================
     계산기
     ========================================================= */
  var calcTarget = null;
  var calc = { acc: null, op: null, entry: '', done: false, lastExpr: '' };

  function calcGroup(v){
    var s = String(v);
    var neg = s.charAt(0) === '-';
    if(neg) s = s.slice(1);
    var p = s.split('.');
    p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (neg ? '-' : '') + p.join('.');
  }
  function calcFmt(v){
    if(v == null || !isFinite(v)) return '0';
    var r = Math.round(v * 1e10) / 1e10;
    return calcGroup(r);
  }
  function calcEntryDisp(){
    if(!calc.entry) return '';
    var p = calc.entry.split('.');
    p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return p.join('.');
  }
  function calcCompute(a, op, b){
    a = Number(a) || 0; b = Number(b) || 0;
    var r = 0;
    if(op === '+') r = a + b;
    else if(op === '−') r = a - b;
    else if(op === '×') r = a * b;
    else if(op === '÷'){
      if(!b){ toast('0으로는 나눌 수 없습니다.'); return null; }
      r = a / b;
    }else{ r = b; }
    return Math.round(r * 1e10) / 1e10;
  }
  function resolveCalcTarget(){
    if(calcTarget && document.body.contains(calcTarget)) return calcTarget;
    var form = document.getElementById('custForm');
    if(form){
      var fees = form.querySelectorAll('[data-f="monthlyFee"]');
      if(fees.length) return fees[0];
    }
    return null;
  }
  function calcRender(){
    var expr = '', out = '0';
    if(calc.op != null){
      expr = calcFmt(calc.acc) + ' ' + calc.op;
      out = calc.entry ? calcEntryDisp() : calcFmt(calc.acc);
    }else if(calc.done){
      expr = calc.lastExpr;
      out = calcFmt(calc.acc);
    }else{
      out = calc.entry ? calcEntryDisp() : '0';
    }
    $('#calcExpr').textContent = expr;
    $('#calcOut').textContent = out;
    var target = resolveCalcTarget();
    var btn = $('#calcApply');
    btn.disabled = !target;
    var hint = $('#calcHint');

  function calcAllClear(){ calc.acc = null; calc.op = null; calc.entry = ''; calc.done = false; calc.lastExpr = ''; }
  function calcReset(){ calcAllClear(); calcRender(); }
  function calcDigit(d){
    if(calc.done){ calcAllClear(); }
    if(calc.entry.replace(/[^0-9]/g, '').length >= 12) return;
    if(calc.entry === '0') calc.entry = d;
    else calc.entry += d;
    if(calc.entry === '') calc.entry = '0';
    calcRender();
  }
  function calcDot(){
    if(calc.done) calcAllClear();
    if(!calc.entry) calc.entry = '0.';
    else if(calc.entry.indexOf('.') === -1) calc.entry += '.';
    calcRender();
  }
  function calcBack(){
    if(calc.done) return;
    calc.entry = calc.entry.slice(0, -1);
    calcRender();
  }
  function calcPercent(){
    if(calc.entry) calc.entry = String(Math.round((Number(calc.entry) / 100) * 1e10) / 1e10);
    else if(calc.acc != null) calc.acc = Math.round((calc.acc / 100) * 1e10) / 1e10;
    calcRender();
  }
  function calcApplyOp(o){
    var v = calc.entry ? Number(calc.entry) : (calc.acc == null ? 0 : calc.acc);
    if(calc.op != null){
      var r = calcCompute(calc.acc, calc.op, v);
      if(r === null) return;
      calc.acc = r;
    }else{
      calc.acc = v;
    }
    calc.op = o;
    calc.entry = '';
    calc.done = false;
    calc.lastExpr = '';
    calcRender();
  }
  function calcEquals(){
    if(calc.op == null){
      if(calc.entry){
        calc.acc = Number(calc.entry);
        calc.entry = '';
        calc.done = true;
        calc.lastExpr = calcFmt(calc.acc) + ' =';
      }
      calcRender();
      return;
    }
    var b = calc.entry ? Number(calc.entry) : (calc.acc == null ? 0 : calc.acc);
    var r = calcCompute(calc.acc, calc.op, b);
    if(r === null) return;
    calc.lastExpr = calcFmt(calc.acc) + ' ' + calc.op + ' ' + calcFmt(b) + ' =';
    calc.acc = r;
    calc.op = null;
    calc.entry = '';
    calc.done = true;
    calcRender();
  }
  function calcCurrentValue(){
    if(calc.op != null) return calc.entry ? Number(calc.entry) : (calc.acc == null ? 0 : calc.acc);
    if(calc.done) return calc.acc == null ? 0 : calc.acc;
    return calc.entry ? Number(calc.entry) : 0;
  }
  function openCalc(target){
    if(target) calcTarget = target;
    $('#calc').hidden = false;
    calcAllClear();
    if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
    calcRender();
  }
  function closeCalc(){
    $('#calc').hidden = true;
    calcAllClear();
  }
  function calcApplyValue(){
    var target = resolveCalcTarget();
    var v = calcCurrentValue();
    if(!isFinite(v)) v = 0;
    var n = Math.round(v);
    if(n < 0) n = 0;
    if(!target){
      toast('먼저 고객 추가·수정 화면의 월보험료 칸 옆 🧮 를 눌러 주세요.');
      return;
    }
    target.value = n ? n.toLocaleString('ko-KR') : '0';
    target.dispatchEvent(new Event('input', { bubbles: true }));
    closeCalc();
    toast(n.toLocaleString('ko-KR') + '원을 월보험료에 넣었습니다.');
  }

  $('#calcPad').addEventListener('click', function(e){
    var b = e.target.closest('[data-k]');
    if(!b) return;
    var k = b.getAttribute('data-k');
    if(k === 'C') calcReset();
    else if(k === '%') calcPercent();
    else if(k === 'back') calcBack();
    else if(k === '=') calcEquals();
    else if(k === '+' || k === '−' || k === '×' || k === '÷') calcApplyOp(k);
    else if(k === '.') calcDot();
    else if(k === '00'){ calcDigit('0'); calcDigit('0'); }
    else calcDigit(k);
  });

      var ins = (c.insurances || []);
      if(!ins.length){
        rows.push(base.concat(['','','','','','']));

        ins.forEach(function(i){
          rows.push(base.concat([i.company, i.product, i.startDate, i.endDate, num(i.monthlyFee), i.payDay]));
        });
      }
    });
    return rows;
  }
  function csvBlob(){

    return new Blob(['\uFEFF' + text], { type: 'text/csv;charset=utf-8' });
  }

  /* =========================================================

     ========================================================= */
  var XLSX_MIME = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
  var CRC_TABLE = (function(){
    var t = new Uint32Array(256);
    for(var n = 0; n < 256; n++){
      var c = n;
      for(var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
    return t;
  })();

  function crc32(bytes){
    var c = 0xFFFFFFFF;
    for(var i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  function u16(n){ return new Uint8Array([n & 255, (n >>> 8) & 255]); }
  function u32(n){ return new Uint8Array([n & 255, (n >>> 8) & 255, (n >>> 16) & 255, (n >>> 24) & 255]); }
  function joinBytes(list){
    var len = 0;
    list.forEach(function(b){ len += b.length; });
    var out = new Uint8Array(len);
    var at = 0;
    list.forEach(function(b){ out.set(b, at); at += b.length; });
    return out;
  }

  function zipStore(entries){
    var enc = new TextEncoder();
    var now = new Date();
    var dosTime = ((now.getHours() & 31) << 11) | ((now.getMinutes() & 63) << 5) | ((now.getSeconds() >> 1) & 31);
    var dosDate = (((now.getFullYear() - 1980) & 127) << 9) | (((now.getMonth() + 1) & 15) << 5) | (now.getDate() & 31);
    var locals = [], centrals = [], offset = 0;
    entries.forEach(function(e){
      var name = enc.encode(e.name);
      var data = typeof e.data === 'string' ? enc.encode(e.data) : e.data;
      var crc = crc32(data);
      var lh = joinBytes([
        u32(0x04034b50), u16(20), u16(0x0800), u16(0), u16(dosTime), u16(dosDate),
        u32(crc), u32(data.length), u32(data.length), u16(name.length), u16(0), name, data
      ]);
      locals.push(lh);
      centrals.push(joinBytes([
        u32(0x02014b50), u16(20), u16(20), u16(0x0800), u16(0), u16(dosTime), u16(dosDate),
        u32(crc), u32(data.length), u32(data.length), u16(name.length), u16(0), u16(0), u16(0), u16(0),
        u32(0), u32(offset), name
      ]));
      offset += lh.length;
    });
    var central = joinBytes(centrals);
    var eocd = joinBytes([
      u32(0x06054b50), u16(0), u16(0), u16(entries.length), u16(entries.length),
      u32(central.length), u32(offset), u16(0)
    ]);
    return locals.concat([central, eocd]);
  }

  function colLetter(n){
    var s = '';
    while(n > 0){
      var m = (n - 1) % 26;
      s = String.fromCharCode(65 + m) + s;
      n = Math.floor((n - 1) / 26);
    }
    return s;
  }
  function xmlEsc(v){
    return String(v == null ? '' : v).replace(/[&<>"']/g, function(m){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[m];
    }).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '');
  }
  function cellXML(ref, cell, header){
    var isMoney = cell && typeof cell === 'object' && cell.m;
    var style = header ? ' s="1"' : (isMoney ? ' s="2"' : '');
    var v = (cell && typeof cell === 'object') ? cell.v : cell;
    if(v === null || v === undefined || v === '') return '<c r="' + ref + '"' + style + '/>';
    if(typeof v === 'number' && isFinite(v)) return '<c r="' + ref + '"' + style + '><v>' + v + '</v></c>';
    return '<c r="' + ref + '"' + style + ' t="inlineStr"><is><t xml:space="preserve">' + xmlEsc(v) + '</t></is></c>';
  }
  function worksheetXML(rows, widths){
    var cols = '';

        return '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + w + '" customWidth="1"/>';
      }).join('') + '</cols>';
    }
    var body = rows.map(function(row, r){
      return '<row r="' + (r + 1) + '">' + row.map(function(v, c){

    var n = 0;
    sorted.forEach(function(c, k){
      var age = ageOf(c.birth);
      cust.push([
        k + 1, c.name, c.birth || '', (age !== null && age >= 0) ? age : '',
        formatPhone(c.phone), c.address, c.carNumber, c.memo,
        (c.insurances || []).length, { v: monthlyTotal(c), m: 1 }, (c.files || []).length

        ]);

    });
    return { customers: cust, insurances: insr };
  }

  function importJSON(file){
    var reader = new FileReader();
    reader.onload = function(){
      var data;
      try{
        data = JSON.parse(String(reader.result));
      }catch(e){
        toast('파일을 읽지 못했습니다. 용우고객관리대장에서 내보낸 JSON 파일인지 확인해 주세요.');
        return;
      }
      var list = Array.isArray(data) ? data : (data && Array.isArray(data.customers) ? data.customers : null);
      if(!list){
        toast('이 파일에서는 고객 자료를 찾지 못했습니다.');
        return;
      }
      var cleaned = list.map(normalizeCustomer).filter(function(c){ return c.name; });
      if(!cleaned.length){ toast('가져올 고객이 없습니다.'); return; }

      ask({
        title: '백업을 불러올까요?',
        message: '파일에 고객 ' + cleaned.length + '명이 있습니다.\n현재 이 기기에는 ' + db.customers.length + '명이 저장되어 있습니다.',
        buttons: [
          { label: '취소', value: 'cancel', cls: 'outline' },
          { label: '추가로 합치기', value: 'merge', cls: 'primary' },
          { label: '전부 바꾸기', value: 'replace', cls: 'ghost-danger' }
        ]
      }).then(function(mode){
        if(mode === 'cancel' || !mode) return;
        var snap = JSON.parse(JSON.stringify(db.customers));
        if(mode === 'merge'){
          cleaned.forEach(function(c){
            var same = db.customers.filter(function(x){
              return x.name === c.name && digits(x.phone) === digits(c.phone) && x.birth === c.birth;
            })[0];
            if(same){
              same.insurances = same.insurances.concat(c.insurances);
              same.updatedAt = new Date().toISOString();
            }else{
              c.id = uid();
              db.customers.push(c);
            }
          });
        }else{
          db.customers = cleaned;
        }
        state.selected = {};
        save();
        closeModal();
        render();
        toast((mode === 'merge' ? '추가로 합쳤습니다' : '전부 바꿨습니다') + ' (' + db.customers.length + '명)', '되돌리기', function(){
          db.customers = snap;
          save();
          render();
          toast('불러오기를 취소했습니다.');
        });
      });
    };
    reader.onerror = function(){ toast('파일을 읽지 못했습니다.'); };
    reader.readAsText(file);
  }

/* ═══════════════════════════════════════════════════════════════
   ☁️ 구글 드라이브 자동 연동 (Google Identity Services + Drive v3)
   - 온라인일 때만 GIS 스크립트를 불러옵니다. 오프라인이면 조용히 로컬 저장만.

var DRIVE_DEFAULT_CLIENT_ID = '91800638138-023926bb7buaaqi853kdire6j29plj8o.apps.googleusercontent.com';

function createDriveSync(opt) {
  'use strict';
  var SCOPE = 'https://www.googleapis.com/auth/drive.appdata';
  var KEY = opt.settingsKey;
  var FILE = opt.fileName;
  var MAX_ONE = opt.maxFileBytes || (8 * 1024 * 1024);
  var MAX_ALL = opt.maxTotalBytes || (30 * 1024 * 1024);

  var token = '';
  var tokenExp = 0;
  var gsiPromise = null;
  var running = null;
  var timer = null;
  var status = 'off';       // off | syncing | on | offline | auth | error
  var note = '';

  /* ── 이 기기의 연동 설정 ── */
  function conf() {
    try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; }
  }
  function setConf(patch) {
    var c = conf();
    for (var k in patch) {
      if (Object.prototype.hasOwnProperty.call(patch, k)) c[k] = patch[k];
    }
    try { localStorage.setItem(KEY, JSON.stringify(c)); } catch (e) {}
  }
  function isOn() { return !!conf().on; }
  function clientId() { return String(conf().clientId || '').trim() || DRIVE_DEFAULT_CLIENT_ID; }

  function ago(t) {
    if (!t) return '';
    var d = Date.now() - t;
    if (d < 60000) return '방금';
    if (d < 3600000) return Math.floor(d / 60000) + '분 전';
    if (d < 86400000) return Math.floor(d / 3600000) + '시간 전';
    return Math.floor(d / 86400000) + '일 전';
  }
  function label() {
    if (running) return '동기화 중…';
    if (!isOn()) return '미연결';
    if (status === 'offline') return '오프라인';
    if (status === 'auth') return '연결 확인 필요';
    if (status === 'error') return '동기화 오류';
    var t = Number(conf().lastSyncAt) || 0;
    return t ? '연결됨 · ' + ago(t) + ' 동기화' : '연결됨 · 동기화 대기';
  }
  function paint() {
    try { if (opt.onStatus) opt.onStatus(label(), status, note); } catch (e) {}
  }
  function setStatus(s, msg) { status = s; if (msg !== undefined) note = msg; paint(); }

  /* ── GIS 스크립트 (필요할 때만, 온라인일 때만) ── */
  function loadGis() {
    if (window.google && window.google.accounts && window.google.accounts.oauth2) return Promise.resolve();
    if (gsiPromise) return gsiPromise;
    gsiPromise = new Promise(function (resolve, reject) {
      if (!navigator.onLine) { reject(new Error('offline')); return; }
      var s = document.createElement('script');
      s.src = 'https://accounts.google.com/gsi/client';
      s.async = true;
      s.defer = true;
      s.onload = function () {
        if (window.google && window.google.accounts && window.google.accounts.oauth2) { resolve(); }
        else { gsiPromise = null; reject(new Error('gsi-unavailable')); }
      };
      s.onerror = function () { gsiPromise = null; reject(new Error('gsi-failed')); };
      document.head.appendChild(s);
    });
    return gsiPromise;
  }

  function askToken(interactive) {
    return loadGis().then(function () {
      return new Promise(function (resolve, reject) {
        var done = false;
        function finish(err, tk) {
          if (done) return;
          done = true;
          if (tk) { resolve(tk); } else { reject(err || new Error('no-token')); }
        }
        try {
          var client = window.google.accounts.oauth2.initTokenClient({
            client_id: clientId(),
            scope: SCOPE,
            callback: function (resp) {
              if (resp && resp.access_token) {
                token = resp.access_token;
                tokenExp = Date.now() + (Number(resp.expires_in) || 3600) * 1000 - 90000;
                finish(null, token);
              } else {
                finish(new Error(resp && resp.error ? resp.error : 'no-token'));
              }
            },
            error_callback: function (err) {
              finish(new Error(err && err.type ? err.type : 'popup'));
            }
          });
          client.requestAccessToken({ prompt: interactive ? 'consent' : '' });
        } catch (e) { finish(e); }
      });
    });
  }

  function ensureToken(interactive) {
    if (token && Date.now() < tokenExp) return Promise.resolve(token);
    return askToken(interactive);
  }

  function timeoutFetch(url, opts) {
    var o = opts || {};
    if (window.AbortController) {
      var ac = new AbortController();
      o.signal = ac.signal;
      var tm = setTimeout(function () { try { ac.abort(); } catch (e) {} }, 90000);
      return fetch(url, o).then(function (r) { clearTimeout(tm); return r; }, function (e) { clearTimeout(tm); throw e; });
    }
    return fetch(url, o);
  }

  function api(url, opts) {
    var o = opts || {};
    o.headers = o.headers || {};
    return ensureToken(false).then(function (tk) {
      o.headers.Authorization = 'Bearer ' + tk;
      return timeoutFetch(url, o);
    }).then(function (res) {
      if (res.status !== 401) return res;
      token = '';
      return ensureToken(false).then(function (tk) {
        o.headers.Authorization = 'Bearer ' + tk;
        return timeoutFetch(url, o);
      });
    });
  }

  function needOk(res) {
    if (!res.ok) throw new Error('http-' + res.status);
    return res.json().catch(function () { return {}; });
  }

  function findFile() {
    var q = encodeURIComponent("name = '" + FILE + "' and trashed = false");
    var url = 'https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&pageSize=5&orderBy=modifiedTime desc&q=' + q +
      '&fields=' + encodeURIComponent('files(id,name,modifiedTime,size)');
    return api(url).then(needOk).then(function (j) {
      return (j && j.files && j.files[0]) || null;
    });
  }

  function download(id) {
    return api('https://www.googleapis.com/drive/v3/files/' + encodeURIComponent(id) + '?alt=media').then(function (res) {
      if (!res.ok) throw new Error('http-' + res.status);
      return res.text();
    });
  }

  function upload(text, fileId) {
    if (fileId) {
      return api('https://www.googleapis.com/upload/drive/v3/files/' + encodeURIComponent(fileId) + '?uploadType=media', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json; charset=UTF-8' },
        body: text
      }).then(needOk);
    }
    var b = 'yongwoo' + Date.now().toString(36);
    var body = '--' + b + '\r\n' +
      'Content-Type: application/json; charset=UTF-8\r\n\r\n' +
      JSON.stringify({ name: FILE, parents: ['appDataFolder'], mimeType: 'application/json' }) + '\r\n' +
      '--' + b + '\r\n' +
      'Content-Type: application/json; charset=UTF-8\r\n\r\n' + text + '\r\n' +
      '--' + b + '--';
    return api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
      method: 'POST',
      headers: { 'Content-Type': 'multipart/related; boundary=' + b },
      body: body
    }).then(needOk);
  }

  /* ── 자료 합치기 (기기별 수정 시각 비교) ── */
  function trim(payload) {
    var files = payload.files || [], keep = [], total = 0, skipped = 0;
    for (var i = 0; i < files.length; i++) {
      var f = files[i];
      var bytes = f && f.data ? Math.round(f.data.length * 0.75) : 0;
      if (!f || !f.data || bytes > MAX_ONE || total + bytes > MAX_ALL) { skipped++; continue; }
      total += bytes;
      keep.push(f);
    }
    payload.files = keep;
    payload.skippedFiles = skipped;
    return payload;
  }

  function push(payload, fileId) {
    if (!payload.rev) payload.rev = Date.now();
    var text = JSON.stringify(trim(payload));
    return upload(text, fileId).then(function () {
      setConf({ lastSyncRev: Number(payload.rev) || 0, lastSyncAt: Date.now() });
      setStatus('on');
      return payload;
    });
  }

  function merge(local, remote) {
    var out = { app: local.app, version: local.version, rev: Date.now(), items: [], files: [], deleted: {}, skippedFiles: 0 };
    var del = {};
    [local.deleted || {}, remote.deleted || {}].forEach(function (d) {
      Object.keys(d).forEach(function (k) {
        del[k] = Math.max(Number(del[k]) || 0, Number(d[k]) || 0);
      });
    });
    var pick = {}, fpick = {}, order = [], forder = [];
    [local.items || [], remote.items || []].forEach(function (arr) {
      arr.forEach(function (it) {
        if (!it || !it.id) return;
        var cur = pick[it.id];
        if (!cur) { pick[it.id] = it; order.push(it.id); return; }
        if ((Number(it.upd) || 0) > (Number(cur.upd) || 0)) pick[it.id] = it;
      });
    });
    order.forEach(function (id) {
      var it = pick[id];
      if (del[id] && del[id] > (Number(it.upd) || 0)) return;   // 지운 자료
      out.items.push(it);
      delete del[id];
    });
    [local.files || [], remote.files || []].forEach(function (arr) {
      arr.forEach(function (f) {
        if (!f || !f.id) return;
        var cur = fpick[f.id];
        if (!cur) { fpick[f.id] = f; forder.push(f.id); return; }
        if (!cur.data && f.data) fpick[f.id] = f;
      });
    });
    forder.forEach(function (id) {
      if (del[id]) return;
      out.files.push(fpick[id]);
    });
    out.deleted = del;
    return out;
  }

  function run() {
    return findFile().then(function (f) {
      if (!f) {
        return Promise.resolve(opt.build()).then(function (local) { return push(local, null); }).then(function () { return true; });
      }
      return download(f.id).then(function (text) {
        var remote = null;
        try { remote = JSON.parse(text); } catch (e) { remote = null; }
        if (!remote || remote.app !== opt.app || !Array.isArray(remote.items)) {
          return Promise.resolve(opt.build()).then(function (local) { return push(local, f.id); }).then(function () { return true; });
        }
        var lastRev = Number(conf().lastSyncRev) || 0;
        var localRev = Number(opt.rev()) || 0;
        var remoteRev = Number(remote.rev) || 0;
        var localChanged = localRev > lastRev;
        var remoteChanged = remoteRev > lastRev;
        if (!localChanged && !remoteChanged) {
          setConf({ lastSyncAt: Date.now() });
          setStatus('on');
          return true;
        }
        if (remoteChanged && !localChanged) {
          return Promise.resolve(opt.apply(remote)).then(function () {
            setConf({ lastSyncRev: remoteRev, lastSyncAt: Date.now() });
            setStatus('on');
            return true;
          });
        }
        if (localChanged && !remoteChanged) {
          return Promise.resolve(opt.build()).then(function (local) { return push(local, f.id); }).then(function () { return true; });
        }
        return Promise.resolve(opt.build()).then(function (local) {
          var merged = merge(local, remote);
          return Promise.resolve(opt.apply(merged)).then(function () {
            return push(merged, f.id);
          }).then(function () { return true; });
        });
      });
    });
  }

  function sync(manual) {
    if (running) return running;
    if (!isOn()) { paint(); return Promise.resolve(false); }
    if (!navigator.onLine) { setStatus('offline'); return Promise.resolve(false); }
    running = run().then(function () {
      running = null;
      setStatus('on');
      return true;
    }).catch(function (err) {
      running = null;
      var m = String((err && err.message) || err || '');
      if (!navigator.onLine || m === 'offline' || m === 'gsi-failed' || m === 'Failed to fetch' || m === 'Load failed' || m === 'http-0') {
        setStatus('offline', m);
      } else if (m === 'popup' || m === 'popup_failed_to_open' || m === 'access_denied' || m === 'interaction_required' || m === 'no-token') {
        setStatus('auth', m);
      } else {
        setStatus('error', m);
      }
      return false;
    });
    setStatus('syncing');
    return running;
  }

  function connect() {
    if (!navigator.onLine) { setStatus('offline'); return Promise.reject(new Error('offline')); }
    setStatus('syncing');
    return loadGis().then(function () {
      return askToken(true);
    }).then(function () {
      setConf({ on: true, lastSyncRev: 0 });
      return sync(true);
    }).catch(function (err) {
      setConf({ on: false });
      var m = String((err && err.message) || '');
      if (!navigator.onLine) setStatus('offline', m);
      else if (m === 'gsi-failed' || m === 'gsi-unavailable') setStatus('error', m);
      else setStatus('auth', m);
      throw err;
    });
  }

  function disconnect() {
    setConf({ on: false, lastSyncRev: 0 });
    token = '';
    tokenExp = 0;
    if (timer) { clearTimeout(timer); timer = null; }
    setStatus('off');
    return Promise.resolve(true);
  }

  function markChange() {
    if (!isOn()) return;
    if (!navigator.onLine) { setStatus('offline'); return; }
    if (timer) clearTimeout(timer);
    timer = setTimeout(function () { timer = null; sync(false); }, 1200);
  }

  function init() {
    paint();
    window.addEventListener('online', function () { if (isOn()) sync(false); else paint(); });
    window.addEventListener('offline', function () { if (isOn()) setStatus('offline'); });
    document.addEventListener('visibilitychange', function () { if (!document.hidden && isOn()) sync(false); });
    window.addEventListener('focus', function () { if (isOn() && !document.hidden) sync(false); });
    if (isOn()) setTimeout(function () { sync(false); }, 1800);
    setInterval(function () { if (!running) paint(); }, 60000);
  }

  return {
    init: init,
    sync: sync,
    connect: connect,
    disconnect: disconnect,
    markChange: markChange,
    isOn: isOn,
    label: label,
    refresh: paint,
    status: function () { return status; },
    note: function () { return note; },
    ago: ago,
    clientId: clientId,
    setClientId: function (v) { setConf({ clientId: String(v || '').trim() }); paint(); },
    lastSyncAt: function () { return Number(conf().lastSyncAt) || 0; }
  };
}

  /* =========================================================
     ☁️ 구글 드라이브 자동 연동 (이 앱에 맞춘 연결고리)
     ========================================================= */
  var DRIVE_MAX_ONE = 8 * 1024 * 1024;    // 첨부 파일 하나 최대 8MB
  var DRIVE_MAX_ALL = 30 * 1024 * 1024;   // 한 번에 올리는 첨부 합계 30MB

  function b64FromBlob(blob){
    return new Promise(function(resolve, reject){
      var fr = new FileReader();
      fr.onload = function(){
        var s = String(fr.result || '');
        var i = s.indexOf(',');
        resolve(i >= 0 ? s.slice(i + 1) : s);
      };
      fr.onerror = function(){ reject(fr.error || new Error('read-failed')); };
      fr.readAsDataURL(blob);
    });
  }
  function blobFromB64(b64, type){
    var bin = atob(String(b64 || ''));
    var u8 = new Uint8Array(bin.length);
    for(var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    return new Blob([u8], { type: type || 'application/octet-stream' });
  }
  function persistLocal(){
    try{
      localStorage.setItem(STORE_KEY, JSON.stringify({
        version: 1, customers: db.customers, rev: db.rev, deleted: db.deleted, fileIds: db.fileIds
      }));
    }catch(e){}
  }

  function driveBuild(){
    var now = Date.now();
    var deleted = db.deleted || (db.deleted = {});
    var known = db.fileIds || (db.fileIds = {});
    var items = db.customers.map(function(c){
      if(deleted[c.id]) delete deleted[c.id];
      return c;
    });
    return idbList().then(function(recs){
      var ids = {}, files = [], total = 0, jobs = [];
      recs.forEach(function(r){
        ids[r.id] = 1;
        var size = Number(r.size) || (r.blob && r.blob.size) || 0;
        if(!r.blob || size > DRIVE_MAX_ONE || total + size > DRIVE_MAX_ALL) return;
        total += size;
        jobs.push(b64FromBlob(r.blob).then(function(b64){
          files.push({
            id: r.id, customerId: r.customerId || '', name: r.name || '첨부파일',
            type: r.type || '', size: size, addedAt: Number(r.addedAt) || 0, data: b64
          });
        }).catch(function(){}));
      });
      return Promise.all(jobs).then(function(){
        Object.keys(known).forEach(function(id){ if(!ids[id] && !deleted[id]) deleted[id] = now; });
        db.fileIds = ids;
        persistLocal();
        return { app: 'customer-ledger', version: 1, rev: Number(db.rev) || 0, items: items, deleted: deleted, files: files };
      });
    }).catch(function(err){
      console.warn('첨부 파일을 준비하지 못해 고객 자료만 동기화합니다.', err);
      return { app: 'customer-ledger', version: 1, rev: Number(db.rev) || 0, items: items, deleted: deleted, files: [] };
    });
  }

  function driveApply(p){
    db.customers = (p.items || []).map(normalizeCustomer);
    db.deleted = {};
    Object.keys(p.deleted || {}).forEach(function(k){ db.deleted[k] = Number(p.deleted[k]) || 0; });
    db.customers.forEach(function(c){ if(db.deleted[c.id]) delete db.deleted[c.id]; });
    db.rev = Number(p.rev) || Date.now();
    var recs = [], ids = {};
    (p.files || []).forEach(function(f){
      if(!f || !f.id || !f.data) return;
      try{
        recs.push({
          id: f.id, customerId: f.customerId || '', name: f.name || '첨부파일',
          type: f.type || '', size: Number(f.size) || 0,
          blob: blobFromB64(f.data, f.type), addedAt: Number(f.addedAt) || Date.now()
        });
        ids[f.id] = 1;
      }catch(e){}
    });
    db.fileIds = ids;
    lastSaved = {};
    db.customers.forEach(function(c){ lastSaved[c.id] = JSON.stringify(c); });
    persistLocal();
    return idbDelete(Object.keys(db.deleted)).catch(function(){}).then(function(){
      return idbPutAll(recs);
    }).catch(function(){}).then(function(){
      try{ render(); }catch(e){}
      return true;
    });
  }

  var DriveSync = createDriveSync({
    app: 'customer-ledger',
    settingsKey: 'customerLedger.drive.v1',
    fileName: 'yongwoo-customer-ledger-sync.json',
    maxFileBytes: DRIVE_MAX_ONE,
    maxTotalBytes: DRIVE_MAX_ALL,
    rev: function(){ return Number(db.rev) || 0; },
    build: driveBuild,
    apply: driveApply,
    onStatus: function(text, st){ paintDrive(text, st); }
  });

  function paintDrive(text, st){
    var btn = document.getElementById('driveBarBtn');
    if(btn){
      btn.className = 'drive-btn' + (st === 'on' ? ' on' : (st === 'syncing' ? ' sync' : ((st === 'auth' || st === 'error' || st === 'offline') ? ' warn' : '')));
      var t = document.getElementById('driveText');
      if(t) t.textContent = (!st || st === 'off') ? '구글 드라이브 연결' : text;
      var h = document.getElementById('driveHint');
      if(h) h.textContent = (!st || st === 'off') ? 'PC·폰 자동 동기화' : '눌러서 관리';
    }
    var sl = document.getElementById('driveSheetStatus');
    if(sl) sl.textContent = text;
  }

  function openDriveSheet(){
    var on = DriveSync.isOn();
    var last = DriveSync.lastSyncAt();
    var body = '';
    body += '<div class="set-group">';
    body += '  <div class="stat-row" style="padding:16px 16px 8px"><div class="stat" style="flex:1"><div class="sv" id="driveSheetStatus" style="font-size:17px">' + esc(DriveSync.label()) + '</div><div class="sl">동기화 상태</div></div></div>';
    body += '  <div style="padding:0 16px 16px;color:var(--muted);font-size:14px;line-height:1.5">' +
      (on ? '자료를 저장할 때마다 구글 드라이브의 <b>앱 전용 공간</b>에 자동으로 올리고, 다른 기기에서 앱을 열면 최신 자료를 받아 옵니다.'
          : '한 번 연결하면 PC와 폰의 자료가 자동으로 같아집니다. 내 드라이브 목록에는 보이지 않는 앱 전용 공간만 씁니다. 고객 정보는 본인 계정 안에만 보관됩니다.') + '</div>';
    body += '</div>';

    if(on){
      body += '<div class="set-group">';
      body += '  <button class="set-item" id="dSync"><span class="si-ico">🔄</span><span class="si-main"><span class="si-title">지금 동기화</span><span class="si-sub">' + (last ? '마지막 동기화: ' + DriveSync.ago(last) : '아직 동기화한 적이 없습니다') + '</span></span><span>›</span></button>';
      body += '  <button class="set-item danger" id="dOff"><span class="si-ico">🔌</span><span class="si-main"><span class="si-title">연결 해제</span><span class="si-sub">이 기기의 자료는 그대로 두고 자동 동기화만 끕니다</span></span><span>›</span></button>';
      body += '</div>';
    }else{
      body += '<div class="set-group">';
      body += '  <button class="set-item" id="dOn"><span class="si-ico">☁️</span><span class="si-main"><span class="si-title">구글 드라이브 연결</span><span class="si-sub">평소 쓰는 구글 계정으로 로그인하고 ‘허용’을 누르면 끝납니다</span></span><span>›</span></button>';
      body += '</div>';
    }

    body += '<div class="set-group"><h3>고급 설정</h3>';
    body += '  <div style="padding:14px 16px 4px"><label for="dClient" style="display:block;font-size:13.5px;color:var(--muted);margin-bottom:6px">OAuth 클라이언트 ID</label>' +
            '<input id="dClient" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" value="' + esc(DriveSync.clientId()) + '" style="width:100%;height:48px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:14px"></div>';
    body += '  <button class="set-item" id="dSaveClient"><span class="si-ico">🔑</span><span class="si-main"><span class="si-title">클라이언트 ID 저장</span><span class="si-sub">다른 구글 프로젝트를 쓸 때만 바꾸세요</span></span><span>›</span></button>';
    body += '</div>';

    body += '<p style="color:var(--muted);font-size:13px;line-height:1.5;padding:0 4px 8px">※ 구글 드라이브를 연결하지 않아도 앱은 지금처럼 이 기기에만 저장하며 똑같이 동작합니다.</p>';

    openModal({
      title: '☁️ 구글 드라이브 연동',
      body: body,
      after: function(){
        var onBtn = $('#dOn');
        if(onBtn) onBtn.addEventListener('click', function(){
          if(!navigator.onLine){ toast('인터넷에 연결된 뒤 다시 눌러 주세요.'); return; }
          onBtn.disabled = true;
          toast('구글 창에서 ‘허용’을 눌러 주세요.');
          DriveSync.connect().then(function(){
            closeModal();
            toast('구글 드라이브에 연결했습니다. 이제 자동으로 동기화됩니다.');
          }).catch(function(err){
            onBtn.disabled = false;
            var m = String((err && err.message) || '');
            if(m === 'offline') toast('인터넷 연결을 확인해 주세요.');
            else if(m === 'popup' || m === 'popup_failed_to_open') toast('팝업이 막혔습니다. 브라우저의 팝업 차단을 풀고 다시 눌러 주세요.');
            else if(m === 'access_denied') toast('허용을 누르지 않아 연결하지 않았습니다.');
            else toast('연결하지 못했습니다. 잠시 뒤 다시 시도해 주세요.');
          });
        });
        var syncBtn = $('#dSync');
        if(syncBtn) syncBtn.addEventListener('click', function(){
          syncBtn.disabled = true;
          DriveSync.sync(true).then(function(ok){
            closeModal();
            toast(ok ? '동기화했습니다.' : '지금은 동기화하지 못했습니다. 연결 상태를 확인해 주세요.');
          });
        });
        var offBtn = $('#dOff');
        if(offBtn) offBtn.addEventListener('click', function(){
          ask({
            title: '연결을 해제할까요?',
            message: '이 기기의 자료는 그대로 남고, 자동 동기화만 멈춥니다.',
            confirmLabel: '연결 해제',
            danger: true
          }).then(function(ok){
            if(!ok) return;
            DriveSync.disconnect().then(function(){ closeModal(); toast('연결을 해제했습니다.'); });
          });
        });
        var saveBtn = $('#dSaveClient');
        if(saveBtn) saveBtn.addEventListener('click', function(){
          DriveSync.setClientId($('#dClient').value);
          closeModal();
          toast('클라이언트 ID를 저장했습니다.');
        });
      }
    });
  }

  $('#driveBarBtn').addEventListener('click', openDriveSheet);

  /* =========================================================
     파일 선택 (가져오기)
     ========================================================= */
  var fileInput = document.createElement('input');
  fileInput.type = 'file';
  fileInput.accept = '.json,application/json';
  fileInput.id = 'importFile';
  fileInput.style.display = 'none';
  fileInput.addEventListener('change', function(){
    if(fileInput.files && fileInput.files[0]) importJSON(fileInput.files[0]);
    fileInput.value = '';
  });
  document.body.appendChild(fileInput);

  /* =========================================================
     시작
     ========================================================= */
  load();
  render();
  DriveSync.init();

  // 서비스 워커 (https 또는 localhost 에서만)
  if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
    // 이미 앱을 설치해 쓰던 기기에서 새 버전이 준비되면 알려 줍니다.
    var hadSWController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', function(){
      if(!hadSWController) return;
      hadSWController = false;
      toast('새 버전이 준비되었습니다.', '새로 고침', function(){ location.reload(); });
    });
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./sw.js').catch(function(e){ console.warn('오프라인 저장 등록 실패', e); });
    });
  }

  // 테스트용 노출 (개발 확인용)
  window.__ledger = {
    get db(){ return db; },
    version: APP_VERSION,
    render: render,
    openPrint: openPrint,
    setState: function(patch){ Object.assign(state, patch); render(); },
    listFiles: idbList,
    getFile: idbGet,
    drive: DriveSync,
    save: save,
    driveBuild: driveBuild,
    driveApply: driveApply,
    calcValue: calcCurrentValue,
    printPhotos: function(){ return printPhotos; }
  };
})();
