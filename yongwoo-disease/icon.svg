<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="예외질환 검색기">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17a89b"/>
      <stop offset="1" stop-color="#0a5a54"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#04231f" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- 돋보기 -->
  <g filter="url(#sh)">
    <circle cx="216" cy="208" r="126" fill="#ffffff"/>
    <circle cx="216" cy="208" r="92" fill="#0a5a54"/>
    <rect x="292" y="300" width="150" height="52" rx="26" transform="rotate(45 292 300)" fill="#ffffff"/>
  </g>
  <!-- 의료 십자 -->
  <g fill="#ffc93c">
    <rect x="199" y="146" width="34" height="124" rx="12"/>
    <rect x="154" y="191" width="124" height="34" rx="12"/>
  </g>
</svg>
