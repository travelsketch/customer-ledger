<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>예외질환 검색기</title>
<meta name="description" content="질병명이나 질병분류코드(KCD)로 보험사별 간편심사 예외질환·인수기준을 찾아 비교하는 개인용 검색기. 개인 메모·자료 추가, A4 인쇄, PC·폰 구글 드라이브 동기화.">
<meta name="theme-color" content="#0f766e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="예외질환 검색기">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
:root{
  --brand:#0f766e; --brand-d:#0a5a54; --brand-soft:#e4f3f1; --brand-line:#b3dbd5;
  --accent:#ffc93c; --accent-soft:#fff4cc; --accent-d:#b47d00;
  --ink:#16212b; --muted:#5c6a77; --faint:#8b97a3;
  --line:#dbe4e8; --bg:#f1f5f6; --card:#ffffff;
  --good:#1f7a4a; --good-bg:#e4f4ea; --warn:#9a5b00; --warn-bg:#fff3df; --bad:#b4372b; --bad-bg:#fbe6e2;
  --son:#1b5fae; --son-bg:#e7effb; --saeng:#c2410c; --saeng-bg:#fdece3;
  --radius:16px; --shadow:0 1px 2px rgba(12,35,40,.05),0 8px 20px rgba(12,35,40,.07);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕","Noto Sans KR","Noto Sans CJK KR",system-ui,-apple-system,sans-serif;
  font-size:16.5px; line-height:1.5; -webkit-font-smoothing:antialiased;
  padding-bottom:calc(90px + env(safe-area-inset-bottom));
}
body.locked{overflow:hidden}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
h1,h2,h3,h4,p,ul,dl,dd{margin:0}
ul{padding-left:18px}
[hidden]{display:none !important}
mark{background:#ffe27a;color:#3a2c00;border-radius:3px;padding:0 1px;font-weight:inherit}

/* ── 상단 ───────────────────────────────── */
.appbar{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line)}
.bar-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:6px;padding:7px 10px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#14a196,#0a5a54);display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 3px 8px rgba(15,118,110,.32)}
.brand-tx{flex:1;min-width:0;display:flex;flex-direction:column;padding-left:4px}
.brand-tx h1{font-size:20px;font-weight:800;letter-spacing:-.4px;line-height:1.15}
.brand-tx .sub{font-size:12.5px;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{min-width:44px;min-height:44px;border-radius:12px;font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center;color:#26323d}
.ibtn:active{background:#eef2f4}

/* 드라이브 줄 */
.drive-wrap{max-width:1080px;margin:0 auto;padding:8px 10px 0}
.drive-btn{width:100%;min-height:42px;display:flex;align-items:center;gap:8px;padding:0 12px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);color:var(--brand);font-size:14.5px;font-weight:700;text-align:left;box-shadow:var(--shadow)}
.drive-btn .drive-ico{font-size:16px;flex:none}
.drive-btn .drive-txt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drive-btn .drive-hint{font-size:12px;font-weight:700;color:var(--muted);flex:none}
.drive-btn.on{background:#eaf7ef;border-color:#c2e5cf;color:#0a6b3c}
.drive-btn.sync{background:var(--brand-soft);border-color:var(--brand-line)}
.drive-btn.warn{background:#fff3df;border-color:#eccfa2;color:#8a4b00}

/* ── 검색 밴드 ─────────────────────────── */
.searchband{background:linear-gradient(180deg,#fff8e0,#fffdf4);border-bottom:1px solid #f0e4b8;margin-top:8px}
.sb-in{max-width:1080px;margin:0 auto;padding:10px 10px 12px}
.search-box{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--accent);border-radius:14px;padding:0 10px;box-shadow:0 3px 12px rgba(180,125,0,.12)}
.search-box .sb-ico{font-size:17px;flex:none;opacity:.8}
.search-box input{flex:1;min-width:0;height:52px;border:0;outline:none;background:none;font-size:17px;font-weight:600}
.search-box input::placeholder{color:#a8b1b8;font-weight:500;font-size:15.5px}
.search-box input::-webkit-search-cancel-button{display:none}
.search-box #clear{min-width:38px;height:38px;border-radius:10px;font-size:16px;color:var(--muted);background:#f1f5f6}
.chips{display:flex;gap:6px;overflow-x:auto;padding:9px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:0 12px;border-radius:18px;background:#fff;border:1.5px solid #ecd9a3;font-size:14px;font-weight:700;color:#6b5518;white-space:nowrap}
.chip:active{background:var(--accent-soft)}
.chip.ghost{background:#f4f7f8;border-color:var(--line);color:#4a5865}
.filters{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-top:9px}
.filters .seg{grid-column:1/-1}
@media (min-width:640px){.filters{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) auto}.filters .seg{grid-column:auto}}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;background:#efe7cd;border-radius:12px;padding:3px}
.seg button{min-height:40px;border-radius:9px;font-size:14.5px;font-weight:800;color:#5b5336;letter-spacing:-.3px}
.seg button[aria-pressed="true"]{background:#fff;color:var(--brand-d);box-shadow:0 1px 3px rgba(12,35,40,.16)}
#ins{width:100%;min-height:46px;border-radius:12px;border:1.5px solid #e6dcc0;background:#fff;padding:0 10px;font-size:15px;font-weight:700;outline:none}
#ins:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(15,118,110,.12)}
.reset{min-height:46px;padding:0 12px;border-radius:12px;background:#fff;border:1.5px solid var(--line);font-size:14px;font-weight:800;color:#41505c;white-space:nowrap}
.reset:active{background:#eef2f4}

main{max-width:1080px;margin:0 auto;padding:10px 10px 10px}
.footnote{font-size:12.5px;color:var(--faint);font-weight:600;line-height:1.6;padding:14px 4px 8px;text-align:center}

/* ── 결과 요약 ─────────────────────────── */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow)}
.summary{padding:13px 13px 11px}
.summary h2{font-size:18px;font-weight:800;letter-spacing:-.4px;line-height:1.35;word-break:keep-all}
.summary h2 .sm-t{font-size:15.5px;color:var(--muted);font-weight:700}
.summary h2 b{color:var(--brand-d)}
.hitrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.hit{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 10px;border-radius:18px;background:#f3f7f8;border:1.5px solid var(--line);font-size:13.5px;font-weight:800;color:#33414d}
.hit:active{background:var(--brand-soft)}
.hit i{font-style:normal;font-size:12px;font-weight:800;color:var(--brand-d);background:#fff;border-radius:9px;padding:1px 6px}
.hit.none{background:#fafbfb;color:#8b97a3;font-weight:700}
.hit.none i{color:#98a3ad}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.son{background:var(--son)}
.dot.saeng{background:var(--saeng)}
.misslabel{font-size:12.5px;font-weight:800;color:var(--faint);margin-top:12px}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px;padding-top:10px;border-top:1px dashed var(--line)}
.lg{font-size:12px;font-weight:800;border-radius:7px;padding:2px 7px}
.lg.good{background:var(--good-bg);color:var(--good)}
.lg.warn{background:var(--warn-bg);color:var(--warn)}
.lg.bad{background:var(--bad-bg);color:var(--bad)}

/* ── 빈 화면 ──────────────────────────── */
.welcome{padding:18px 16px}
.welcome h2{font-size:19px;font-weight:800;letter-spacing:-.4px;margin-bottom:8px}
.welcome p{font-size:15px;color:#3c4a56;line-height:1.62;margin-bottom:8px;word-break:keep-all}
.welcome p b{color:var(--brand-d)}
.welcome .hint{font-size:13px;color:var(--faint);font-weight:700}
.rec-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.rec-l{font-size:12.5px;font-weight:800;color:var(--faint)}

/* ── 보험사 카드 ──────────────────────── */
.ins{margin-top:10px;overflow:hidden}
.card-h{display:flex;align-items:center;gap:7px;padding:13px 13px 0;flex-wrap:wrap}
.card-h h3{font-size:18px;font-weight:800;letter-spacing:-.4px}
.kind{font-size:11.5px;font-weight:800;border-radius:7px;padding:2px 7px}
.kind.son{background:var(--son-bg);color:var(--son)}
.kind.saeng{background:var(--saeng-bg);color:var(--saeng)}
.count{margin-left:auto;font-size:13px;font-weight:800;color:var(--faint);flex:none}
.card-acts{display:flex;gap:6px;flex-wrap:wrap;padding:9px 13px 10px}
.act{min-height:36px;padding:0 11px;border-radius:9px;background:#f2f6f7;font-size:13px;font-weight:800;color:#3c4a56}
.act:active{background:#e6ecef}
.act.on{background:var(--brand-soft);color:var(--brand-d)}
.act.add{background:var(--accent-soft);color:#7a5a00}
.notes{margin:0 13px 10px;background:#f7fafb;border:1px solid #e8eff1;border-radius:12px;padding:10px 12px}
.notes h4{font-size:13.5px;font-weight:800;color:var(--brand-d);margin:6px 0 4px}
.notes h4:first-child{margin-top:0}
.notes ul{padding-left:16px}
.notes li{font-size:13.5px;color:#3c4a56;line-height:1.55;margin:2px 0;word-break:keep-all}
.notes-empty{font-size:13.5px;color:var(--muted);font-weight:700}
.imgs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 13px 10px}
@media (min-width:640px){.imgs{grid-template-columns:repeat(5,1fr)}}
.imgbtn{padding:0;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#eef2f4;aspect-ratio:3/4}
.imgbtn img{width:100%;height:100%;object-fit:cover;display:block}
.rows{display:flex;flex-direction:column}
.row{padding:12px 13px;border-top:1px solid #edf1f3}
.row.mine{background:#fffdf3}
.row-t{display:flex;flex-wrap:nowrap;align-items:flex-start;gap:6px}
.row-id{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.row-t .nm{font-size:16.5px;font-weight:800;letter-spacing:-.3px;word-break:keep-all}
.row-t .code{font-size:12.5px;font-weight:800;color:#243040;background:#eef3f6;border-radius:6px;padding:1px 6px;font-variant-numeric:tabular-nums}
.row-t .cat{font-size:12px;font-weight:800;color:#5c6a77;background:#f4f7f8;border-radius:6px;padding:1px 6px}
.row-t .src{font-size:11.5px;font-weight:800;color:var(--brand-d);background:var(--brand-soft);border-radius:6px;padding:1px 6px}
.row-t .mine{font-size:11.5px;font-weight:800;color:#7a5a00;background:var(--accent-soft);border-radius:6px;padding:1px 6px}
.row-acts{display:flex;gap:4px;flex:none;padding-top:1px}
.mini{min-height:32px;padding:0 8px;border-radius:8px;background:#f2f6f7;font-size:12.5px;font-weight:800;color:#4a5865}
.mini:active{background:#e6ecef}
.mini.has{background:var(--accent-soft);color:#7a5a00}
.kv{display:grid;grid-template-columns:1fr;gap:0;margin-top:8px}
@media (min-width:680px){.kv{grid-template-columns:1fr 1fr;column-gap:14px}}
.kvp{display:flex;gap:8px;align-items:flex-start;border-bottom:1px dashed #eef2f4;padding:4px 0;min-width:0}
.kv dt{flex:0 0 44%;font-size:13px;font-weight:700;color:#6b7883;word-break:keep-all}
.kv dd{flex:1;min-width:0;font-size:14px;font-weight:700;color:#22303c;word-break:keep-all;overflow-wrap:anywhere}
.kvp.good dd{color:var(--good)}
.kvp.warn dd{color:var(--warn)}
.kvp.bad dd{color:var(--bad)}
.kvp.wide{grid-column:1/-1}
.rowmemo{margin-top:8px;background:var(--accent-soft);border-radius:10px;padding:8px 10px;font-size:13.5px;color:#5d4700;line-height:1.55;word-break:keep-all}
.rowmemo b{font-size:11.5px;font-weight:800;color:#8a5a00;background:#fff;border-radius:6px;padding:1px 6px;margin-right:5px}
.more{width:calc(100% - 26px);margin:2px 13px 12px;min-height:44px;border-radius:11px;background:#f2f6f7;font-size:14px;font-weight:800;color:var(--brand-d)}
.more:active{background:var(--brand-soft)}
.imgonly .hint{padding:0 13px 10px}
.hint{font-size:12.5px;color:var(--muted);font-weight:700;line-height:1.6}

/* ── 내 자료 편집기 ───────────────────── */
#editor{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column}
.ed-bar{display:flex;align-items:center;gap:4px;background:#fff;border-bottom:1px solid var(--line);padding:6px 8px;flex:none}
.ed-bar .ed-title{flex:1;text-align:center;font-size:16.5px;font-weight:800;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ebtn{min-width:44px;height:44px;border-radius:11px;font-size:15px;font-weight:800;color:#33414d;display:flex;align-items:center;justify-content:center;padding:0 10px}
.ebtn:active{background:#eef2f4}
.ebtn.save{background:var(--brand);color:#fff;height:42px;padding:0 15px}
.ebtn.del{color:#a3261e}
.ed-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 30px;width:100%;max-width:720px;margin:0 auto}
.fld{background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:12px;margin-bottom:10px}
.fld-label{font-size:12.5px;font-weight:800;color:var(--faint);letter-spacing:.2px;margin-bottom:6px}
.fld-label .req{color:#b4372b;font-size:11px}
.row2{display:flex;gap:8px}
.row2 > *{flex:1;min-width:0}
.inp{width:100%;border:1.5px solid var(--line);border-radius:11px;background:#fff;padding:0 11px;height:48px;font-size:16px;outline:none}
textarea.inp{height:auto;min-height:96px;padding:11px;line-height:1.6;resize:vertical}
.inp:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(15,118,110,.12)}
select.inp{height:48px;font-weight:700}
.kvrow{display:flex;gap:6px;align-items:center;margin-bottom:7px}
.kvrow .k{flex:0 0 40%;border:1.5px solid var(--line);border-radius:10px;height:44px;padding:0 9px;font-size:15px;outline:none;min-width:0}
.kvrow .v{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:10px;height:44px;padding:0 9px;font-size:15px;outline:none}
.kvrow .k:focus,.kvrow .v:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(15,118,110,.12)}
.kvdel{width:36px;height:36px;flex:none;border-radius:9px;background:#f4f7f8;color:#8b97a3;font-size:14px}
.addkv{min-height:42px;padding:0 12px;border-radius:10px;border:1.5px dashed var(--brand-line);color:var(--brand-d);font-size:14px;font-weight:800;width:100%;margin-top:2px}
.btn{min-height:48px;padding:0 16px;border-radius:12px;font-size:15px;font-weight:800;background:#eef2f4;color:#2b3546;display:inline-flex;align-items:center;justify-content:center;gap:6px;width:100%}
.btn.primary{background:var(--brand);color:#fff;box-shadow:0 4px 12px rgba(15,118,110,.24)}
.btn.danger-line{background:#fff;border:1.5px solid #e5b4ae;color:#a3261e}

/* ── 시트 · 모달 ──────────────────────── */
.modal{position:fixed;inset:0;z-index:80;background:rgba(10,26,30,.5);display:flex;align-items:flex-end;justify-content:center}
.modal.mid{align-items:center;padding:16px}
.modal.full{align-items:stretch;justify-content:center}
.sheet{background:#fff;width:100%;max-width:620px;max-height:88vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:4px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(8,30,34,.3)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:10px 0 6px;position:sticky;top:0;background:#fff;z-index:2}
.sheet-head h2{font-size:17px;font-weight:800;letter-spacing:-.3px}
.sheet-head button{width:40px;height:40px;border-radius:10px;font-size:17px;color:var(--muted)}
.sheet-row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:56px;padding:6px 2px;border-bottom:1px solid #eef2f4;width:100%;text-align:left}
.sheet-row:last-child{border-bottom:0}
.sheet-row .sr-l{display:flex;align-items:center;gap:10px;min-width:0}
.sheet-row .sr-ico{font-size:19px;width:24px;text-align:center;flex:none}
.sheet-row .sr-tx{font-size:15.5px;font-weight:700}
.sheet-row .sr-tx small{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.sheet-row .sr-v{font-size:15px;font-weight:700;color:var(--muted);white-space:nowrap}
.sheet-note{font-size:13px;color:var(--muted);line-height:1.6;padding:6px 2px 10px;font-weight:600}
.sheet-sec{font-size:12.5px;font-weight:800;color:var(--faint);padding:14px 2px 4px}
.sheet-btns{display:flex;gap:8px;margin-top:10px}
.sheet-btns .btn{flex:1}
.cov{border-bottom:1px solid #eef2f4;padding:8px 0 10px}
.cov-h{display:flex;align-items:center;gap:8px;justify-content:space-between}
.cov-h b{font-size:15.5px;font-weight:800}
.cov ul{padding-left:18px;margin-top:4px}
.cov li{font-size:13px;color:#42505c;line-height:1.5;margin:2px 0}
.cov .n{font-size:11.5px;font-weight:800;color:var(--faint)}
.linkbtn{min-height:34px;padding:0 10px;border-radius:9px;background:var(--brand-soft);color:var(--brand-d);font-size:12.5px;font-weight:800;flex:none}
.mine-row{width:100%;text-align:left;border-bottom:1px solid #eef2f4;padding:9px 2px;display:flex;flex-direction:column;gap:2px}
.mr-t{font-size:15px;font-weight:800;color:#22303c}
.mr-t b{color:var(--brand-d)}
.mr-t i{font-style:normal;font-size:12px;color:var(--faint)}
.mr-s{font-size:12.5px;color:var(--muted);font-weight:600;line-height:1.45}
.help h4{font-size:14px;font-weight:800;color:var(--brand-d);margin:14px 0 5px}
.help h4:first-child{margin-top:2px}
.help p{font-size:13.5px;color:#3c4a56;line-height:1.65;margin-bottom:6px;word-break:keep-all}
.help ul{padding-left:18px;margin-bottom:6px}
.help li{font-size:13.5px;color:#3c4a56;line-height:1.62;margin:3px 0;word-break:keep-all}
.drv-state{display:flex;justify-content:space-between;align-items:center;min-height:42px;border-bottom:1px solid #eef2f4;font-size:14px;font-weight:700;color:var(--muted)}
.drv-state b{color:var(--brand-d)}
.drv-more{margin-top:12px;font-size:13px;font-weight:700;color:var(--muted)}
.drv-more summary{min-height:40px;display:flex;align-items:center;cursor:pointer}
.drv-more .inp{margin:6px 0 8px;font-size:13px;height:44px}
.confirm-box{background:#fff;border-radius:18px;width:100%;max-width:350px;padding:20px 18px 16px;box-shadow:0 12px 40px rgba(8,30,34,.32);text-align:center}
.confirm-box p{font-size:15.5px;font-weight:700;line-height:1.55;margin-bottom:16px;word-break:keep-all}
.confirm-box .cf-sub{font-size:13px;color:var(--muted);font-weight:600}
.confirm-btns{display:flex;gap:8px}
.confirm-btns button{flex:1;min-height:48px;border-radius:12px;font-size:15px;font-weight:800;background:#eef2f4;color:#33414d}
.confirm-btns #confirmYes{background:var(--brand);color:#fff}
.confirm-btns #confirmYes.danger{background:#b3261e}

/* 원본 이미지 크게 보기 */
.modal.lb{background:#0a1517}
.lb-box{width:100%;max-width:1100px;height:100%;display:flex;flex-direction:column}
.lb-bar{display:flex;align-items:center;gap:8px;padding:10px 12px;color:#fff;font-size:14px;font-weight:700}
.lb-bar span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-bar button{width:42px;height:42px;border-radius:10px;background:rgba(255,255,255,.14);color:#fff;font-size:16px}
.lb-img{flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:4px}
.lb-img img{max-width:100%;height:auto;display:block;background:#fff}
.lb-foot{padding:8px 12px calc(14px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center}
.lb-foot button{min-height:46px;padding:0 18px;border-radius:12px;font-size:15px;font-weight:800;background:rgba(255,255,255,.16);color:#fff}

/* ── 인쇄 미리보기 ────────────────────── */
.print-card{background:#e9edef;width:100%;max-width:900px;height:100%;display:flex;flex-direction:column}
.print-head{display:flex;align-items:center;gap:8px;background:#fff;padding:8px 12px;border-bottom:1px solid var(--line)}
.print-head b{flex:1;font-size:16px}
.print-head button{width:42px;height:42px;border-radius:10px;font-size:16px;color:var(--muted)}
.print-opts{display:flex;gap:14px;background:#fff;padding:8px 14px;font-size:13.5px;font-weight:700;color:#33414d;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
.print-opts label{display:flex;align-items:center;gap:6px}
.print-opts input{width:18px;height:18px}
.print-opts select{min-height:36px;border:1.5px solid var(--line);border-radius:9px;padding:0 6px;font-size:13.5px;font-weight:700}
.preview-wrap{flex:1;overflow:auto;padding:12px;display:flex;justify-content:center;align-items:flex-start}
.print-foot{background:#fff;padding:8px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--line)}
.print-foot .btn{width:auto;min-height:48px;padding:0 22px}

.paper-print{width:794px;background:#fff;padding:40px 38px;box-sizing:border-box;color:#111;font-size:10.5pt;line-height:1.5;flex:none;box-shadow:0 6px 24px rgba(8,30,34,.18)}
.paper-print .pd-head{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:2px solid #111;padding-bottom:6px;margin-bottom:12px}
.paper-print .pd-name{font-size:12pt;font-weight:800;letter-spacing:2px}
.paper-print .pd-date{font-size:8.5pt;color:#444}
.paper-print h3.pt{font-size:15pt;font-weight:800;margin:0 0 3px;letter-spacing:-.4px}
.paper-print .pmeta{font-size:8.5pt;color:#555;margin-bottom:10px}
.paper-print .pins{margin-top:11px;page-break-inside:auto}
.paper-print .pins h4{font-size:11.5pt;font-weight:800;border-bottom:1.5px solid #333;padding-bottom:3px;margin:0 0 5px;page-break-after:avoid}
.paper-print .pins h4 span{font-size:8.5pt;font-weight:700;color:#555;margin-left:4px}
.paper-print .prow{padding:5px 0 6px;border-bottom:1px solid #e3e3e3;page-break-inside:avoid}
.paper-print .pnm{font-size:10.5pt;font-weight:800;margin-bottom:3px}
.paper-print .pnm b{font-size:8.5pt;background:#f0f0f0;border-radius:3px;padding:0 4px;margin-left:3px;font-weight:800}
.paper-print .pnm em{font-style:normal;font-size:8pt;color:#666;margin-left:3px}
.paper-print .pnm .pmine{font-style:normal;font-size:7.5pt;color:#8a5a00;background:#fff3cc;border-radius:3px;padding:0 4px;margin-left:3px}
.paper-print table{width:100%;border-collapse:collapse;table-layout:fixed}
.paper-print th{width:20%;font-size:8pt;font-weight:700;color:#555;text-align:left;padding:1.5px 4px 1.5px 0;vertical-align:top}
.paper-print td{width:30%;font-size:8.5pt;color:#111;padding:1.5px 8px 1.5px 0;vertical-align:top;word-break:keep-all;overflow-wrap:anywhere}
.paper-print .pmemo{font-size:8.5pt;color:#4a3c00;background:#fffbe8;border-radius:3px;padding:3px 5px;margin-top:3px;white-space:normal}
.paper-print .pmemo b{font-size:7.5pt;background:#fff;border-radius:3px;padding:0 3px;margin-right:3px}
.paper-print .pmore{font-size:8pt;color:#666;padding:3px 0}
.paper-print .pnone{font-size:8.5pt;color:#555}
.paper-print .pnotes{background:#f7f7f7;border-radius:4px;padding:5px 7px;margin:3px 0 6px;font-size:8pt;color:#333}
.paper-print .pnotes b{display:block;font-size:8pt;margin-top:2px}
.paper-print .pnotes ul{padding-left:13px;margin:1px 0}
.paper-print .pnotes li{font-size:7.6pt;line-height:1.4;margin:1px 0;word-break:keep-all}
.paper-print .pfoot{margin-top:12px;border-top:1px solid #ccc;padding-top:6px;font-size:7.6pt;color:#666;line-height:1.5}
#printRoot{display:none}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));z-index:120;background:rgba(14,32,36,.95);color:#fff;font-size:14px;font-weight:700;padding:11px 16px;border-radius:12px;max-width:88vw;text-align:center;box-shadow:0 8px 22px rgba(8,30,34,.3);line-height:1.45}
.fab{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));min-width:54px;height:52px;border-radius:26px;background:var(--brand);color:#fff;font-size:21px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(15,118,110,.38);z-index:35;padding:0 15px;gap:5px}
.fab span{font-size:14px;font-weight:800}
.fab:active{transform:scale(.96)}
@media (max-width:400px){
  .seg button{font-size:13.5px}
  .row-t .nm{font-size:15.5px}
}
@media print{
  html,body{background:#fff !important;padding:0 !important;margin:0 !important}
  .appbar,.drive-wrap,.searchband,main,.fab,#toast,.modal,#editor,.lb{display:none !important}
  #printRoot{display:block !important}
  .paper-print{width:auto;box-shadow:none;padding:0}
  @page{size:A4;margin:11mm 10mm 12mm}
}

    ids[c.id] = 1;
    delete del[c.id];
    items.push({
      kind: 'custom', id: c.id, ins: c.ins, name: c.name, code: c.code, cat: c.cat,
      kv: c.kv || [], ov: c.ov || '', createdAt: c.createdAt || 0,
      upd: Math.max(Number(c.upd) || 0, Number(c.createdAt) || 0)
    });
  });
  Object.keys(MEMOS).forEach(function (k) {
    var m = MEMOS[k];
    if (!m || m.del || !String(m.t || '').trim()) return;
    var id = 'm:' + k;
    ids[id] = 1;
    delete del[id];
    items.push({ kind: 'memo', id: id, key: k, t: m.t, upd: Number(m.upd) || 0 });
  });
  Object.keys(kI).forEach(function (id) { if (!ids[id] && !del[id]) del[id] = now; });
  known.items = ids;
  st.deleted = del; st.known = known;
  saveSyncState(st);
  return { app: APP, version: 1, rev: Number(st.rev) || 0, items: items, deleted: del };
}
function syncApply(p) {
  var custom = [], memos = {};
  (p.items || []).forEach(function (it) {
    if (!it || !it.id) return;
    if (it.kind === 'custom' && it.ins && it.name) {
      custom.push({
        id: String(it.id), ins: it.ins, name: it.name, code: it.code || '', cat: it.cat || '',
        kv: Array.isArray(it.kv) ? it.kv : [], ov: it.ov || '',
        createdAt: Number(it.createdAt) || Number(it.upd) || Date.now(), upd: Number(it.upd) || 0
      });
    } else if (it.kind === 'memo' && it.key) {
      memos[it.key] = { t: String(it.t || ''), upd: Number(it.upd) || 0 };
    }
  });
  var st = syncState();
  st.rev = Number(p.rev) || Date.now();
  st.deleted = {};
  Object.keys(p.deleted || {}).forEach(function (k) { st.deleted[k] = Number(p.deleted[k]) || 0; });
  st.known = { items: {} };
  custom.forEach(function (c) { st.known.items[c.id] = 1; if (st.deleted[c.id]) delete st.deleted[c.id]; });
  Object.keys(memos).forEach(function (k) { st.known.items['m:' + k] = 1; if (st.deleted['m:' + k]) delete st.deleted['m:' + k]; });
  saveSyncState(st);
  CUSTOM = custom;
  MEMOS = memos;
  try { localStorage.setItem(KEY_CUSTOM, JSON.stringify(CUSTOM)); } catch (e) { }
  try { localStorage.setItem(KEY_MEMO, JSON.stringify(MEMOS)); } catch (e) { }
  render();
  return true;
}

/* ── 강조 표시 ───────────────────────────────────────── */
function escRe(c) { return c.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function hl(text, groups) {
  text = String(text || '');
  if (!groups || !groups.length || !text) return esc(text);
  var words = [];
  groups.forEach(function (g) {
    g.forEach(function (w) { if (w.length >= 2 && !isCode(w)) words.push(w); });
  });
  words = words.filter(function (w, i) { return words.indexOf(w) === i; })
    .sort(function (a, b) { return b.length - a.length; });
  if (!words.length) return esc(text);
  var re;
  try {
    re = new RegExp('(' + words.map(function (w) { return w.split('').map(escRe).join('\\s*'); }).join('|') + ')', 'gi');
  } catch (e) { return esc(text); }
  var out = '', last = 0, m;
  while ((m = re.exec(text))) {
    if (!m[0]) { re.lastIndex++; continue; }
    out += esc(text.slice(last, m.index)) + '<mark>' + esc(m[0]) + '</mark>';
    last = m.index + m[0].length;
  }
  return out + esc(text.slice(last));
}

  var kv = collectKv();

  if (!name) { toast('질병명을 적어 주세요'); $('#edName').focus(); return; }
  var now = Date.now();
  if (ED.mode === 'edit') {
    var c = CUSTOM.filter(function (x) { return x.id === ED.id; })[0];
    if (!c) return;
    c.ins = ins; c.name = name; c.code = code; c.cat = cat; c.kv = kv; c.upd = now;

  } else {

function paperHTML(res) {
  var max = PRINT.max === 'all' ? Infinity : Number(PRINT.max) || 20;
  var filterTxt = (state.t ? (state.t === '손보' ? '손해보험' : '생명보험') : '전체') + (state.ins ? ' · ' + state.ins : '');
  var html = '<div class="pd-head"><div class="pd-name">예외질환 검색기</div><div class="pd-date">' + todayStr() + '</div></div>' +
    '<h3 class="pt">“' + esc(res.query) + '” 보험사별 인수기준</h3>' +
    '<div class="pmeta">' + esc(filterTxt) + ' · ' + res.hits.length + '개 보험사 · ' + res.total.toLocaleString() + '건' +
    (PRINT.max === 'all' ? '' : ' (보험사별 최대 ' + max + '건)') + ' · 개인 참고용</div>';
  if (!res.hits.length) html += '<p class="pnone">검색 결과가 없습니다.</p>';
  var groups = res.query.split(/\s+/).filter(Boolean).map(expand);
  res.hits.forEach(function (h) {
    var p = h.ins;
    html += '<section class="pins"><h4>' + esc(p.name) + ' <span>' + (p.t === '손보' ? '손해보험' : '생명보험') + ' · ' + h.list.length + '건</span></h4>';
    if (PRINT.notes && p.sheets.length) {
      var parts = p.sheets.map(function (i) { return SHEETS[i]; }).filter(function (s) { return s[3] && s[3].length; });
      if (parts.length) html += '<div class="pnotes">' + parts.map(function (s) {
        return '<b>' + esc(s[2]) + '</b><ul>' + s[3].map(function (n) { return '<li>' + esc(n) + '</li>'; }).join('') + '</ul>';
      }).join('') + '</div>';
    }
    h.list.slice(0, max).forEach(function (o) {
      var x = o.x;
      var pairs = x.kv;
      var rows = '';
      for (var i = 0; i < pairs.length; i += 2) {
        rows += '<tr><th>' + esc(pairs[i][0]) + '</th><td>' + esc(pairs[i][1]) + '</td>';
        if (pairs[i + 1]) rows += '<th>' + esc(pairs[i + 1][0]) + '</th><td>' + esc(pairs[i + 1][1]) + '</td>';
        else rows += '<th></th><td></td>';
        rows += '</tr>';
      }
      var memo = PRINT.memo ? memoTxt(x.key) : '';
      html += '<div class="prow"><div class="pnm">' + esc(x.name || '(이름 없음)') +
        (x.code ? ' <b>' + esc(x.code) + '</b>' : '') + (x.cat ? ' <em>' + esc(x.cat) + '</em>' : '') +
        (x.kind === 'c' ? ' <i class="pmine">내 자료</i>' : '') + '</div>' +
        (rows ? '<table>' + rows + '</table>' : '') +
        (memo ? '<div class="pmemo"><b>메모</b> ' + esc(memo).replace(/\n/g, '<br>') + '</div>' : '') +
        '</div>';
    });
    if (h.list.length > max) html += '<div class="pmore">… 그 밖에 ' + (h.list.length - max) + '건 더 있음</div>';
    html += '</section>';
  });
  var none = res.none.filter(function (p) { return !(p.img && p.img.only); });
  if (none.length) html += '<p class="pnone">자료에서 못 찾은 보험사: ' + esc(none.map(function (p) { return p.name; }).join(', ')) + '</p>';
  html += '<p class="pfoot">보험사가 GA에 배포한 예외질환·인수기준 참고 자료이며, 실시간 심사 결과가 아니므로 최종 인수 여부는 각 보험사 언더라이팅 결과를 따릅니다. 개인 참고용으로만 사용하세요.</p>';
  return html;
}

function fitPaper() {

  var w = wrap.clientWidth - 24;
  var scale = Math.min(1, w / 794);

  wrap.style.height = (paper.offsetHeight * scale + 24) + 'px';
}

/* ── 백업 ─────────────────────────────────────────────── */
function downloadBlob(blob, name) {
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function exportJSON() {
  var memos = {};
  Object.keys(MEMOS).forEach(function (k) { if (memoTxt(k)) memos[k] = { t: MEMOS[k].t, upd: MEMOS[k].upd || 0 }; });
  var payload = {
    app: APP, name: APP_NAME, version: APP_VERSION,
    exportedAt: new Date().toISOString(),
    dataBuilt: DATA.meta.built,
    custom: liveCustom(), memos: memos
  };
  downloadBlob(new Blob([JSON.stringify(payload, null, 1)], { type: 'application/json' }), '예외질환-검색기-백업-' + todayStr() + '.json');
  toast('백업 파일을 내려받았습니다');
}
function restoreFile(file) {
  var fr = new FileReader();
  fr.onload = function () {
    var p = null;
    try { p = JSON.parse(String(fr.result)); } catch (e) { p = null; }
    if (!p || p.app !== APP || !(Array.isArray(p.custom) || p.memos)) { toast('예외질환 검색기 백업 파일이 아닙니다'); return; }
    var nC = (p.custom || []).filter(function (c) { return c && !c.deletedAt; }).length;
    var nM = Object.keys(p.memos || {}).length;
    askConfirm('백업으로 복원할까요?<br><span class="cf-sub">이 기기의 내 자료 ' + liveCustom().length + '건 · 메모 ' +
      Object.keys(MEMOS).filter(function (k) { return memoTxt(k); }).length + '건이 백업 내용(' + nC + '건 · ' + nM + '건)으로 바뀝니다.</span>', '복원', false).then(function (ok) {
      if (!ok) return;
      var now = Date.now();
      liveCustom().forEach(function (c) { c.deletedAt = now; c.upd = now; });
      var keep = {};
      (p.custom || []).forEach(function (c) {
        if (!c || !c.id || !c.ins || !c.name) return;
        keep[c.id] = {
          id: String(c.id), ins: c.ins, name: c.name, code: c.code || '', cat: c.cat || '',
          kv: Array.isArray(c.kv) ? c.kv : [], ov: c.ov || '',
          createdAt: Number(c.createdAt) || now, upd: Number(c.upd) || now
        };
      });
      var tombstones = CUSTOM.filter(function (c) { return c.deletedAt; });
      var ids = {};
      tombstones.forEach(function (c) { ids[c.id] = 1; });
      CUSTOM = tombstones.concat(Object.keys(keep).filter(function (id) { return !ids[id]; }).map(function (id) { return keep[id]; }));
      MEMOS = {};
      Object.keys(p.memos || {}).forEach(function (k) { MEMOS[k] = { t: String(p.memos[k].t || ''), upd: Number(p.memos[k].upd) || now }; });
      saveCustom();
      saveMemos();
      render();
      toast('백업으로 복원했습니다');
    });
  };
  fr.readAsText(file);
}

  var syncBtn = $('#drvSync');
  if (syncBtn) syncBtn.addEventListener('click', function () {
    syncBtn.disabled = true;
    DiseaseDrive.sync(true).then(function (ok) {
      paintDrive(DiseaseDrive.label(), 'on');
      openDrive();
      toast(ok ? '동기화했습니다' : '동기화하지 못했습니다');
    });
  });
  var offBtn = $('#drvOff');
  if (offBtn) offBtn.addEventListener('click', function () {
    DiseaseDrive.disconnect().then(function () { paintDrive(DiseaseDrive.label(), 'off'); openDrive(); toast('연결을 해제했습니다'); });
  });
  var saveBtn = $('#drvSave');
  if (saveBtn) saveBtn.addEventListener('click', function () {
    DiseaseDrive.setClientId($('#drvClient').value);
    toast('저장했습니다');
    openDrive();
  });
}

/* ── 이벤트 ───────────────────────────────────────────── */
function bindEvents() {
  var timer = null;
  $('#q').addEventListener('input', function (e) {
    var v = e.target.value;
    $('#clear').hidden = !v;
    clearTimeout(timer);
    timer = setTimeout(function () { state.q = v; state.open = {}; render(); }, 170);
  });
  $('#searchForm').addEventListener('submit', function (e) {
    e.preventDefault();
    state.q = $('#q').value;
    state.open = {};
    addRecent(state.q);
    refreshChips();
    render();
    $('#q').blur();
  });
  $('#clear').addEventListener('click', function () { setQuery('', true); $('#q').focus(); });
  $('#btnFind').addEventListener('click', function () {
    window.scrollTo({ top: 0, behavior: 'smooth' });
    setTimeout(function () { $('#q').focus(); $('#q').select(); }, 220);
  });
  $('#btnMenu').addEventListener('click', openMenu);
  $('#driveBarBtn').addEventListener('click', openDrive);
  $('#reset').addEventListener('click', function () {
    state.t = ''; state.ins = ''; $('#ins').value = '';
    syncSeg(); render();
  });
  $('#ins').addEventListener('change', function (e) {
    state.ins = e.target.value;
    if (state.ins && state.t && insType(state.ins) !== state.t) { state.t = ''; syncSeg(); }
    render();
  });
  $$('.seg button').forEach(function (b) {
    b.addEventListener('click', function () {
      state.t = b.getAttribute('data-t') || '';
      if (state.ins && insType(state.ins) !== state.t && state.t) { state.ins = ''; $('#ins').value = ''; }
      syncSeg(); render();
    });
  });
  $('#fab').addEventListener('click', function () {
    openEditor({ mode: 'new', ins: state.ins || INS[0].name });
  });
  $('#edCancel').addEventListener('click', closeEditor);
}
function bindDelegates() {
  document.addEventListener('click', function (e) {
    var t = e.target;
    var b = t.closest('[data-go],[data-q],[data-more],[data-notes],[data-img],[data-add],[data-memo],[data-edit],[data-lb],[data-sheet]');
    if (!b) return;
    if (b.hasAttribute('data-go')) {
      var el = document.getElementById('c-' + b.getAttribute('data-go'));
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      return;
    }
    if (b.hasAttribute('data-q')) {
      setQuery(b.getAttribute('data-q'), false);
      addRecent(state.q);
      refreshChips();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }
    if (b.hasAttribute('data-more')) { toggle(b.getAttribute('data-more'), '|more'); return; }
    if (b.hasAttribute('data-notes')) { toggle(b.getAttribute('data-notes'), '|n'); return; }
    if (b.hasAttribute('data-img')) { toggle(b.getAttribute('data-img'), '|i'); return; }
    if (b.hasAttribute('data-add')) { openEditor({ mode: 'new', ins: b.getAttribute('data-add') }); return; }
    if (b.hasAttribute('data-memo')) { openMemo(b.getAttribute('data-memo')); return; }
    if (b.hasAttribute('data-edit')) {
      var key = b.getAttribute('data-edit');
      if (key.charAt(0) === 'c') openEditor({ mode: 'edit', id: key.slice(1) });
      else openEditor({ mode: 'override', baseKey: key });
      return;
    }
    if (b.hasAttribute('data-lb')) {
      LB.ins = b.getAttribute('data-lb');
      LB.i = Number(b.getAttribute('data-i')) || 0;
      lbShow();
      return;
    }
    if (b.hasAttribute('data-sheet')) {
      var act = b.getAttribute('data-sheet');
      closeModal('#sheetModal');
      if (act === 'mList') openList();
      else if (act === 'mMine') openMine();
      else if (act === 'mPrint') openPrint();
      else if (act === 'mExport') exportJSON();
      else if (act === 'mImport') $('#restorePick').click();
      else if (act === 'mDrive') openDrive();
      else if (act === 'mHelp') openHelp();
    }
  });
}
function bindEditor() {
  $('#edAddKv').addEventListener('click', function () {
    $('#edKv').insertAdjacentHTML('beforeend', kvRowHTML('', ''));
    var rows = $$('#edKv .kvrow');
    $('.k', rows[rows.length - 1]).focus();
  });
  $('#edKv').addEventListener('click', function (e) {
    if (e.target.classList.contains('kvdel')) {
      var rows = $$('#edKv .kvrow');
      if (rows.length <= 1) { e.target.closest('.kvrow').querySelectorAll('input').forEach(function (i) { i.value = ''; }); return; }
      e.target.closest('.kvrow').remove();
    }
  });
  $('#edSave').addEventListener('click', saveEditor);
  $('#edDelete').addEventListener('click', deleteEditorEntry);
  $('#edRevert').addEventListener('click', revertOverride);
}
function bindModals() {
  $$('.modal').forEach(function (m) {
    m.addEventListener('click', function (e) { if (e.target === m) closeModal('#' + m.id); });
  });
  $('#confirmNo').addEventListener('click', function () { closeConfirm(false); });
  $('#confirmYes').addEventListener('click', function () { closeConfirm(true); });
  $('#printClose').addEventListener('click', function () { closeModal('#printModal'); });
  $('#printCancel').addEventListener('click', function () { closeModal('#printModal'); });
  $('#printGo').addEventListener('click', doPrint);
  $$('#printModal [data-popt]').forEach(function (el) {
    el.addEventListener('change', function () {
      var k = el.getAttribute('data-popt');
      if (k === 'max') PRINT.max = el.value;
      else PRINT[k] = el.checked;
      paintPrint();
    });
  });
  $('#lbClose').addEventListener('click', function () { closeModal('#lbModal'); });
  $('#lbPrev').addEventListener('click', function () { lbMove(-1); });
  $('#lbNext').addEventListener('click', function () { lbMove(1); });
  document.addEventListener('keydown', function (e) {
    if ($('#lbModal').hidden) {
      if (e.key === 'Escape') {
        if (!$('#confirmModal').hidden) closeConfirm(false);
        else if (!$('#printModal').hidden) closeModal('#printModal');
        else if (!$('#sheetModal').hidden) closeModal('#sheetModal');
        else if (!$('#editor').hidden) closeEditor();
      }
      return;
    }
    if (e.key === 'Escape') closeModal('#lbModal');
    if (e.key === 'ArrowRight') lbMove(1);
    if (e.key === 'ArrowLeft') lbMove(-1);
  });
  $('#restorePick').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0];
    if (f) restoreFile(f);
    e.target.value = '';
  });
  window.addEventListener('resize', function () { if (!$('#printModal').hidden) fitPaper(); });
}
function registerSW() {
  if (!('serviceWorker' in navigator)) return;
  if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') return;
  navigator.serviceWorker.register('./sw.js').catch(function (e) { console.warn('서비스 워커 등록 실패', e); });
}

function init() {
  buildAll();
  loadLocal();
  fillInsSelect();
  refreshChips();
  syncSeg();
  bindEvents();
  bindDelegates();
  bindEditor();
  bindModals();
  render();
  paintDrive(DiseaseDrive.label(), DiseaseDrive.status());
  DiseaseDrive.init();
  registerSW();
}
init();

</script>
</body>
</html>
