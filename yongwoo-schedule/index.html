<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>용우일정표</title>
<meta name="description" content="일간·주간·월간·연간이 한 번에 연동되는 연간일정표 — 음력과 공휴일 표시, 메모·사진·파일 첨부, A4 인쇄, PC·폰 구글 드라이브 동기화.">
<meta name="theme-color" content="#0f766e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="용우일정표">
<meta name="color-scheme" content="light">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
:root{
  --brand:#0f766e; --brand-d:#0a5a54; --brand-soft:#e4f3f1; --brand-line:#b3dbd5;
  --accent:#ffc93c; --accent-d:#c98f00;
  --ink:#16212b; --muted:#5c6a77; --faint:#8b97a3;
  --line:#dbe4e8; --bg:#f1f5f6; --card:#ffffff;
  --sun:#cf3527; --sat:#1b5fae;
  --radius:16px; --shadow:0 1px 2px rgba(12,35,40,.05),0 8px 20px rgba(12,35,40,.07);
  --tap:46px;
  --c-blue:#1b6fd0; --c-green:#0f8a4a; --c-orange:#d9760a; --c-red:#c53030; --c-purple:#7b3fbf; --c-gray:#5f6b78;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕","Noto Sans KR","Noto Sans CJK KR",system-ui,-apple-system,sans-serif;
  font-size:16.5px; line-height:1.5; -webkit-font-smoothing:antialiased;
  padding-bottom:calc(86px + env(safe-area-inset-bottom));
}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
h1,h2,h3,p{margin:0}
[hidden]{display:none !important}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ── 상단 ───────────────────────────────── */
.appbar{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line)}
.bar-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:6px;padding:7px 10px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#14a196,#0a5a54);display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 3px 8px rgba(15,118,110,.32)}
.brand-tx{flex:1;min-width:0;display:flex;flex-direction:column;padding-left:4px}
.brand-tx h1{font-size:20px;font-weight:800;letter-spacing:-.4px;line-height:1.15}
.brand-tx .sub{font-size:12.5px;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{min-width:44px;min-height:44px;border-radius:12px;font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center;color:#26323d}
.ibtn:active{background:#eef2f4}
.ibtn .badge{position:absolute;transform:translate(14px,-14px);background:var(--brand);color:#fff;font-size:10px;font-weight:800;border-radius:9px;padding:1px 5px}

/* 드라이브 알림 줄 */
.drive-wrap{max-width:1080px;margin:0 auto;padding:8px 10px 0}
.drive-btn{width:100%;min-height:42px;display:flex;align-items:center;gap:8px;padding:0 12px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);color:var(--brand);font-size:14.5px;font-weight:700;text-align:left;box-shadow:var(--shadow)}
.drive-btn .drive-ico{font-size:16px;flex:none}
.drive-btn .drive-txt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drive-btn .drive-hint{font-size:12px;font-weight:700;color:var(--muted);flex:none}
.drive-btn.on{background:#eaf7ef;border-color:#c2e5cf;color:#0a6b3c}
.drive-btn.sync{background:var(--brand-soft);border-color:var(--brand-line)}
.drive-btn.warn{background:#fff3df;border-color:#eccfa2;color:#8a4b00}

/* 보기 탭 */
.viewbar{max-width:1080px;margin:0 auto;padding:8px 10px 0}
.viewtabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:#e7eef0;border-radius:13px;padding:4px}
.vtab{min-height:42px;border-radius:10px;font-size:15.5px;font-weight:800;color:#3a4854;letter-spacing:-.3px;display:flex;align-items:center;justify-content:center}
.vtab.on{background:#fff;color:var(--brand-d);box-shadow:0 1px 3px rgba(12,35,40,.16)}
.vtab:active{transform:scale(.985)}

/* 기간 이동 줄 */
.navrow{max-width:1080px;margin:0 auto;padding:8px 10px 2px;display:flex;align-items:center;gap:4px}
.nav-btn{min-width:42px;height:42px;border-radius:11px;font-size:20px;font-weight:700;color:#31404c;display:flex;align-items:center;justify-content:center}
.nav-btn:active{background:#e6ecef}
.nav-title{flex:1;min-width:0;text-align:center;font-size:17px;font-weight:800;letter-spacing:-.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-title small{display:block;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:0}
.today-btn{min-height:40px;padding:0 12px;border-radius:11px;background:#fff;border:1.5px solid var(--line);font-size:13.5px;font-weight:800;color:var(--brand-d);flex:none}
.today-btn:active{background:var(--brand-soft)}
.today-btn.on{background:var(--brand);border-color:var(--brand);color:#fff}

main{max-width:1080px;margin:0 auto;padding:6px 10px 10px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow)}

/* ── 월간 ──────────────────────────────── */
.month-wrap{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:940px){
  .month-wrap{grid-template-columns:minmax(0,1fr) 330px;align-items:start}
  .month-wrap .day-panel{position:sticky;top:158px;max-height:calc(100vh - 180px);overflow-y:auto}
}
.cal{border-radius:var(--radius);background:#fff;box-shadow:var(--shadow);overflow:hidden}
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);background:#f7fafb;border-bottom:1px solid var(--line)}
.cal-head div{text-align:center;font-size:12.5px;font-weight:800;color:var(--muted);padding:7px 0}
.cal-head div.sun{color:var(--sun)}
.cal-head div.sat{color:var(--sat)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cell{position:relative;min-height:84px;padding:4px 3px 5px;border-right:1px solid #edf1f3;border-bottom:1px solid #edf1f3;display:flex;flex-direction:column;gap:1px;background:#fff;text-align:left;overflow:hidden}
.cell:nth-child(7n){border-right:0}
.cell.out{background:#fafcfc}
.cell.out .dnum{color:#b8c2ca}
.cell.out .lun{color:#c6ced4}
.cell:active{background:#f2f8f7}
.cell.sel{background:#e9f6f4;box-shadow:inset 0 0 0 2px var(--brand)}
.dnum{font-size:15px;font-weight:800;letter-spacing:-.3px;line-height:1.15;padding-left:2px;display:flex;align-items:center;gap:3px}
.cell.sun .dnum{color:var(--sun)}
.cell.sat .dnum{color:var(--sat)}
.cell.today .dnum span.num{background:var(--brand);color:#fff;border-radius:50%;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;font-size:14px}
.cell.holiday .dnum{color:var(--sun)}
.lun{font-size:9.5px;font-weight:700;color:#9aa6b1;line-height:1.1;padding-left:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lun.first{color:var(--brand);font-weight:900}
.lun.full{color:#b0741d;font-weight:900}
.hol{font-size:9.5px;font-weight:800;color:var(--sun);line-height:1.15;padding-left:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;flex-direction:column;gap:2px;margin-top:1px;min-width:0}
.chip{display:flex;align-items:center;gap:3px;font-size:9.5px;font-weight:800;line-height:1.25;border-radius:4px;padding:1px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;letter-spacing:-.2px}
.chip .dotm{width:4px;height:4px;border-radius:50%;background:#fff;flex:none}
.chip .ct{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell.out .chip{opacity:.62}
.more{font-size:9.5px;font-weight:800;color:var(--muted);padding-left:2px}
@media (min-width:600px){
  .cell{min-height:98px;padding:5px 5px 6px}
  .dnum{font-size:16px}
  .lun,.hol{font-size:11px;padding-left:3px}
  .chip{font-size:11.5px;padding:1.5px 4px}
  .more{font-size:11px}
}

/* 날짜 상세 패널 */
.day-panel{padding:0;overflow:hidden}
.dp-head{padding:12px 14px 10px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:8px;background:#fbfdfd}
.dp-head .dp-date{flex:1;min-width:0}
.dp-date b{display:block;font-size:18px;font-weight:800;letter-spacing:-.4px}
.dp-date span{display:block;font-size:12.5px;color:var(--muted);font-weight:700;margin-top:1px}
.dp-date .dp-hol{color:var(--sun);font-weight:800}
.dp-acts{display:flex;gap:6px;flex:none}
.dp-acts button{min-height:38px;padding:0 11px;border-radius:10px;font-size:13px;font-weight:800;background:var(--brand-soft);color:var(--brand-d)}
.dp-acts button.ghost{background:#eef2f4;color:#3a4854}
.dp-body{padding:8px 10px 12px;display:flex;flex-direction:column;gap:8px}
.empty-sm{text-align:center;color:var(--muted);font-size:14px;font-weight:700;padding:18px 8px}
.add-btn{width:100%;min-height:46px;border-radius:12px;background:var(--brand);color:#fff;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 4px 12px rgba(15,118,110,.24)}
.add-btn.ghost{background:#fff;color:var(--brand-d);box-shadow:none;border:1.5px dashed var(--brand-line)}

/* ── 일정 카드 ─────────────────────────── */
.ev{position:relative;display:flex;gap:9px;background:#fff;border-radius:13px;padding:10px 11px 10px 13px;box-shadow:0 1px 2px rgba(12,35,40,.06);border:1px solid #eaf0f2;width:100%;text-align:left;overflow:hidden}
.ev:before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--evc,var(--c-blue))}
.ev:active{background:#f7fbfb}
.ev .ev-time{flex:none;font-size:12.5px;font-weight:800;color:var(--muted);min-width:52px;line-height:1.35;padding-top:1px}
.ev .ev-time .t2{display:block;font-size:10.5px;color:var(--faint)}
.ev .ev-main{flex:1;min-width:0}
.ev .ev-title{font-size:16px;font-weight:800;letter-spacing:-.3px;line-height:1.32;word-break:keep-all;overflow-wrap:anywhere}
.ev .ev-memo{font-size:13.5px;color:var(--muted);line-height:1.42;margin-top:2px;word-break:keep-all;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.ev .ev-meta{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;color:var(--faint);margin-top:4px}
.ev .ev-meta .flag{background:#eef2f4;border-radius:6px;padding:1px 6px;color:#42505c}
.ev-thumbs{display:flex;gap:5px;margin-top:6px;overflow:hidden}
.ev-thumbs img{width:52px;height:52px;border-radius:8px;object-fit:cover;background:#eef2f4;flex:none}
.ev-thumbs .fchip{display:inline-flex;align-items:center;gap:4px;max-width:150px;font-size:11px;font-weight:800;background:#f2f6f7;border-radius:7px;padding:4px 7px;color:#42505c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.past{opacity:.78}

/* ── 주간 ──────────────────────────────── */
.week-list{display:flex;flex-direction:column;gap:8px}
.wday{border-radius:14px;background:#fff;box-shadow:var(--shadow);overflow:hidden}
.wday.today{box-shadow:0 0 0 2px var(--brand),var(--shadow)}
.wday-head{display:flex;align-items:center;gap:8px;padding:9px 12px;background:#f8fbfb;border-bottom:1px solid #edf2f3}
.wday.sun .wday-head{background:#fdf4f3}
.wday.sat .wday-head{background:#f3f7fd}
.wday-head .wd{font-size:12.5px;font-weight:900;color:var(--muted);width:22px;flex:none}
.wday.sun .wd{color:var(--sun)}
.wday.sat .wd{color:var(--sat)}
.wday-head .wdt{font-size:15.5px;font-weight:800;letter-spacing:-.3px}
.wday-head .wdt em{font-style:normal;font-size:12.5px;font-weight:700;color:var(--muted);margin-left:5px}
.wday-head .wadd{margin-left:auto;min-height:36px;padding:0 10px;border-radius:10px;font-size:13px;font-weight:800;background:var(--brand-soft);color:var(--brand-d);flex:none}
.wday-body{padding:8px 9px 9px;display:flex;flex-direction:column;gap:7px}
.wday.empty .wday-head{border-bottom:0;padding:7px 12px}
.wcnt{font-size:12px;font-weight:800;color:var(--muted);margin-left:auto;flex:none}
.wcnt.none{color:#b0bac2}
.wday .wadd{margin-left:0}
.wcnt + .wadd{margin-left:0}
.wday-body .empty-sm{padding:8px 4px;color:var(--faint);font-size:12.5px;text-align:left}
.wday .hol-tag{font-size:11px;font-weight:800;color:var(--sun);background:#fdecea;border-radius:6px;padding:1px 6px}

/* ── 일간 ──────────────────────────────── */
.day-hero{background:linear-gradient(135deg,#12867c,#0a5a54);color:#fff;border-radius:var(--radius);padding:16px 16px 14px;box-shadow:0 8px 22px rgba(10,90,84,.22)}
.day-hero .dh-top{display:flex;align-items:flex-end;gap:8px;flex-wrap:wrap}
.day-hero .dh-date{font-size:27px;font-weight:800;letter-spacing:-1px;line-height:1.1}
.day-hero .dh-wd{font-size:16px;font-weight:800;opacity:.92;padding-bottom:3px}
.day-hero .dh-lun{font-size:14px;font-weight:700;opacity:.92;margin-top:5px}
.day-hero .dh-sub{font-size:12.5px;font-weight:700;color:#d5efec;margin-top:2px}
.day-hero .dh-tags{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.day-hero .dh-tags span{background:rgba(255,255,255,.18);border-radius:8px;padding:2px 8px;font-size:12px;font-weight:800}
.day-hero .dh-tags span.hol{background:#fff2b8;color:#8a5a00}
.day-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.day-foot{margin-top:10px;display:flex;gap:8px}

/* ── 연간 ──────────────────────────────── */
.year-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
@media (min-width:720px){.year-grid{grid-template-columns:repeat(3,1fr)}}
@media (min-width:1060px){.year-grid{grid-template-columns:repeat(4,1fr)}}
.mini{background:#fff;border-radius:13px;padding:7px 7px 8px;box-shadow:var(--shadow)}
.mini-h{display:flex;align-items:center;justify-content:space-between;padding:1px 2px 5px}
.mini-h button{font-size:14.5px;font-weight:800;color:var(--brand-d);letter-spacing:-.3px;min-height:26px;padding:0 4px;border-radius:7px}
.mini-h button:active{background:var(--brand-soft)}
.mini-h .cnt{font-size:11px;font-weight:800;color:var(--faint)}
.mini-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
.mini-wd{text-align:center;font-size:9px;font-weight:800;color:var(--faint);padding-bottom:2px}
.mini-wd.sun{color:var(--sun)}
.mini-wd.sat{color:var(--sat)}
.mcell{position:relative;aspect-ratio:1/1.16;border-radius:5px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:2px;font-size:10.5px;font-weight:700;color:#38444f;background:none;min-width:0}
.mcell.out{color:#c3ccd3}
.mcell.sun{color:var(--sun)}
.mcell.sat{color:var(--sat)}
.mcell.hol{color:var(--sun);font-weight:900}
.mcell.today span.n{background:var(--brand);color:#fff;border-radius:50%;min-width:15px;height:15px;display:inline-flex;align-items:center;justify-content:center;font-size:9.5px}
.mcell:active{background:#e6f2f0}
.mcell .dts{display:flex;gap:1px;margin-top:1px;height:3px}
.mcell .dts i{width:3px;height:3px;border-radius:50%;display:block}
@media (min-width:720px){.mcell{font-size:11.5px}}

/* ── 검색 ──────────────────────────────── */
.search-box{display:flex;gap:6px;align-items:center;background:#fff;border-radius:13px;box-shadow:var(--shadow);padding:6px 8px}
.search-box input{flex:1;min-width:0;height:42px;border:0;outline:none;font-size:16px;background:none;padding:0 4px}
.search-box button{min-width:38px;height:38px;border-radius:9px;color:var(--muted);font-size:16px}
.search-res{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.sres{display:flex;gap:10px;align-items:flex-start;background:#fff;border-radius:12px;padding:10px 12px;box-shadow:var(--shadow);text-align:left;width:100%}
.sres .sd{flex:none;width:56px;text-align:center;font-weight:800}
.sres .sd b{display:block;font-size:15px;letter-spacing:-.4px}
.sres .sd small{display:block;font-size:11px;color:var(--muted);font-weight:700}
.sres .sc{flex:1;min-width:0}
.sres .sc b{display:block;font-size:15px;font-weight:800}
.sres .sc span{display:block;font-size:12.5px;color:var(--muted);margin-top:1px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ── 편집기 ────────────────────────────── */
#editor{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column}
.ed-bar{display:flex;align-items:center;gap:4px;background:#fff;border-bottom:1px solid var(--line);padding:6px 8px;flex:none}
.ed-bar .ed-title{flex:1;text-align:center;font-size:16.5px;font-weight:800;letter-spacing:-.3px}
.ebtn{min-width:44px;height:44px;border-radius:11px;font-size:15px;font-weight:800;color:#33414d;display:flex;align-items:center;justify-content:center;padding:0 10px}
.ebtn:active{background:#eef2f4}
.ebtn.save{background:var(--brand);color:#fff;border-radius:11px;height:42px;padding:0 15px;font-size:15px}
.ebtn.del{color:#a3261e}
.ed-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 28px;width:100%;max-width:720px;margin:0 auto}
.fld{background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:12px;margin-bottom:10px}
.fld-label{font-size:12.5px;font-weight:800;color:var(--faint);letter-spacing:.2px;margin-bottom:6px}
.row2{display:flex;gap:8px}
.row2 > *{flex:1;min-width:0}
input[type=date],input[type=time],input[type=text].inp,textarea.inp{width:100%;border:1.5px solid var(--line);border-radius:11px;background:#fff;padding:0 11px;height:48px;font-size:16px;outline:none}
input[type=date]:focus,input[type=time]:focus,.inp:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(15,118,110,.12)}
textarea.inp{height:auto;min-height:150px;padding:11px;line-height:1.6;resize:vertical}
.ed-title-in{width:100%;border:0;outline:none;background:transparent;font-size:20px;font-weight:800;letter-spacing:-.4px;padding:4px 2px}
.ed-title-in::placeholder{color:#b6c0c8;font-weight:700}
.swrow{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line);flex:none}
.sw.on{box-shadow:0 0 0 3px var(--brand)}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:800;color:#33414d;min-height:44px}
.toggle input{width:22px;height:22px;accent-color:var(--brand)}
input[type=date],input[type=time]{color-scheme:light}
.att-row{display:flex;gap:6px;flex-wrap:wrap}
.att-row button{min-height:44px;padding:0 11px;border-radius:11px;background:#f1f5f6;border:1.5px solid var(--line);font-size:13.5px;font-weight:800;color:#33414d;display:inline-flex;align-items:center;gap:5px}
.att-row button:active{background:var(--brand-soft)}
.att-strip{display:flex;gap:8px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.att-strip::-webkit-scrollbar{display:none}
.att-item{position:relative;width:80px;height:80px;border-radius:12px;overflow:hidden;background:#eef1f7;flex:none;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--line)}

#printRoot{display:none}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));z-index:120;background:rgba(14,32,36,.95);color:#fff;font-size:14px;font-weight:700;padding:11px 16px;border-radius:12px;max-width:88vw;text-align:center;box-shadow:0 8px 22px rgba(8,30,34,.3);line-height:1.45}

.fab span{font-size:15px;font-weight:800}

@media (max-width:380px){
  .cell{min-height:74px}

}

}

/* ═══════════════════════════════════════════════════════════════
   용우일정표 — 일간·주간·월간·연간 연간일정표 (단일 파일 PWA)

function esc(s) {

    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')

function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }

/* ── 날짜 ─────────────────────────────────────────────── */
function ymd(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function parseYMD(s) {
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s || ''));

function fmtMD(s) { var d = parseYMD(s); return d ? (d.getMonth() + 1) + '.' + d.getDate() + '.' : ''; }

/* ── 연간 ─────────────────────────────────────────────── */
function renderYear() {
  var y = parseYMD(S.sel).getFullYear();
  var today = todayYMD();
  var counts = countBetween(y + '-01-01', y + '-12-31');
  var html = '<div class="year-grid">';
  for (var mo = 0; mo < 12; mo++) {
    var first = ymd(new Date(y, mo, 1));
    var gridStart = startOfWeek(first);
    var last = ymd(new Date(y, mo + 1, 0));
    var cnt = 0;
    Object.keys(counts).forEach(function (ds) { if (ds.slice(0, 7) === first.slice(0, 7)) cnt += counts[ds]; });
    html += '<section class="mini">' +
      '<div class="mini-h"><button type="button" data-act="gomonth" data-ds="' + first + '">' + (mo + 1) + '월</button>' +
        '<span class="cnt">' + (cnt ? cnt + '건' : '') + '</span></div>' +
      '<div class="mini-grid">';
    for (var k = 0; k < 7; k++) html += '<div class="mini-wd' + (k === 0 ? ' sun' : (k === 6 ? ' sat' : '')) + '">' + WEEK_KO[k] + '</div>';
    for (var i = 0; i < 42; i++) {
      var ds = addDays(gridStart, i);
      var d = parseYMD(ds);
      if (i >= 35 && d.getMonth() !== mo) break;
      var inMonth = d.getMonth() === mo;
      var w = d.getDay();
      var h = holidayOf(ds);
      var n = counts[ds] || 0;
      var dots = '';
      if (n) {
        var cs = eventsOn(ds).slice(0, 3);
        dots = '<span class="dts">' + cs.map(function (e) { return '<i style="background:' + colorHex(e.color) + '"></i>'; }).join('') + '</span>';
      }
      html += '<button type="button" class="mcell' + (inMonth ? '' : ' out') + (w === 0 ? ' sun' : (w === 6 ? ' sat' : '')) +
        (h ? ' hol' : '') + (ds === today ? ' today' : '') + '" data-act="pick" data-ds="' + ds + '"' +
        (inMonth ? '' : ' tabindex="-1"') + '>' +
        '<span class="n">' + d.getDate() + '</span>' + dots + '</button>';
    }
    html += '</div></section>';
  }
  html += '</div>' +
    '<p class="hint" style="text-align:center;padding:12px 6px 4px">날짜를 누르면 그 날 일정을 보고 바로 추가할 수 있습니다. 월 이름을 누르면 월간 일정표로 갑니다.</p>';
  $('#viewRoot').innerHTML = html;
}

/* ── 검색 ─────────────────────────────────────────────── */
function renderSearch() {
  var q = S.q.trim().toLowerCase();
  var rows = [];
  if (q) {
    liveEvents().forEach(function (e) {
      var hay = (e.title + ' ' + e.memo + ' ' + datesOf(e).map(function (ds) { return ds + ' ' + lunarText(ds) + ' ' + holidayOf(ds); }).join(' ') + ' ' +
        attsOf(e.id).map(function (a) { return a.name; }).join(' ')).toLowerCase();
      if (hay.indexOf(q) >= 0) rows.push(e);
    });
    rows.sort(function (a, b) { return a.date < b.date ? 1 : (a.date > b.date ? -1 : 0); });
  }
  var list = rows.slice(0, 200).map(function (e) {
    var d = parseYMD(e.date);
    return '<button type="button" class="sres" data-act="goev" data-eid="' + esc(e.id) + '">' +
      '<div class="sd"><b>' + (d.getMonth() + 1) + '/' + d.getDate() + '</b><small>' + WEEK_KO[d.getDay()] + ' · ' + esc(lunarText(e.date)) + '</small></div>' +
      '<div class="sc"><b>' + esc(e.title || '(제목 없음)') + '</b><span>' + esc(e.memo || eventTimeText(e)) + '</span></div>' +
    '</button>';
  }).join('');
  $('#viewRoot').innerHTML =
    '<div class="search-box"><input id="qInput" type="search" placeholder="제목·메모·날짜·음력·파일명 검색" value="' + esc(S.q) + '" autocomplete="off" enterkeyhint="search"><button type="button" data-act="closeSearch" aria-label="검색 닫기">✕</button></div>' +
    '<div class="search-res">' +
      (q ? (rows.length ? '<p class="hint">' + rows.length + '건 찾았습니다</p>' + list : '<p class="empty-sm">찾는 일정이 없습니다.</p>')
         : '<p class="empty-sm">찾을 말을 적어 주세요.<br>예) 치과, 성종락, 10.17, 추석</p>') +

/* ==== editor.js ==== */
/* ══════════════ 편집기 ══════════════ */
var ED_SRC_ATTS = [];     // 편집을 열었을 때 이미 있던 첨부
var ED_DEL_ATTS = [];     // 편집 중 지운 첨부 id

function guessType(f) {
  if (f.type) return f.type;
  if (/\.pdf$/i.test(f.name || '')) return 'application/pdf';
  if (/\.(jpe?g|png|gif|webp|heic|heif|bmp)$/i.test(f.name || '')) return 'image/' + f.name.split('.').pop().toLowerCase();
  return 'application/octet-stream';
}
function loadImageEl(file) {
  return new Promise(function (resolve, reject) {
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('이미지를 읽지 못했습니다')); };
    img.src = url;
  });
}
/* 사진은 긴 변 1600px·JPEG 80%로 자동 압축 (용우노트와 같은 기준) */
var IMG_MAX_SIDE = 1600, IMG_QUALITY = 0.8, IMG_KEEP_BYTES = 1000000;
function compressImage(file) {
  var type = guessType(file);
  if (!/^image\//.test(type) || /svg/i.test(type)) return Promise.resolve({ blob: file, name: file.name, changed: false });
  return loadImageEl(file).then(function (img) {
    var w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
    if (!w || !h) return { blob: file, name: file.name, changed: false };
    var scale = Math.min(1, IMG_MAX_SIDE / Math.max(w, h));
    if (scale === 1 && file.size <= IMG_KEEP_BYTES) return { blob: file, name: file.name, changed: false, width: w, height: h };
    var tw = Math.max(1, Math.round(w * scale)), th = Math.max(1, Math.round(h * scale));
    var canvas = document.createElement('canvas');
    canvas.width = tw; canvas.height = th;
    var g = canvas.getContext('2d');
    g.fillStyle = '#ffffff'; g.fillRect(0, 0, tw, th);
    g.drawImage(img, 0, 0, tw, th);
    return new Promise(function (resolve) {
      canvas.toBlob(function (blob) {
        if (!blob || (scale === 1 && blob.size >= file.size) || (blob.size >= file.size && file.size < 400000)) {
          resolve({ blob: file, name: file.name, changed: false, width: w, height: h });
        } else {
          var base = (file.name || '사진').replace(/\.[^.]+$/, '');
          resolve({ blob: blob, name: base + '.jpg', changed: true, origSize: file.size, width: tw, height: th });
        }
      }, 'image/jpeg', IMG_QUALITY);
    });
  }).catch(function () { return { blob: file, name: file.name, changed: false }; });
}

function buildColorRow() {
  $('#edColors').innerHTML = COLORS.map(function (c) {
    return '<button type="button" class="sw" data-color="' + c.id + '" style="background:' + c.c + '" aria-label="' + c.name + '"></button>';
  }).join('');
  var cur = S.ed ? S.ed.color : 'blue';
  $$('#edColors .sw').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-color') === cur); });
}

function newEvent(ds) {
  var now = Date.now();
  return normEvent({
    id: uid(), date: ds || S.sel || todayYMD(), allDay: true,
    title: '', memo: '', color: 'blue', createdAt: now, updatedAt: now
  });
}

function openEditor(ev, isNew) {
  if (isNew || !ev) { S.ed = newEvent(ev && ev.date ? ev.date : (S.sel || todayYMD())); S.edNew = true; }
  else { S.ed = normEvent(ev); S.edNew = false; }
  ED_SRC_ATTS = S.edNew ? [] : attsOf(S.ed.id).slice();
  ED_DEL_ATTS = [];
  S.edAtts = ED_SRC_ATTS.slice();

  $('#editor').hidden = false;
  $('#edBarTitle').textContent = S.edNew ? '새 일정' : '일정 수정';
  $('#edDelete').hidden = S.edNew;
  fillEditor();
  pushStateSafe();
  setTimeout(function () { if (S.edNew && !S.ed.title) $('#edTitle').focus(); }, 120);
}

function fillEditor() {
  var e = S.ed;
  $('#edDate').value = e.date;
  $('#edEnd').value = e.endDate || e.date;
  $('#edMulti').checked = !!e.endDate;
  $('#edEndRow').hidden = !e.endDate;
  $('#edAllDay').checked = !!e.allDay;
  $('#edTimeRow').hidden = !!e.allDay;
  $('#edStart').value = e.start || '09:00';
  $('#edEndTime').value = e.end || '10:00';
  $('#edTitle').value = e.title || '';
  $('#edMemo').value = e.memo || '';
  $('#edTitleLunar').textContent = '';
  buildColorRow();
  renderEdAtts();
  updateEdDateInfo();
}
function updateEdDateInfo() {
  var ds = $('#edDate').value || S.ed.date;
  var l = lunarText(ds), h = holidayOf(ds);
  var w = parseYMD(ds) ? WEEK_KO[wdOf(ds)] + '요일' : '';
  $('#edLunar').innerHTML = '<b style="color:#0a5a54">' + esc(l || '음력 없음') + '</b>' +
    (h ? ' · <span style="color:#c0392b">' + esc(h) + '</span>' : '') +
    (w ? ' · <span style="color:#8b97a3">' + w + '</span>' : '');
  var end = $('#edEnd').value;
  if (end && end < ds) $('#edEnd').value = ds;
  var span = end && end > ds ? (dayDiff(ds, end) + 1) + '일 일정' : '';
  $('#edTitleLunar').textContent = '';
  if (span) $('#edTitleLunar').textContent = span;
}

function renderEdAtts() {
  var box = $('#edAtts');
  if (!S.edAtts.length) { box.hidden = true; box.innerHTML = ''; return; }
  box.hidden = false;
  box.innerHTML = S.edAtts.map(function (a) {
    var inner = isImageAtt(a) ? '<img src="' + attURL(a) + '" alt="">' :
      '<span class="att-ico">' + (isPdfAtt(a) ? '📄' : '📎') + '</span>';
    return '<button type="button" class="att-item" data-att-id="' + esc(a.id) + '" title="' + esc(a.name) + '">' +
      inner + '<span class="att-name">' + esc(a.name || '') + '</span></button>';
  }).join('');
}

function addFiles(fileList) {
  if (!S.ed) return Promise.resolve();
  var files = Array.prototype.slice.call(fileList || []);
  if (!files.length) return Promise.resolve();
  toast(files.length > 1 ? files.length + '개 파일을 준비하는 중입니다…' : '사진을 준비하는 중입니다…');
  var chain = Promise.resolve();
  var added = [], shrunk = 0, skipped = 0;
  files.forEach(function (f) {
    chain = chain.then(function () {
      if (f.size > 40 * 1024 * 1024) { skipped++; return; }
      return compressImage(f).then(function (r) {
        var type = r.blob.type || guessType(f);
        if (r.changed) shrunk++;
        added.push({
          id: uid(), eventId: S.ed.id, name: r.name || f.name || '첨부파일',
          type: type, size: r.blob.size, blob: r.blob,
          kind: /^image\//.test(type) ? 'photo' : (type === 'application/pdf' ? 'pdf' : 'file'),
          createdAt: Date.now()
        });
      }).catch(function () { skipped++; });
    });
  });
  return chain.then(function () {
    if (!added.length) { toast('파일을 붙이지 못했습니다'); return; }
    added.forEach(function (a) { S.edAtts.push(a); });
    renderEdAtts();
    toast(added.length + '개를 붙였습니다' + (shrunk ? ' · 사진 ' + shrunk + '장 자동 압축' : '') + (skipped ? ' · ' + skipped + '개 제외' : ''));
  });
}

function removeEdAtt(id) {
  S.edAtts = S.edAtts.filter(function (a) { return a.id !== id; });
  ED_DEL_ATTS.push(id);
  renderEdAtts();
  toast('첨부를 뺐습니다. 저장하면 완전히 지워집니다');
}

function saveEditor() {
  var e = S.ed;
  if (!e) return;
  var ds = $('#edDate').value;
  if (!parseYMD(ds)) { toast('날짜를 골라 주세요'); return; }
  var end = $('#edMulti').checked ? $('#edEnd').value : '';
  if (end && !parseYMD(end)) end = '';
  if (end && end < ds) { toast('마지막 날이 시작일보다 앞섭니다'); return; }
  var allDay = $('#edAllDay').checked;
  var title = $('#edTitle').value.trim();
  var memo = $('#edMemo').value;
  if (!title && !memo.trim()) { toast('제목이나 메모를 적어 주세요'); return; }
  if (!title) title = memo.trim().split('\n')[0].slice(0, 60);

  e.date = ds;
  e.endDate = end || '';
  e.allDay = allDay;
  e.start = allDay ? '' : ($('#edStart').value || '09:00');
  e.end = allDay ? '' : ($('#edEndTime').value || '');
  e.title = title;
  e.memo = memo;
  var picked = $('#edColors .sw.on');
  e.color = picked ? picked.getAttribute('data-color') : 'blue';
  e.updatedAt = Date.now();

  var idx = -1;
  for (var i = 0; i < S.events.length; i++) if (S.events[i].id === e.id) { idx = i; break; }
  if (idx >= 0) S.events[idx] = e; else S.events.push(e);
  saveEvents();

  var jobs = [];
  S.edAtts.forEach(function (a) { a.eventId = e.id; a.type = a.type || ''; });
  ED_DEL_ATTS.forEach(function (id) {
    var st = syncState();
    st.deleted = st.deleted || {};
    st.deleted[id] = Date.now();
    saveSyncState(st);
    forgetURL(id);
    jobs.push(dbDel('attachments', id).catch(function () {}));
  });
  var put = S.edAtts.filter(function (a) { return !attOf(a.id); });

  var done = function () {
    return loadAtts().then(function () {
      bumpRev();
      S.sel = ds;
      S.cursor = ds;
      closeEditorNow();
      renderAll();
      toast(S.edNew ? '일정을 저장했습니다' : '일정을 고쳤습니다');
    });
  };
  dbPutMany('attachments', put).then(done).catch(function () {
    toast('사진·파일은 저장하지 못했습니다. 일정은 저장했습니다');
    done();
  });
}

function deleteEvent(ev) {
  if (!ev) return;
  ev = eventById(ev.id) || ev;
  askConfirm('이 일정을 지울까요?<br><span style="font-size:13.5px;color:#5b6b7b">' + esc(ev.title || '(제목 없음)') + ' · 사진·파일도 함께 지워집니다.</span>', '지우기', true).then(function (ok) {
    if (!ok) return;
    var now = Date.now();
    ev.deletedAt = now;
    ev.updatedAt = now;
    saveEvents();
    var st = syncState();
    st.deleted = st.deleted || {};
    attsOf(ev.id).forEach(function (a) {
      st.deleted[a.id] = now;
      forgetURL(a.id);
      dbDel('attachments', a.id).catch(function () {});
    });
    saveSyncState(st);
    bumpRev();
    loadAtts().then(function () {
      closeEditorNow();
      renderAll();
      toast('일정을 지웠습니다');
    });
  });
}

function closeEditorNow() {
  $('#editor').hidden = true;
  S.ed = null;
  S.edNew = false;
  S.edAtts = [];
  ED_SRC_ATTS = [];
  ED_DEL_ATTS = [];
}

/* ══════════════ 첨부 보기 ══════════════ */
function openViewer(attId) {
  var a = attOf(attId);
  if (!a) return;
  $('#viewerName').textContent = a.name || '';
  var body = $('#viewerBody'), foot = $('#viewerFoot');
  body.innerHTML = ''; foot.innerHTML = '';
  var url = attURL(a);
  if (isPdfAtt(a)) {
    body.innerHTML = '<iframe src="' + url + '" title="PDF"></iframe>';
    foot.innerHTML = '<a href="' + url + '" download="' + esc(a.name) + '">⬇ 내려받기</a>';

function setView(v) {
  if (!v) return;
  S.searching = false;
  S.view = v;
  S.cursor = S.sel;
  setPrefs({ view: v });

}
function goToday() {
  S.searching = false;

function shiftPeriod(n) {
  if (S.searching) S.searching = false;
  if (S.view === 'day') S.sel = addDays(S.sel, n);
  else if (S.view === 'week') S.sel = addDays(S.sel, 7 * n);
  else if (S.view === 'month') {
    var d = parseYMD(S.sel);
    var day = d.getDate();
    var nd = new Date(d.getFullYear(), d.getMonth() + n, 1);
    var last = new Date(nd.getFullYear(), nd.getMonth() + 1, 0).getDate();
    S.sel = ymd(new Date(nd.getFullYear(), nd.getMonth(), Math.min(day, last)));
  } else {
    var y = parseYMD(S.sel);
    var day2 = y.getDate(), mo = y.getMonth();
    var ny = y.getFullYear() + n;
    var last2 = new Date(ny, mo + 1, 0).getDate();
    S.sel = ymd(new Date(ny, mo, Math.min(day2, last2)));
  }
  S.cursor = S.sel;
  renderAll();
  window.scrollTo(0, 0);
}

        '</div>';
    }
  } else if (S.view === 'month') {
    var m = parseYMD(S.sel);
    var first = ymd(new Date(m.getFullYear(), m.getMonth(), 1));
    var gs = startOfWeek(first);
    body = head + '<h3 class="pt">' + m.getFullYear() + '년 ' + (m.getMonth() + 1) + '월</h3>' +
      '<div class="pmeta">음력·공휴일 표시 · 일정은 날짜 칸에 적었습니다</div>' +
      '<table class="pcal"><thead><tr>';
    for (var k = 0; k < 7; k++) body += '<th>' + WEEK_KO[k] + '</th>';
    body += '</tr></thead><tbody>';
    var daysInMonth = parseYMD(ymd(new Date(m.getFullYear(), m.getMonth() + 1, 0))).getDate();
    var rowsN = Math.ceil((wdOf(first) + daysInMonth) / 7);
    for (var r = 0; r < rowsN; r++) {
      body += '<tr>';
      for (var c = 0; c < 7; c++) {
        var ds2 = addDays(gs, r * 7 + c), d2 = parseYMD(ds2);
        var inM = d2.getMonth() === m.getMonth();
        var evs3 = eventsOn(ds2), hol = holidayOf(ds2);
        body += '<td class="' + (inM ? '' : 'out') + (c === 0 ? ' sun' : '') + (c === 6 ? ' sat' : '') + '"><div class="cd">' + d2.getDate() + '</div>' +
          '<div class="cl">' + esc(lunarText(ds2)) + (hol ? ' · ' + esc(hol) : '') + '</div>' +
          evs3.map(function (e) { return '<div class="ce">• ' + esc(e.title || '일정') + '</div>'; }).join('') + '</td>';
      }
      body += '</tr>';
    }
    body += '</tbody></table>';
  } else {
    var y = parseYMD(S.sel).getFullYear();
    var counts = countBetween(y + '-01-01', y + '-12-31');
    body = head + '<h3 class="pt">' + y + '년 연간일정표</h3><div class="pmeta">음력·공휴일 · 굵은 날은 일정이 있는 날</div><div class="pgrid">';
    for (var mo = 0; mo < 12; mo++) {

      var g2 = startOfWeek(f);
      body += '<div class="pmini"><h4>' + (mo + 1) + '월</h4><table><tr>';
      for (var w = 0; w < 7; w++) body += '<td style="color:' + (w === 0 ? '#c00' : (w === 6 ? '#1b5fae' : '#333')) + '">' + WEEK_KO[w] + '</td>';
      body += '</tr>';
      for (var rr = 0; rr < 6; rr++) {
        body += '<tr>';
        for (var cc = 0; cc < 7; cc++) {
          var ds3 = addDays(g2, rr * 7 + cc), d3 = parseYMD(ds3);

        }
        body += '</tr>';
      }
      body += '</table></div>';
    }
    body += '</div>';
  }
  return body;
}

/* ══════════════ 백업 ══════════════ */
function safeName(s) { return String(s || 'file').replace(/[\\/:*?"<>|]+/g, '_').slice(0, 80); }
function downloadBlob(blob, name) {
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 800);
}
function exportJSON() {
  loadAtts().then(function (atts) {
    var jobs = atts.map(function (a) {
      return blobToB64(a.blob).then(function (d) {
        return { id: a.id, eventId: a.eventId, name: a.name, type: a.type, size: a.size, kind: a.kind, createdAt: a.createdAt, data: d };
      }).catch(function () { return null; });
    });
    return Promise.all(jobs).then(function (files) {
      var payload = {
        app: 'yongwoo-schedule', version: 1, exportedAt: new Date().toISOString(),
        events: S.events, files: files.filter(Boolean)
      };
      var blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
      downloadBlob(blob, safeName('용우일정표-백업-' + todayYMD()) + '.json');
      toast('백업 파일을 내려받았습니다');
    });
  });
}
function handleRestoreFile(file) {
  if (!file) return;
  var fr = new FileReader();
  fr.onload = function () {
    var p = null;
    try { p = JSON.parse(String(fr.result)); } catch (e) { p = null; }
    if (!p || p.app !== 'yongwoo-schedule' || !Array.isArray(p.events)) { toast('용우일정표 백업 파일이 아닙니다'); return; }
    askConfirm('백업으로 복원할까요?<br><span style="font-size:13.5px;color:#5b6b7b">이 기기의 일정 ' + liveEvents().length + '개가 백업 내용 ' + p.events.length + '개로 바뀝니다.</span>', '복원', true).then(function (ok) {
      if (!ok) return;
      var evs = p.events.map(normEvent);
      var files = [], jobs = [];
      (p.files || []).forEach(function (f) {
        if (!f || !f.id || !f.data) return;
        try {
          files.push({
            id: f.id, eventId: f.eventId || '', name: f.name || '첨부파일', type: f.type || '',
            size: Number(f.size) || 0, kind: f.kind || 'file',
            blob: b64ToBlob(f.data, f.type), createdAt: Number(f.createdAt) || Date.now()
          });
        } catch (e) {}
      });
      /* 백업에 없는 기존 일정은 지운 표시(tombstone)로 남겨, 다른 기기와 동기화해도 되살아나지 않게 합니다. */
      var keep = {};
      evs.forEach(function (e) { keep[e.id] = 1; });
      var now = Date.now();
      var st = syncState();
      st.deleted = st.deleted || {};
      S.events.forEach(function (o) {
        if (keep[o.id]) return;
        keep[o.id] = 1;
        evs.push(normEvent({ id: o.id, date: o.date, title: o.title, memo: o.memo, color: o.color, createdAt: o.createdAt, updatedAt: now, deletedAt: now, allDay: o.allDay, start: o.start, end: o.end, endDate: o.endDate }));
        st.deleted[o.id] = now;
        attsOf(o.id).forEach(function (a) { st.deleted[a.id] = now; });
      });
      saveSyncState(st);
      S.events = evs;
      saveEvents();
      dbClear('attachments').then(function () { return dbPutMany('attachments', files); }).then(function () {
        return loadAtts();
      }).then(function () {
        urlCache.forEach(function (u) { try { URL.revokeObjectURL(u); } catch (e) {} });
        urlCache.clear();
        bumpRev();
        renderAll();
        toast('백업으로 복원했습니다');
      });
    });
  };
  fr.readAsText(file);
}

/* ══════════════ 알림·확인 ══════════════ */
var toastTimer = null;
function toast(msg) {
  var el = $('#toast');
  el.textContent = msg;
  el.hidden = false;
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.hidden = true; }, 2600);
}
var confirmResolve = null;
function askConfirm(text, yesLabel, danger) {
  $('#confirmText').innerHTML = text;
  var yes = $('#confirmYes');
  yes.textContent = yesLabel || '확인';
  yes.classList.toggle('danger', !!danger);
  $('#confirmModal').hidden = false;
  pushStateSafe();
  return new Promise(function (resolve) { confirmResolve = resolve; });
}
function answerConfirm(ok) {
  $('#confirmModal').hidden = true;
  var r = confirmResolve;
  confirmResolve = null;
  if (r) r(!!ok);
}

/* ══════════════ 뒤로 가기 ══════════════ */
var histPushed = 0, ignorePop = false;
function pushStateSafe() {
  histPushed++;
  try { history.pushState({ hp: histPushed }, ''); } catch (e) {}
}
function backState() {
  if (histPushed > 0) {
    ignorePop = true;
    try { history.back(); } catch (e) {}
  }
}
function closeTopOnBack() {
  if (!$('#confirmModal').hidden) { answerConfirm(false); return true; }
  if (!$('#viewerModal').hidden) { $('#viewerModal').hidden = true; return true; }
  if (!$('#printModal').hidden) { $('#printModal').hidden = true; return true; }
  if (!$('#sheetModal').hidden) { closeSheet(); return true; }
  if (!$('#editor').hidden) { closeEditorNow(); return true; }
  if (S.searching) { S.searching = false; renderAll(); return true; }
  return false;
}
window.addEventListener('popstate', function () {
  histPushed = Math.max(0, histPushed - 1);
  if (ignorePop) { ignorePop = false; return; }
  closeTopOnBack();
});

/* ══════════════ 입력 연결 ══════════════ */
function onViewClick(e) {
  var attEl = e.target.closest('[data-att-id]');
  if (attEl) { openViewer(attEl.getAttribute('data-att-id')); return; }
  var t = e.target.closest('[data-act]');
  if (!t) {
    var evEl = e.target.closest('[data-eid]');
    if (evEl) {
      var ev = eventById(evEl.getAttribute('data-eid'));
      if (ev) openEditor(ev, false);
    }
    return;
  }
  var act = t.getAttribute('data-act');
  var ds = t.getAttribute('data-ds');
  if (act === 'pick') {
    if (S.view === 'year') { openDaySheet(ds); return; }
    var jumped = S.view === 'month' && ds.slice(0, 7) !== S.sel.slice(0, 7);
    S.sel = ds;
    S.cursor = ds;
    if (jumped) { renderAll(); return; }
    renderKeepScroll();
    if (S.view === 'month' && window.innerWidth < 940) {
      var p = $('#dayPanel');
      if (p) setTimeout(function () { p.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }, 40);
    }
    return;
  }
  if (act === 'add') { closeSheet(); openEditor(newEvent(ds || S.sel), true); return; }
  if (act === 'goday') { closeSheet(); S.searching = false; S.view = 'day'; S.sel = ds || S.sel; renderAll(); window.scrollTo(0, 0); return; }
  if (act === 'gomonth') { closeSheet(); S.searching = false; S.view = 'month'; S.sel = ds; renderAll(); window.scrollTo(0, 0); return; }
  if (act === 'goev') {
    var ev2 = eventById(t.getAttribute('data-eid'));
    if (ev2) { S.searching = false; S.view = 'day'; S.sel = ev2.date; renderAll(); }
    return;
  }
  if (act === 'closeSearch') { S.searching = false; S.q = ''; renderAll(); return; }
  if (act === 'driveSheet') { closeSheet(); openDriveSheet(); return; }
  if (act === 'printCurrent') { closeSheet(); openPrint(); return; }
  if (act === 'exportJSON') { closeSheet(); exportJSON(); return; }
  if (act === 'restoreJSON') { closeSheet(); $('#restorePick').click(); return; }
  if (act === 'about') { closeSheet(); openAbout(); return; }
  if (act === 'closeSheet') { closeSheet(); return; }
}

function bindEvents() {
  $$('.vtab').forEach(function (b) {
    b.addEventListener('click', function () { setView(b.getAttribute('data-view')); });
  });
  $('#navPrev').addEventListener('click', function () { shiftPeriod(-1); });
  $('#navNext').addEventListener('click', function () { shiftPeriod(1); });
  $('#btnToday').addEventListener('click', goToday);
  $('#fab').addEventListener('click', function () { openEditor(newEvent(S.sel), true); });
  $('#btnSearch').addEventListener('click', function () {
    S.searching = true;
    S.q = '';
    renderAll();
  });
  $('#btnMenu').addEventListener('click', openMainMenu);
  $('#driveBarBtn').addEventListener('click', openDriveSheet);
  $('#viewRoot').addEventListener('click', onViewClick);
  $('#sheetBox').addEventListener('click', onViewClick);

  $('#edCancel').addEventListener('click', function () {
    if (S.ed && !S.edNew) { closeEditorNow(); renderAll(); }
    else closeEditorNow();
  });
  $('#edSave').addEventListener('click', saveEditor);
  $('#edDelete').addEventListener('click', function () { deleteEvent(S.ed); });
  $('#edDate').addEventListener('change', updateEdDateInfo);
  $('#edEnd').addEventListener('change', updateEdDateInfo);
  $('#edMulti').addEventListener('change', function () {
    $('#edEndRow').hidden = !this.checked;
    if (this.checked && !$('#edEnd').value) $('#edEnd').value = $('#edDate').value;
    updateEdDateInfo();
  });
  $('#edAllDay').addEventListener('change', function () {
    $('#edTimeRow').hidden = this.checked;
  });
  $('#edColors').addEventListener('click', function (e) {
    var b = e.target.closest('[data-color]');
    if (!b) return;
    $$('#edColors .sw').forEach(function (x) { x.classList.remove('on'); });
    b.classList.add('on');
  });
  $('#btnCam').addEventListener('click', function () { $('#camPick').click(); });
  $('#btnPic').addEventListener('click', function () { $('#picPick').click(); });
  $('#btnFile').addEventListener('click', function () { $('#filePick').click(); });
  $('#camPick').addEventListener('change', function () { addFiles(this.files); this.value = ''; });
  $('#picPick').addEventListener('change', function () { addFiles(this.files); this.value = ''; });
  $('#filePick').addEventListener('change', function () { addFiles(this.files); this.value = ''; });
  $('#edAtts').addEventListener('click', function (e) {
    var b = e.target.closest('[data-att-id]');
    if (b) openViewer(b.getAttribute('data-att-id'));
  });

  $('#viewerClose').addEventListener('click', function () { $('#viewerModal').hidden = true; });
  $('#printClose').addEventListener('click', function () { $('#printModal').hidden = true; });
  $('#printCancel').addEventListener('click', function () { $('#printModal').hidden = true; });
  $('#printGo').addEventListener('click', doPrint);
  $('#optPhotos').addEventListener('change', renderPrintPreview);
  $('#optMemo').addEventListener('change', renderPrintPreview);
  $('#confirmNo').addEventListener('click', function () { answerConfirm(false); });
  $('#confirmYes').addEventListener('click', function () { answerConfirm(true); });
  $('#restorePick').addEventListener('change', function () { handleRestoreFile(this.files[0]); this.value = ''; });

  document.addEventListener('keydown', function (e) {
    if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    if (!$('#editor').hidden || !$('#sheetModal').hidden || !$('#printModal').hidden || !$('#viewerModal').hidden) return;
    if (e.key === 'ArrowLeft') { shiftPeriod(-1); }
    else if (e.key === 'ArrowRight') { shiftPeriod(1); }
    else if (e.key === 't' || e.key === 'T') { goToday(); }
    else if (e.key === 'n' || e.key === 'N') { openEditor(newEvent(S.sel), true); }
  });

  document.addEventListener('input', function (e) {
    if (e.target && e.target.id === 'qInput') {
      S.q = e.target.value;
      var pos = e.target.selectionStart;
      renderSearch();
      var inp = $('#qInput');
      if (inp) { inp.focus(); try { inp.setSelectionRange(pos, pos); } catch (er) {} }
    }
  });
}

/* ══════════════ 시작 ══════════════ */
function registerSW() {
  if (!('serviceWorker' in navigator)) return;
  if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') return;
  navigator.serviceWorker.register('./sw.js').catch(function (e) { console.warn('서비스 워커 등록 실패', e); });
}

function init() {
  buildLunar();
  var p = prefs();
  S.sel = parseYMD(p.sel) ? p.sel : todayYMD();
  S.view = ['day', 'week', 'month', 'year'].indexOf(p.view) >= 0 ? p.view : 'month';
  try {
    var qp = new URLSearchParams(location.search);
    var v = qp.get('view');
    if (['day', 'week', 'month', 'year'].indexOf(v) >= 0) { S.view = v; S.sel = todayYMD(); }
  } catch (e) {}
  loadEvents();
  buildColorRow();
  bindEvents();
  loadAtts().then(function () { renderAll(); }).catch(function () { renderAll(); });
  renderAll();
  ScheduleDrive.init();
  registerSW();
  if (p.printPhotos === false) $('#optPhotos').checked = false;
  if (p.printMemo === false) $('#optMemo').checked = false;
}
document.addEventListener('DOMContentLoaded', init);

</script>
